function fieldHTML(f){
  if(f.show && !f.show(S.inputs)) return "";
  const v=S.inputs[f.id];
  if(f.type==="num") return `<div class="field"><label for="f_${f.id}">${esc(f.label)}</label>
    <div class="stepper">
      <div class="val"><input id="f_${f.id}" data-num="${f.id}" inputmode="decimal" enterkeyhint="done" value="${String(v).replace(".",",")}">${f.unit?`<span class="unit">${esc(f.unit)}</span>`:""}</div>
      <div class="stepper-btns">
        <button type="button" class="st-minus" data-step="${f.id}" data-d="-1" aria-label="Disminuir ${esc(f.label)}">−</button>
        <button type="button" class="st-plus" data-step="${f.id}" data-d="1" aria-label="Aumentar ${esc(f.label)}">+</button>
      </div>
    </div></div>`;
  if(f.type==="choice"){
    const cls=f.options.length===3?"g3":f.options.length===2?"g2":"";
    return `<div class="field"><span class="flabel">${esc(f.label)}</span><div class="opts ${cls}" role="group" aria-label="${esc(f.label)}">
    ${f.options.map(([k,l])=>`<button type="button" class="opt" data-choice="${f.id}" data-v="${k}" aria-pressed="${v===k}">${esc(l)}</button>`).join("")}</div></div>`;
  }
  if(f.type==="multi") return `<div class="field"><span class="flabel">${esc(f.label)} <span class="muted small">(podés marcar varias)</span></span><div class="opts" role="group" aria-label="${esc(f.label)}">
    ${f.options.map(([k,l])=>{const on=v.includes(k);return `<button type="button" class="opt" data-multi="${f.id}" data-v="${k}" aria-pressed="${on}">${svg(on?"check":"plus",'class="ico"')}${esc(l)}</button>`;}).join("")}</div></div>`;
  if(f.type==="yesno") return `<button type="button" class="swrow inline" data-yes="${f.id}" data-v="${v?"0":"1"}" aria-pressed="${v===true}">
    <span class="swlbl">${esc(f.label)}</span><span class="sw" aria-hidden="true"></span></button>`;
  if(f.type==="text") return `<div class="field"><label for="f_${f.id}">${esc(f.label)}</label><input class="txt" id="f_${f.id}" data-text="${f.id}" value="${esc(v)}"></div>`;
}

function fieldsHTML(fields){
  const vis=fields.filter(f=>!f.show||f.show(S.inputs));
  let out="", idx=0;
  while(idx<vis.length){
    const a=vis[idx], b=vis[idx+1];
    if(a.type==="num"&&b&&b.type==="num"){
      out+=`<div class="fgrid">${fieldHTML(a)}${fieldHTML(b)}</div>`;
      idx+=2;
    } else {
      out+=fieldHTML(a);
      idx++;
    }
  }
  return out;
}

function drawing(){
  const j=S.job,i=S.inputs; if(!j.drawing) return "";
  const W=360,H=210,pad=34, A=i.ancho, B=i.alto, s=Math.min((W-2*pad)/A,(H-2*pad)/B);
  const w=A*s,h=B*s,x=(W-w)/2,y=(H-h)/2+4;
  let inner="", summaryTxt=`${A} × ${B} cm`;
  if(j.drawing==="mosq"){ const g=Math.max(6,Math.min(w,h)/10); let p="";
    for(let k=x+g;k<x+w;k+=g)p+=`M${k} ${y}V${y+h}`; for(let k=y+g;k<y+h;k+=g)p+=`M${x} ${k}H${x+w}`;
    inner=`<path d="${p}" stroke="var(--muted)" stroke-width=".8" opacity=".6"/>`;
    if(i.tipo==="corredizo") inner+=`<path d="M${x} ${y+h+6}H${x+w}" stroke="var(--ink)" stroke-width="3"/>`;
    if(i.tipo==="enrollable") inner+=`<rect x="${x-4}" y="${y-12}" width="${w+8}" height="12" rx="3" fill="var(--ink)"/>`;
    summaryTxt+=` · ${i.tipo}`;
  } else {
    const mat=i.material||"cano_2020";
    const doble=i.uso==="porton"&&i.apertura==="doble", corredizo=i.uso==="porton"&&i.apertura==="corredizo";
    let foot="";
    if(mat==="chapa_18"){
      inner=`<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${h-4}" fill="var(--line)" opacity=".45"/>`;
      foot="Chapa ciega BWG 18";
    } else if(mat==="metal_desp"){
      const g=Math.max(8,Math.min(w,h)/9); let p="";
      for(let k=0;k<w+h;k+=g){
        const x1=x+Math.max(0,k-h), y1=y+Math.min(h,k), x2=x+Math.min(w,k), y2=y+Math.max(0,k-w);
        p+=`M${x1} ${y1}L${x2} ${y2}`;
        const rx1=x+w-Math.max(0,k-h), rx2=x+w-Math.min(w,k);
        p+=`M${rx1} ${y1}L${rx2} ${y2}`;
      }
      inner=`<path d="${p}" stroke="var(--muted)" stroke-width="1" opacity=".65"/>`;
      foot="Metal desplegado";
    } else {
      const n=Math.max(0,Math.ceil(A/i.sep)-1); let p="";
      for(let k=1;k<=n;k++){const xx=x+w*k/(n+1);p+=`M${xx} ${y}V${y+h}`;}
      const tv=i.uso==="ventana"?2:3; for(let k=1;k<=tv;k++){const yy=y+h*k/(tv+1);p+=`M${x} ${yy}H${x+w}`;}
      inner=`<path d="${p}" stroke="var(--ink)" stroke-width="${mat==="hierro_12"||mat==="redondo_916"?"1.9":"2.4"}"/>`;
      foot=`${n} barrotes c/ ${i.sep} cm`;
    }
    if(doble){
      inner+=`<path d="M${x+w/2} ${y}V${y+h}" stroke="var(--ink)" stroke-width="4"/>`;
      foot+=" · 2 hojas";
    }
    if(corredizo){
      inner+=`<path d="M${x-10} ${y+h+7}H${x+w+10}" stroke="var(--ink)" stroke-width="3"/>`;
      inner+=`<circle cx="${x+14}" cy="${y+h+4}" r="3.5" fill="var(--accent)"/><circle cx="${x+w-14}" cy="${y+h+4}" r="3.5" fill="var(--accent)"/>`;
      foot+=" · corredizo";
    }
    if(i.uso!=="ventana"||i.cerradura){
      const cx=doble?(x+w/2-9):(x+w-8);
      inner+=`<circle cx="${cx}" cy="${y+h/2}" r="4.5" fill="var(--accent)"/>`;
    }
    inner+=`<text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="12" fill="var(--muted)" font-weight="700">${foot}</text>`;
    summaryTxt+=` · ${foot}`;
  }
  return `<details class="draw-det" data-sec="dibujo" ${S.open.dibujo?"open":""}>
    <summary><span><b>${esc(summaryTxt)}</b></span><span style="display:inline-flex;align-items:center;gap:4px;color:var(--accent)">Dibujo ${svg("chev",'class="chev"')}</span></summary>
    <div class="drawing"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dibujo ${A} por ${B} centímetros">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--card)" stroke="var(--ink)" stroke-width="4" rx="2"/>${inner}
      <g fill="var(--accent)" font-weight="800" font-size="15" font-family="system-ui, sans-serif">
      <text x="${W/2}" y="${y-(j.drawing==="mosq"&&i.tipo==="enrollable"?18:8)}" text-anchor="middle">${A} cm</text>
      <text x="${x-8}" y="${y+h/2}" text-anchor="end" dominant-baseline="middle">${B} cm</text></g></svg></div>
  </details>`;
}

function sec(key,title,sumv,inner){
  return `<details class="card" data-sec="${key}" ${S.open[key]?"open":""}><summary><h2>${title}</h2><span class="sumv">${sumv}</span>${svg("chev",'class="chev"')}</summary><div class="inner">${inner}</div></details>`;
}

const num=s=>{const v=parseFloat(String(s).replace(/\./g,"").replace(",","."));return isNaN(v)?null:v;};
const numDec=s=>{const v=parseFloat(String(s).replace(",","."));return isNaN(v)?null:v;};

function markCopied(btn){
  if(!btn || btn.classList.contains("iconbtn")) return;
  const prev=btn.innerHTML;
  btn.classList.add("copied");
  btn.innerHTML=`${svg("check")} ¡Copiado!`;
  clearTimeout(btn._ct);
  btn._ct=setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML=prev; },2200);
}

async function copy(text,ok,btn){
  try{ await navigator.clipboard.writeText(text); toast(ok); markCopied(btn); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(ok); markCopied(btn); }catch(e2){ toast("Mantené apretado el texto para copiarlo"); }
    document.body.removeChild(ta);
  }
}

function loadFromClickie(rawText){
  const el=document.getElementById("clickietxt");
  const txt=(rawText!==undefined ? rawText : (el?el.value:S.clickieText)||"").trim();
  S.clickieText=txt;
  if(!txt){
    S.errs.clickie="Pegá primero el pedido o necesidad del cliente.";
    renderHome();
    const ta=document.getElementById("clickietxt");
    if(ta) ta.focus();
    return;
  }
  const p=parseClickieOrder(txt);
  if(!p) return;
  S.errs.clickie="";
  S.note=p.note;
  openJob(p.jobId, p.inputs, p.extraMats, 1, p.extraItems);
  S.cliente=p.cliente||"";
  S.opts.usarComision=p.usarComision!==false;
  S.opts.urgente=!!p.urgente;
  S.opts.clienteCompra=!!p.clienteCompra;
  renderJob();
  toast("Presupuesto cargado desde Clickie");
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act],[data-go]"); if(!b) return;
  const d=b.dataset;

  if(d.go) return go(d.go);
  if(d.act==="installapp"&&S.installPrompt){ const ev=S.installPrompt; S.installPrompt=null; ev.prompt(); ev.userChoice.finally(()=>{ if(S.screen==="home") renderHome(); }); return; }
  if(d.act==="clickietoggle"){ S.clickieOpen=!S.clickieOpen; renderHome(); if(S.clickieOpen){ const ta=document.getElementById("clickietxt"); if(ta) ta.focus(); } return; }
  if(d.act==="clickieload") return loadFromClickie();
  if(d.act==="clickieclear"){ S.clickieText=""; S.errs.clickie=""; S.clickieOpen=false; return renderHome(); }
  if(d.act==="clickiepaste"){
    (async()=>{
      try{
        const t=(await navigator.clipboard.readText()||"").trim();
        if(t){ S.clickieText=t; S.errs.clickie=""; loadFromClickie(t); }
        else { S.clickieOpen=true; renderHome(); toast("El portapapeles está vacío. Pegalo en el cuadro"); const ta=document.getElementById("clickietxt"); if(ta) ta.focus(); }
      }catch(err){
        S.clickieOpen=true; renderHome();
        toast("Mantené apretado el cuadro de texto y tocá Pegar");
        const ta=document.getElementById("clickietxt"); if(ta) ta.focus();
      }
    })();
    return;
  }
  if(d.job){ S.note=null; return openJob(d.job); }
  if(d.fav!==undefined){ S.note=null; const f=favs[+d.fav]; reopen(f); S.histId=null; return; }
  if(d.delfav!==undefined){
    const idx=+d.delfav, fname=favs[idx]?.name||"este frecuente";
    return askConfirm("¿Borrar frecuente?",`Se va a quitar "${fname}" de tus trabajos frecuentes.`,"Borrar",b,()=>{
      favs.splice(idx,1); LS.set("presu_favs",favs); toast("Eliminado de frecuentes"); renderHome();
    });
  }
  if(d.hist!==undefined){ S.note="Precios recalculados con tus valores de hoy."; const x=hist[+d.hist]; reopen(x); S.histId=null; return; }
  if(d.mk!==undefined){ const x=hist[+d.mk]; x.estado=x.estado===d.v?null:d.v; LS.set("presu_hist",hist); return renderHome(); }

  /* Repuestos */
  if(d.repcat){ S.repCat=d.repcat; return renderRepuestos(); }
  if(d.act==="clrrep"){ S.repQuery=""; renderRepuestos(); const s=document.getElementById("repsearch"); if(s) s.focus(); return; }
  if(d.act==="togglenewrep"){
    S.newRepOpen=!S.newRepOpen; S.errs.nr=""; if(!S.newRepOpen) S.newRepDraft="";
    renderRepuestos();
    if(S.newRepOpen){ const el=document.getElementById("nr_n"); if(el) el.focus(); }
    return;
  }
  if(d.act==="newfromsearch"){
    S.newRepOpen=true; S.newRepDraft=S.repQuery.trim(); S.errs.nr="";
    renderRepuestos();
    const el=document.getElementById("nr_p"); if(el) el.focus();
    return;
  }
  if(d.act==="savenewrep"){
    const n=(document.getElementById("nr_n").value||"").trim();
    const u=(document.getElementById("nr_u").value||"u").trim()||"u";
    const p=num(document.getElementById("nr_p").value)||0;
    const cat=document.getElementById("nr_c").value||"propios";
    if(!n){ S.errs.nr="Escribí el nombre del repuesto antes de guardar."; S.newRepDraft=""; renderRepuestos(); const el=document.getElementById("nr_n"); if(el) el.focus(); return; }
    const k="u_"+Date.now().toString(36);
    customMats[k]={n,u,p,cat,q:n};
    prices[k]=p;
    LS.set("presu_custom_mats",customMats); LS.set("presu_prices",prices);
    S.newRepOpen=false; S.newRepDraft=""; S.errs.nr=""; toast("Repuesto guardado"); return renderRepuestos();
  }
  if(d.delcustom){
    const k=d.delcustom, name=customMats[k]?.n||"este repuesto";
    return askConfirm("¿Eliminar repuesto?",`Se va a borrar "${name}" de tu lista de repuestos propios.`,"Eliminar",b,()=>{
      delete customMats[k]; delete prices[k];
      LS.set("presu_custom_mats",customMats); LS.set("presu_prices",prices);
      toast("Repuesto eliminado"); renderRepuestos();
    });
  }
  if(d.cartq){
    const k=d.cartq, nv=Math.max(0,(S.repCart[k]||0)+(+d.d));
    if(nv===0) delete S.repCart[k]; else S.repCart[k]=nv;
    return renderRepuestos();
  }
  if(d.stepgo){ S.step=+d.stepgo; renderJob(); window.scrollTo(0,0); return; }

  /* Job actions */
  if(d.preset!==undefined){
    const pr=S.job.presets[+d.preset];
    Object.assign(S.inputs,pr.vals);
    toast("Medidas cargadas: "+pr.label);
    return rerenderJobKeepFocus();
  }
  if(d.com!==undefined){ S.opts.usarComision=d.com==="1"; return rerenderJobKeepFocus(); }
  if(d.ocom!==undefined){ O.usarComision=d.ocom==="1"; return rerenderObra(); }

  if(d.act==="openpicker"){
    S.pickerOpen=true; S.open.materiales=true; S.errs.ex="";
    rerenderJobKeepFocus();
    const el=document.getElementById("pickq"); if(el) el.focus();
    return;
  }
  if(d.act==="closepicker"){ S.pickerOpen=false; S.pickerQuery=""; S.errs.ex=""; return rerenderJobKeepFocus(); }
  if(d.pickmat){
    const ex=S.extraMats.find(x=>x.key===d.pickmat);
    if(ex) ex.qty+=1; else S.extraMats.push({key:d.pickmat,qty:1});
    toast("Repuesto sumado");
    return rerenderJobKeepFocus();
  }
  if(d.act==="addcustomex"){
    const n=(document.getElementById("ex_n").value||"").trim();
    const p=num(document.getElementById("ex_p").value)||0;
    if(!n){ S.errs.ex="Escribí el nombre del repuesto."; rerenderJobKeepFocus(); const el=document.getElementById("ex_n"); if(el) el.focus(); return; }
    S.extraMats.push({name:n,unit:"u",qty:1,price:p});
    S.pickerOpen=false; S.errs.ex=""; toast("Repuesto sumado");
    return rerenderJobKeepFocus();
  }
  if(d.mq){
    const m=S.res.mats.find(x=>x.key===d.mq&&x.extraIdx===undefined);
    if(m){
      const nv=Math.max(0, Math.round((m.qty+(+d.d))*10)/10);
      if(nv===m.autoQty) delete S.qtyOv[d.mq]; else S.qtyOv[d.mq]=nv;
    }
    return rerenderJobKeepFocus();
  }
  if(d.exq!==undefined){
    const em=S.extraMats[+d.exq];
    if(em){ em.qty=Math.max(0, Math.round((em.qty+(+d.d))*10)/10); if(em.qty===0) S.extraMats.splice(+d.exq,1); }
    return rerenderJobKeepFocus();
  }
  if(d.exdel!==undefined){ S.extraMats.splice(+d.exdel,1); return rerenderJobKeepFocus(); }

  if(d.act==="pedircopiar") return copy(pedirMessage(S.job,cfg),"Mensaje copiado para pedir medidas",b);
  if(d.act==="wa"){ saveHist(); toast("Guardado en Últimos presupuestos"); return; }
  if(d.act==="draft"){ const x=LS.get("presu_draft",null); if(x){ S.note=null; reopen(x); } return; }
  if(d.act==="nodraft"){ try{localStorage.removeItem("presu_draft");}catch(x){} return renderHome(); }
  if(d.hreset!==undefined){ delete S.hoursOv[d.hreset]; return rerenderJobKeepFocus(); }
  if(d.act==="opcion1"){ S.opts.opcion1={desc:S.res.desc,total:S.res.total,incluye:[...S.res.incluye]}; S.opts.rango=false; toast("Opción 1 guardada. Cambiá lo que quieras para la 2"); return rerenderJobKeepFocus(); }
  if(d.act==="quitaro1"){ S.opts.opcion1=null; return rerenderJobKeepFocus(); }
  if(d.act==="fav"){
    const inp=document.getElementById("favname");
    if(inp.classList.contains("hidden")){ inp.classList.remove("hidden"); inp.value=S.res.desc; inp.focus(); b.lastChild.textContent=" Listo, guardar"; return; }
    favs.unshift({name:inp.value.trim()||S.res.desc,jobId:S.job.id,inputs:JSON.parse(JSON.stringify(S.inputs)),extraItems:JSON.parse(JSON.stringify(S.extraItems)),hoursOv:{...S.hoursOv},qtyOv:{...S.qtyOv},extraMats:JSON.parse(JSON.stringify(S.extraMats)),opts:{...S.opts,opcion1:null,rango:false}});
    favs=favs.slice(0,12); LS.set("presu_favs",favs); toast("Guardado en frecuentes"); return rerenderJobKeepFocus();
  }

  /* Inflación (con diálogo de confirmación) */
  if(d.subir){
    const pct=+d.subir, ks=Object.keys(prices);
    if(!ks.length){ toast("Primero guardá tus precios propios"); return; }
    return askConfirm(`¿Subir tus precios un ${pct}%?`,`Se van a actualizar ${ks.length} precio${ks.length>1?"s":""} guardado${ks.length>1?"s":""} en este celular.`,"Subir "+pct+"%",b,()=>{
      const f=1+pct/100;
      ks.forEach(k=>prices[k]=Math.round(prices[k]*f/100)*100);
      Object.keys(customMats).forEach(k=>{ customMats[k].p=prices[k]??Math.round(customMats[k].p*f/100)*100; });
      LS.set("presu_prices",prices); LS.set("presu_custom_mats",customMats);
      toast(`Subí ${ks.length} precios un ${pct}%`);
      renderRepuestos();
    });
  }

  /* Backup (con diálogo y error inline) */
  if(d.act==="backup"){ const s=btoa(unescape(encodeURIComponent(JSON.stringify({cfg,prices,customMats,favs,hist,taller:T})))); return copy("PRESU:"+s,"Copia de seguridad copiada",b); }
  if(d.act==="restore"){
    const raw=(document.getElementById("restoretxt").value||"").trim();
    if(!raw){ S.errs.restore="Pegá primero el texto de tu copia de seguridad."; renderPrecios(); const el=document.getElementById("restoretxt"); if(el) el.focus(); return; }
    let parsed=null;
    try{
      parsed=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/^PRESU:/,"")))));
    }catch(err){
      S.errs.restore="Ese texto no es una copia válida. Copiala entera desde PRESU: y probá de nuevo.";
      renderPrecios();
      const el=document.getElementById("restoretxt"); if(el){ el.value=raw; el.focus(); }
      return;
    }
    return askConfirm("¿Reemplazar los datos de este celular?","Esta acción reemplaza tus tarifas, repuestos e historial actuales por los de la copia.","Recuperar",b,()=>{
      cfg={...DEFAULT_CONFIG,...parsed.cfg}; prices=parsed.prices||{}; customMats=parsed.customMats||{}; favs=parsed.favs||[]; hist=parsed.hist||[];
      if(parsed.taller){
        T=tNormalizeT(parsed.taller);
        saveT();
      }
      LS.set("presu_cfg",cfg); LS.set("presu_prices",prices); LS.set("presu_custom_mats",customMats); LS.set("presu_favs",favs); LS.set("presu_hist",hist);
      S.errs.restore=""; applyTheme(); toast("¡Datos recuperados!"); go("home");
    });
  }

  if(d.act==="home") return go("home");
  if(d.rubro){ O.rubro=d.rubro; return rerenderObra(); }
  if(d.oq){ const L=obraLine(d.oq); L.qty=Math.max(0,Math.round((L.qty+(+d.d))*100)/100); return rerenderObra(); }
  if(d.lvl){ obraLine(d.lvl).lvl=d.v; return rerenderObra(); }
  if(d.oopt){ O[d.oopt]=!O[d.oopt]; return rerenderObra(); }
  if(d.omat){ O.conMat=d.omat==="1"; return rerenderObra(); }
  if(d.act==="ocopiar") return copy(obraMessage(S.obraRes,cfg,O.conMat),"Mensaje copiado",b);
  if(d.act==="olista") return copy(shoppingList(S.obraRes),"Lista copiada",b);

  if(d.act==="copiar"){ saveHist(); return copy(clientMessage(S.res,cfg,S.opts), S.res.usarComision?"Copiado para Clickie y guardado":"Presupuesto copiado y guardado",b); }
  if(d.act==="copiarnum"){ saveHist(); return copy(String(Math.round(S.res.total)),`Monto copiado: ${ars(S.res.total)}`,b); }
  if(d.act==="lista") return copy(shoppingList(S.res),"Lista de ferretería copiada",b);
  if(d.act==="additem"){
    if(!S.job||!S.job.multiItem) return;
    S.extraItems.push(JSON.parse(JSON.stringify(S.inputs)));
    S.inputs={...S.inputs,cant:1};
    S.qtyOv={};
    const fem=S.job.id==="reja";
    toast(`${S.job.multiSingular} sumad${fem?"a":"o"} · cargá ${fem?"la":"el"} siguiente`);
    renderJob();
    const el=document.getElementById("fields");
    if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  if(d.act==="dropcurr"){
    if(!S.extraItems.length) return;
    S.inputs=S.extraItems.pop();
    S.qtyOv={};
    toast(`${S.job.multiSingular} quitad${S.job.id==="reja"?"a":"o"}`);
    return rerenderJobKeepFocus();
  }
  if(d.edititem!==undefined){
    const idx=+d.edititem;
    if(S.extraItems[idx]){
      const prev=JSON.parse(JSON.stringify(S.inputs));
      S.inputs=S.extraItems[idx];
      S.extraItems[idx]=prev;
      toast("Editando "+S.job.itemLabel(S.inputs).short);
      renderJob();
      const el=document.getElementById("fields");
      if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"});
    }
    return;
  }
  if(d.delitem!==undefined){
    const idx=+d.delitem;
    if(S.extraItems[idx]){
      S.extraItems.splice(idx,1);
      S.qtyOv={};
      toast(`${S.job.multiSingular} quitad${S.job.id==="reja"?"a":"o"}`);
    }
    return rerenderJobKeepFocus();
  }
  if(d.act==="rejataller"){
    const allList=[...S.extraItems,S.inputs];
    const totU=allList.reduce((a,x)=>a+(x.cant||1),0);
    const cuts=rejaCutsAll(allList);
    const load=()=>{
      const toModel=(ref,idx)=>{
        const mat=ref.material||"cano_2020", esHoja=mat==="chapa_18"||mat==="metal_desp";
        const ventana=ref.uso==="ventana", porton=ref.uso==="porton";
        const pfx=({ventana:"V",puerta:"PTA",porton:"POR"})[ref.uso]||"R";
        const cant=Math.max(1,ref.cant||1);
        return {
          ...T_MODEL_DEF,
          type: ventana ? "reja" : "porton",
          label: `${pfx}${idx+1} ${ref.ancho}×${ref.alto}${cant>1?` (×${cant})`:""}`,
          cant,
          ancho: Math.round((ref.ancho||120)*10),
          alto: Math.round((ref.alto||100)*10),
          sep: Math.round((ref.sep||12)*10),
          travesanos: ventana ? 2 : 3,
          hojas: porton && ref.apertura==="doble" ? 2 : 1,
          corredizo: porton && ref.apertura==="corredizo",
          ang: ventana && !esHoja ? "90" : "45",
          pMarco: ventana ? (esHoja ? "cano_3030" : "cano_2020") : "cano_4040",
          pInt: esHoja ? "cano_2020" : mat,
          pExtra: "planchuela"
        };
      };
      T.workId=tId();
      T.cuts=cuts.map(c=>({...c,id:tId()}));
      T.obra=(S.cliente?S.cliente+" — ":"")+S.res.desc;
      T.done={};
      T.models=allList.map(toModel);
      T.modelIdx=0;
      T.model={...T.models[0]};
      T.modelActive=true;
      S.tSel=null;
      T.step=2;
      saveT();
      toast(allList.length>1?`Cortes y planos de ${totU} aberturas listos en Taller`:"Cortes y plano listos en Taller");
      go("taller");
    };
    return T.cuts.length ? askConfirm(allList.length>1?`¿Cargar estas ${totU} aberturas en Taller?`:"¿Cargar esta reja en Taller?","Si ya tenés cortes cargados en Taller, se van a reemplazar (podés guardar tu obra actual antes desde Taller).","Cargar en Taller",b,load) : load();
  }

  if(d.mopen!==undefined){ S.openMat = S.openMat===d.mopen ? null : d.mopen; return rerenderJobKeepFocus(); }
  if(d.step){
    const f=S.job.fields.find(x=>x.id===d.step);
    let v=Math.round((S.inputs[f.id]+f.step*(+d.d))*100)/100;
    if(v>f.max||v<f.min) toast(v>f.max?`Máximo ${fmtQ(f.max)} ${f.unit}`:`Mínimo ${fmtQ(f.min)} ${f.unit}`);
    S.inputs[f.id]=Math.min(f.max,Math.max(f.min,v));
    return rerenderJobKeepFocus();
  }
  if(d.choice){ S.inputs[d.choice]=d.v; return rerenderJobKeepFocus(); }
  if(d.multi){ const a=S.inputs[d.multi]; const k=a.indexOf(d.v); k<0?a.push(d.v):a.splice(k,1); return rerenderJobKeepFocus(); }
  if(d.yes){ S.inputs[d.yes]=d.v==="1"; return rerenderJobKeepFocus(); }
  if(d.h!==undefined){ const t=S.res.tasks[+d.h]; const v=Math.max(0.25,t.hours+(+d.d)); if(v===t.auto) delete S.hoursOv[t.name]; else S.hoursOv[t.name]=v; return rerenderJobKeepFocus(); }
  if(d.opt){ S.opts[d.opt]=!S.opts[d.opt]; return rerenderJobKeepFocus(); }
  if(d.iva){ cfg.iva=d.iva==="1"; LS.set("presu_cfg",cfg); return renderPrecios(); }
  if(d.setcom){ cfg.comision=+d.setcom; LS.set("presu_cfg",cfg); toast(`Comisión Clickie: ${cfg.comision}%`); return renderPrecios(); }
  if(d.sena){ cfg.sena_modo=d.sena; LS.set("presu_cfg",cfg); toast(d.sena==="50"?"Seña: 50% del total":"Seña: costo de materiales"); return renderPrecios(); }
  if(d.soloherr!==undefined){ cfg.solo_herreria=d.soloherr==="1"; LS.set("presu_cfg",cfg); toast(cfg.solo_herreria?"Mostrando solo herrería":"Mostrando todos los rubros"); return S.screen==="home"?renderHome():renderPrecios(); }
  if(d.theme){ cfg.theme=d.theme; LS.set("presu_cfg",cfg); applyTheme(); return renderPrecios(); }
});

app.addEventListener("change",e=>{
  const el=e.target, d=el.dataset;
  if(d.num){
    const f=S.job.fields.find(x=>x.id===d.num);
    const v=f.unit==="$"?num(el.value):numDec(el.value);
    if(v!==null){
      if(v>f.max||v<f.min) toast(v>f.max?`Máximo ${fmtQ(f.max)} ${f.unit}`:`Mínimo ${fmtQ(f.min)} ${f.unit}`);
      S.inputs[f.id]=Math.min(f.max,Math.max(f.min,v));
    }
    return rerenderJobKeepFocus();
  }
  if(d.text){ S.inputs[d.text]=el.value; return rerenderJobKeepFocus(); }
  if(d.cliente!==undefined){ S.cliente=el.value; return rerenderJobKeepFocus(); }
  if(d.oqin){ const v=numDec(el.value); if(v!==null) obraLine(d.oqin).qty=Math.max(0,v); return rerenderObra(); }
  if(d.oviaje!==undefined){ const v=num(el.value); if(v!==null) O.viaje=v; return rerenderObra(); }
  if(d.price){
    const v=num(el.value);
    if(v!==null){
      prices[d.price]=v;
      if(customMats[d.price]){ customMats[d.price].p=v; LS.set("presu_custom_mats",customMats); }
      LS.set("presu_prices",prices);
      toast("Precio guardado");
    }
    if(S.screen==="job") return rerenderJobKeepFocus();
    if(S.screen==="obra") return rerenderObra();
    if(S.screen==="repuestos") return renderRepuestos();
    return;
  }
  if(d.exprice!==undefined){
    const v=num(el.value);
    if(v!==null&&S.extraMats[+d.exprice]){ S.extraMats[+d.exprice].price=v; }
    return rerenderJobKeepFocus();
  }
  if(d.viaje!==undefined){ const v=num(el.value); if(v!==null) S.opts.viaje=v; return rerenderJobKeepFocus(); }
  if(d.cfg){
    const money=MONEY_KEYS.includes(d.cfg), v=money?num(el.value):numDec(el.value);
    if(v!==null){
      cfg[d.cfg]=d.cfg==="comision"?Math.min(60,Math.max(0,v)):v;
      LS.set("presu_cfg",cfg);
      el.value=money?fmtN(cfg[d.cfg]):String(cfg[d.cfg]).replace(".",",");
      toast("Guardado");
      if(d.cfg==="comision") renderPrecios();
    } else {
      toast("Escribí solo números");
      el.value=money?fmtN(cfg[d.cfg]):cfg[d.cfg];
    }
    return;
  }
  if(d.cfgtxt){ cfg[d.cfgtxt]=el.value; LS.set("presu_cfg",cfg); toast("Guardado"); return; }
});

/* ---------- TALLER: cortes de barras + modelo visual 2D (3 pasos: 1. Cargar cortes -> 2. Plan y compra -> 3. Retazos) ---------- */
const tId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const T_MODEL_DEF={type:"reja",label:"",cant:1,ancho:1200,alto:1000,prof:600,sep:120,travesanos:2,hojas:1,corredizo:false,ang:"45",pMarco:"cano_4040",pInt:"cano_2020",pExtra:"planchuela"};
const T_DEF={workId:"",obra:"",step:1,barra:6000,disco:3,minSob:300,cuts:[],done:{},retazos:[],obras:[],recetas:{},lastFinish:null,usarRetazos:true,modelActive:false,model:{...T_MODEL_DEF},models:[],modelIdx:0,form:{perfil:"cano_4040",parte:"",ang:"90",u:"mm",txt:""}};
/* Arma un T válido desde datos guardados o de un backup (completa lo que falte, arregla lo roto). */
function tNormalizeT(raw){
  const t={...T_DEF,...((raw&&typeof raw==="object"&&!Array.isArray(raw))?raw:{})};
  t.form={...T_DEF.form,...(t.form||{})};
  t.model={...T_MODEL_DEF,...(t.model||{})};
  if(!Array.isArray(t.models)) t.models=[];
  if(!t.workId) t.workId=tId();
  if(![1,2,3].includes(t.step)) t.step=1;
  if(!Array.isArray(t.cuts)) t.cuts=[];
  if(!Array.isArray(t.retazos)) t.retazos=[];
  if(!Array.isArray(t.obras)) t.obras=[];
  if(!t.done||typeof t.done!=="object") t.done={};
  t.recetas=(t.recetas&&typeof t.recetas==="object"&&!Array.isArray(t.recetas))?{...t.recetas}:{};
  if(!t.lastFinish||typeof t.lastFinish!=="object"||!Array.isArray(t.lastFinish.usedRets)) t.lastFinish=null;
  return t;
}
let T=tNormalizeT(LS.get("presu_taller",{}));
const saveT=()=>LS.set("presu_taller",T);

/* Convierte un número escrito a mm según unidad ('mm' o 'cm'). En 'mm', <20 se toma como metros (2,64 → 2640). */
function tToMm(v,u){
  if(v===null||isNaN(v)||v<=0) return null;
  if(u==="cm") return Math.round(v*10);
  return Math.round(v<20?v*1000:v);
}
const tLen=s=>tToMm(numDec(String(s).trim()),"mm");

/* Lee "2640x2 1530x3" (también acepta "2x2640", "2,40 x 4", "120x4" en cm). Sin cantidad = 1. */
function tParse(txt,u){
  const unit=u||"mm", out=[], re=/(\d+(?:[.,]\d+)?)\s*(?:(?:x|×|\*|por)\s*(\d+))?/gi;
  let m;
  while((m=re.exec(String(txt||"")))){
    const raw1=m[1], v1=parseFloat(raw1.replace(",","."));
    let len, qty;
    if(m[2]){
      const v2=parseInt(m[2],10);
      const hasDec=/[.,]/.test(raw1);
      /* Si escribió cantidad adelante (ej. "2x2640" o "4x150" en cm): invertir automáticamente */
      if(!hasDec && v1>=1 && v1<=50 && v2>=100 && v2>v1){
        len=tToMm(v2,unit);
        qty=Math.round(v1);
      } else {
        len=tToMm(v1,unit);
        qty=v2;
      }
    } else {
      len=tToMm(v1,unit);
      qty=1;
    }
    if(len&&qty>0) out.push({len,qty:Math.min(qty,500)});
  }
  return out;
}

/* Perfiles = todo lo del catálogo (y propios) que se vende por barra. */
function tPerfiles(){
  const all=getAllCatalog(customMats);
  return Object.entries(all).filter(([,c])=>/barra/i.test(c.u))
    .map(([k,c])=>({key:k,n:c.n,q:c.q,kgm:c.kgm||0,price:prices[k]??c.p??0,example:prices[k]===undefined&&!c.customDef}));
}

/* Llena cada barra (o retazo disponible) con DP en décimas de mm (enteros: soporta disco decimal ej. 1,6 mm sin colgarse). */
function tPackOne(rem,barLen,disco){
  const S=10, B=Math.round(barLen*S), D=Math.round(disco*S), cap=B+D;
  if(cap<=0) return null;
  const reach=new Int32Array(cap+1).fill(-1); reach[0]=-2;
  let best=0;
  for(let i=0;i<rem.length&&best<cap;i++){
    const w=Math.round(rem[i].len*S)+D;
    if(w<=0||w>cap) continue;
    for(let c=cap;c>=w;c--) if(reach[c]===-1&&reach[c-w]!==-1){ reach[c]=i; if(c>best) best=c; }
  }
  if(best===0) return null;
  const take=new Set(); let c=best;
  while(c>0){ const i=reach[c]; if(i<0) break; take.add(i); c-=Math.round(rem[i].len*S)+D; }
  if(!take.size) return null;
  const pieces=rem.filter((_,i)=>take.has(i));
  const nextRem=rem.filter((_,i)=>!take.has(i));
  const used=pieces.reduce((s,p)=>s+p.len,0)+disco*pieces.length;
  const sobra=Math.max(0,Math.round((barLen-used)*10)/10);
  return {pieces,sobra,len:barLen,nextRem};
}

function tPack(pcs,barra,disco,retazos){
  const largas=pcs.filter(p=>p.len>barra);
  let rem=pcs.filter(p=>p.len<=barra).sort((a,b)=>b.len-a.len);
  const bars=[];
  /* Primero intentar ubicar cortes en retazos guardados del taller (de menor a mayor para cuidar los largos) */
  const rets=(retazos||[]).map(r=>typeof r==="number"?{len:r}:r).filter(r=>r.len>0&&r.len<=barra).sort((a,b)=>a.len-b.len);
  for(const ret of rets){
    if(!rem.length) break;
    const rLen=ret.len, fit=tPackOne(rem,rLen,disco);
    if(fit){
      bars.push({pieces:fit.pieces,sobra:fit.sobra,len:rLen,retazo:true,retId:ret.id});
      rem=fit.nextRem;
    }
  }
  while(rem.length){
    const fit=tPackOne(rem,barra,disco);
    if(!fit) break;
    bars.push({pieces:fit.pieces,sobra:fit.sobra,len:barra,retazo:false});
    rem=fit.nextRem;
  }
  return {bars,largas};
}

function tPlan(cuts,barra,disco,retazosList){
  const by={}, retBy={};
  (retazosList||[]).forEach(r=>{ (retBy[r.perfil]=retBy[r.perfil]||[]).push({id:r.id,len:r.len}); });
  cuts.forEach(c=>{ const a=(by[c.perfil]=by[c.perfil]||[]); for(let i=0;i<c.qty;i++) a.push({len:c.len,parte:c.parte,ang:c.ang}); });
  return Object.entries(by).map(([perfil,pcs])=>{
    const rets=retBy[perfil]||[];
    const r=tPack(pcs,barra,disco,rets);
    const newBars=r.bars.filter(b=>!b.retazo);
    const retUsed=r.bars.filter(b=>b.retazo);
    const empBars=r.largas.length?Math.ceil(r.largas.reduce((s,p)=>s+p.len,0)/barra):0;
    return {perfil,...r,newBars,retUsed,empBars,buyBars:newBars.length+empBars,tips:tTips(pcs,r.bars,barra,disco,rets)};
  });
}

/* Si achicando un corte unos pocos mm entra uno más por barra (ahorra barras o deja un sobrante largo entero), avisa. */
function tTips(pcs,bars,barra,disco,rets){
  const tips=[], cap=barra+disco, cnt={}, nBars=bars.filter(b=>!b.retazo).length;
  const maxSob=bars.filter(b=>!b.retazo).reduce((m,b)=>Math.max(m,b.sobra),0);
  pcs.forEach(p=>{ if(p.len<=barra) cnt[p.len]=(cnt[p.len]||0)+1; });
  Object.entries(cnt).forEach(([L,n])=>{
    L=+L; if(n<2) return;
    const k=Math.floor(cap/(L+disco)); if(k<1) return;
    const L2=Math.floor(cap/(k+1)-disco), d=L-L2;
    if(d<=0||d>10) return;
    const alt=pcs.map(p=>p.len===L?{...p,len:L2}:p);
    const r2=tPack(alt,barra,disco,rets), nb=r2.bars.filter(b=>!b.retazo).length;
    const maxSob2=r2.bars.filter(b=>!b.retazo).reduce((m,b)=>Math.max(m,b.sobra),0);
    if(nb<nBars) tips.push({L,L2,ahorro:nBars-nb});
    else if(nb===nBars&&maxSob2-maxSob>=1000) tips.push({L,L2,ahorro:0,sobra:maxSob2});
  });
  return tips;
}

/* Agrupa barras iguales consecutivas: "Barras 1 a 3 (×3)". Numera las barras nuevas desde 1, aparte de los retazos. */
function tGroupBars(bars){
  const out=[]; let barIdx=0;
  bars.forEach(b=>{
    if(!b.retazo) barIdx++;
    const sig=(b.retazo?"R"+b.len:"B")+":"+b.pieces.map(p=>p.len+"|"+(p.parte||"")+"|"+p.ang).join(",");
    const last=out[out.length-1];
    if(last&&last.sig===sig) last.n++; else out.push({sig,bar:b,n:1,from:b.retazo?0:barIdx});
  });
  return out;
}

/* ---------- Stock de retazos que se actualiza solo ---------- */
/* Retazos que el plan puede usar: los del taller (menos los que salieron de esta misma obra) + los que esta obra ya gastó al terminar. */
function tActiveRets(){
  if(!T.usarRetazos) return [];
  const own=T.retazos.filter(r=>!r.fromWork||r.fromWork!==T.workId);
  const lf=T.lastFinish&&T.lastFinish.workId===T.workId?T.lastFinish.usedRets:[];
  return [...own,...lf];
}
const tTerminada=()=>!!(T.lastFinish&&T.lastFinish.workId===T.workId);

/* Sobrantes de barras nuevas que valen la pena guardar, agrupados por perfil y largo. */
function tLeftovers(plan,minSob){
  const map=new Map();
  plan.forEach(g=>g.newBars.forEach(b=>{
    const len=Math.floor(b.sobra);
    if(b.sobra<minSob||len<=0) return;
    const k=g.perfil+"|"+len, it=map.get(k);
    if(it) it.n++; else map.set(k,{perfil:g.perfil,len,n:1});
  }));
  return [...map.values()].sort((a,b)=>b.len-a.len);
}

/* "Terminé de cortar": descuenta del stock los retazos usados, guarda los sobrantes elegidos y la obra. Una sola vez por obra. */
function tFinishCutting(plan,keep){
  if(tTerminada()) return {usados:0,guardados:0};
  const usedRets=[];
  plan.forEach(g=>g.retUsed.forEach(b=>{
    const r=b.retId&&T.retazos.find(x=>x.id===b.retId);
    if(r) usedRets.push({id:r.id,perfil:r.perfil,len:r.len});
  }));
  const ids=new Set(usedRets.map(r=>r.id));
  T.retazos=T.retazos.filter(r=>!ids.has(r.id));
  let guardados=0;
  (keep||[]).forEach(k=>{
    const len=Math.floor(+k.len), n=Math.floor(+k.n);
    if(!(len>0)||!(n>0)||typeof k.perfil!=="string") return;
    for(let i=0;i<n;i++){ T.retazos.push({id:tId(),perfil:k.perfil,len,fromWork:T.workId}); guardados++; }
  });
  plan.forEach(g=>tGroupBars(g.bars).forEach((x,gi)=>{ T.done[g.perfil+"|"+gi+"|"+x.sig]=true; }));
  if(T.cuts.length){
    const name=(T.obra||"").trim()||("Obra "+new Date().toLocaleDateString("es-AR",{day:"numeric",month:"short"}));
    if(!T.obras.some(x=>String(x.obra||"").toLowerCase()===name.toLowerCase())){
      T.obras.unshift(tObraEntry(name)); T.obras=T.obras.slice(0,15);
    }
    T.obra=name;
  }
  T.lastFinish={workId:T.workId,usedRets};
  saveT();
  return {usados:usedRets.length,guardados};
}

/* Texto del aviso "Usás N retazos que ya tenés: …" ('' si el plan no usa ninguno). */
function tRetUsedText(plan,pmap){
  const items=[];
  plan.forEach(g=>g.retUsed.forEach(b=>items.push(`${pmap[g.perfil]?.n||g.perfil} de ${Math.round(b.len)} mm`)));
  if(!items.length) return "";
  return `Usás ${items.length} retazo${items.length>1?"s":""} que ya tenés: ${items.join(" · ")}`;
}

/* Ficha técnica de un perfil del plan: kilos cortados, plata en barras a comprar, mm que sobran de barras nuevas. */
function tSpec(g,pmap){
  const p=pmap[g.perfil]||{}, cut=g.bars.reduce((s,b)=>s+b.pieces.reduce((a,x)=>a+x.len,0),0)+g.largas.reduce((s,x)=>s+x.len,0);
  return {kg:p.kgm?Math.round(cut/1000*p.kgm*10)/10:0,pesos:g.buyBars*(p.price||0),sobra:g.newBars.reduce((s,b)=>s+b.sobra,0)};
}

function tObraEntry(name){
  return {id:tId(),obra:name,date:Date.now(),barra:T.barra,disco:T.disco,minSob:T.minSob,model:{...T.model},modelActive:!!T.modelActive,cuts:JSON.parse(JSON.stringify(T.cuts))};
}

const tClamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
const T_ROLES=["pMarco","pInt","pExtra"];
const tIsPuerta=t=>t==="puerta"||t==="puertareja";

/* Valores de arranque de un tipo: los del tipo, pisados por "mi receta" si existe y sus perfiles todavía están en el catálogo. */
function tTypeDef(id){
  const tpl=T_MODELS.find(x=>x.id===id)||T_MODELS[0];
  const def={...T_MODEL_DEF,...tpl.def,type:tpl.id};
  const rec=T.recetas&&T.recetas[tpl.id];
  if(rec&&typeof rec==="object"){
    const ok=new Set(tPerfiles().map(p=>p.key));
    T_ROLES.forEach(k=>{ if(typeof rec[k]==="string"&&ok.has(rec[k])) def[k]=rec[k]; });
  }
  return def;
}
/* ¿Los perfiles del modelo son distintos a los de arranque de su tipo? (para ofrecer guardar receta) */
function tRecetaDiffiere(m){
  const base=tTypeDef(m.type);
  return T_ROLES.some(k=>m[k]!==base[k]);
}

function tModelPieces(m){

    out.push({key:"marco_v",label:"Marco V",parte:"MAR V",perfil:pM,len:B,qty:(doble?4:2)*n,ang,role:"marco"});
    if(nBar>0) out.push({key:"barrote",label:"Barrotes",parte:"BAR",perfil:pI,len:lBar,qty:nBar*n,ang:"90",role:"int"});
    if(tv>0) out.push({key:"trav",label:"Travesaños",parte:"TRAV",perfil:pE,len:A,qty:tv*n,ang:"90",role:"extra"});
    if(m.corredizo) out.push({key:"riel",label:"Riel",parte:"RIEL",perfil:"riel_porton",len:Math.min(6000,A*2),qty:n,ang:"90",role:"extra"});
  } else if(m.type==="marco"){

    out.push({key:"marco_v",label:"Marco V",parte:"MAR V",perfil:pM,len:B,qty:2*n,ang,role:"marco"});

    if(rows>1) out.push({key:"trav",label:"Travesaños",parte:"TRAV",perfil:pI,len:Math.max(100,A-80),qty:(rows-1)*n,ang:"90",role:"int"});
  } else if(m.type==="pano"){
    const cols=tClamp(m.hojas||1,1,5), rows=tClamp(m.travesanos||1,1,5);
    out.push({key:"marco_h",label:"Marco H",parte:"MAR H",perfil:pM,len:A,qty:2*n,ang,role:"marco"});
    out.push({key:"marco_v",label:"Marco V",parte:"MAR V",perfil:pM,len:B,qty:2*n,ang,role:"marco"});
    if(cols>1) out.push({key:"par",label:"Parantes",parte:"PAR",perfil:pI,len:Math.max(100,B-80),qty:(cols-1)*n,ang:"90",role:"int"});
    if(rows>1) out.push({key:"trav",label:"Travesaños",parte:"TRAV",perfil:pI,len:Math.max(100,A-80),qty:(rows-1)*n,ang:"90",role:"int"});
  } else if(tIsPuerta(m.type)){

    out.push({key:"marco_v",label:"Bastidor V",parte:"BAS V",perfil:pM,len:B,qty:2*n,ang,role:"marco"});

    out.push({key:"cab",label:"Lateral est.",parte:"EST P",perfil:pE,len:Math.max(100,P-40),qty:est*2*n,ang:"90",role:"extra"});

  return out;
}

function tMatchSel(item,perfil,sel){
  if(!sel) return false;
  const p=perfil||item.perfil;
  if(sel.perfil && p && sel.perfil!==p) return false;
  if(sel.len && item.len!==sel.len) return false;
  return true;
}

function tFindBarsForSel(plan,sel){
  if(!sel||!plan) return [];
  const hits=[];
  plan.forEach(g=>{
    if(sel.perfil && g.perfil!==sel.perfil) return;
    tGroupBars(g.bars).forEach(x=>{
      const cnt=x.bar.pieces.filter(p=>tMatchSel(p,g.perfil,sel)).length;
      if(cnt>0) hits.push(`${tRango(x)}${cnt>1?` (×${cnt})`:""}`);
    });
  });
  return hits;
}

function tIsPieceDone(piece,plan){
  if(!plan||!plan.length) return false;
  let found=0, doneCnt=0;
  plan.forEach(g=>{
    if(g.perfil!==piece.perfil) return;
    tGroupBars(g.bars).forEach((x,gi)=>{
      if(x.bar.pieces.some(p=>p.len===piece.len)){
        found++;
        const dk=g.perfil+"|"+gi+"|"+x.sig;
        if(T.done[dk]) doneCnt++;
      }
    });
  });
  return found>0&&found===doneCnt;
}

function tModelSVG(m,pmap,sel,opts){
  const print=!!(opts&&opts.forPrint), plan=opts&&opts.plan;
  const W=380, H=240, pieces=tModelPieces(m);
  const byKey=Object.fromEntries(pieces.map(p=>[p.key,p]));
  const hasSel=!print&&!!sel;
  const tag=(cx,cy,p,isDone)=>{
    const txt=`${isDone?"✓ ":""}${p.qty}×${p.len}${p.ang==="45"?" 45°":""}`;
    const tw=Math.max(46,txt.length*6.1+10), th=16;
    const x0=Math.max(4,Math.min(W-tw-4,cx-tw/2));
    const y0=Math.max(4,Math.min(H-th-18,cy-th/2));
    const rCls=p.role==="int"?" r-int":(p.role==="extra"?" r-extra":"");
    return `<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${tw.toFixed(1)}" height="${th}" rx="4" class="tm-tag-bg${rCls}"/><text x="${(x0+tw/2).toFixed(1)}" y="${(y0+th/2+3.3).toFixed(1)}" text-anchor="middle" class="tm-tag-t">${esc(txt)}</text>`;
  };
  const grp=(key,inner,hitPath,tagPos)=>{
    const p=byKey[key];
    if(!p) return "";
    const hl=hasSel&&tMatchSel(p,p.perfil,sel);
    const isDone=!print&&tIsPieceDone(p,plan);
    const cls=`tm-hit${hl?" hl":(hasSel?" dim":"")}${isDone?" done":""}`;
    const payload=esc(JSON.stringify({key:p.key,label:p.label,parte:p.parte,perfil:p.perfil,len:p.len,qty:p.qty,ang:p.ang}));
    const attrs=print?"":` class="${cls}" data-tsel="${payload}" role="button" tabindex="0" aria-label="${esc(p.label)} ${p.qty} cortes de ${p.len} mm"`;
    const callout=tagPos?tag(tagPos[0],tagPos[1],p,isDone):"";
    return `<g${attrs}>${inner}${!print&&hitPath?`<path d="${hitPath}" fill="none" stroke="transparent" stroke-width="14"/>`:""}${callout}</g>`;
  };
  const dimH=(x1,x2,y,txt)=>`<g class="tm-dim"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}"/><line x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}"/></g><text x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle" class="tm-dim-t">${txt}</text>`;
  const dimV=(x,y1,y2,txt)=>`<g class="tm-dim"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-4}" y1="${y1}" x2="${x+4}" y2="${y1}"/><line x1="${x-4}" y1="${y2}" x2="${x+4}" y2="${y2}"/></g><text x="${x-7}" y="${(y1+y2)/2}" text-anchor="end" dominant-baseline="middle" class="tm-dim-t">${txt}</text>`;

  const A=tClamp(m.ancho||1200,200,6000), B=tClamp(m.alto||1000,200,4500), P=tClamp(m.prof||600,150,2500);
  let body="";

  if(m.type==="mesa"||m.type==="rack"){
    /* Doble vista técnica sincronizada: FRENTE + LATERAL con etiquetas de cortes */
    const padL=54, padR=20, padT=34, padB=32, gap=32;
    const availW=W-padL-padR-gap, availH=H-padT-padB;
    const sc=Math.min(availW/(A+P), availH/B);
    const w1=A*sc, w2=P*sc, h=B*sc;
    const totW=w1+gap+w2, x1=padL+(availW+gap-totW)/2, x2=x1+w1+gap, y=(H-padT-padB-h)/2+padT;

    body+=`<text x="${x1+w1/2}" y="${H-8}" text-anchor="middle" class="tm-lbl">Frente</text>`;
    body+=`<text x="${x2+w2/2}" y="${H-8}" text-anchor="middle" class="tm-lbl">Lateral</text>`;

    if(m.type==="mesa"){
      const yTop=y+6, yRef=y+h-Math.max(20,h*0.24);
      const pD=`M${x1+3} ${y}V${y+h}M${x1+w1-3} ${y}V${y+h}M${x2+3} ${y}V${y+h}M${x2+w2-3} ${y}V${y+h}`;
      body+=grp("pata",`<path d="${pD}" class="tm-marco" stroke-width="5"/>`,pD,[x1+w1,y+h*0.52]);
      const lD=`M${x1+5} ${yTop}H${x1+w1-5}`;
      body+=grp("larg",`<path d="${lD}" class="tm-int" stroke-width="4.5"/>`,lD,[x1+w1/2,yTop+14]);
      const cD=`M${x2+5} ${yTop}H${x2+w2-5}`;
      body+=grp("cab",`<path d="${cD}" class="tm-int" stroke-width="4.5"/>`,cD,[x2+w2/2,yTop+14]);
      if(byKey.ref){
        const rD=`M${x1+5} ${yRef}H${x1+w1-5}`;
        body+=grp("ref",`<path d="${rD}" class="tm-extra" stroke-width="3"/>`,rD,[x1+w1/2,yRef]);
      }
      body+=`<line x1="${x1-4}" y1="${y-2}" x2="${x1+w1+4}" y2="${y-2}" stroke="var(--line-strong)" stroke-width="2" stroke-dasharray="4 3"/>`;
      body+=`<line x1="${x2-4}" y1="${y-2}" x2="${x2+w2+4}" y2="${y-2}" stroke="var(--line-strong)" stroke-width="2" stroke-dasharray="4 3"/>`;
    } else {
      const est=tClamp(m.travesanos||4,2,7);
      const pD=`M${x1+3} ${y}V${y+h}M${x1+w1-3} ${y}V${y+h}M${x2+3} ${y}V${y+h}M${x2+w2-3} ${y}V${y+h}`;
      body+=grp("pata",`<path d="${pD}" class="tm-marco" stroke-width="4.5"/>`,pD,[x1+w1,y+h*0.55]);
      let lD="", cD="";
      for(let k=0;k<est;k++){
        const yy=est===1?y+h/2:y+4+(h-10)*k/(est-1);
        lD+=`M${x1+5} ${yy}H${x1+w1-5}`;
        cD+=`M${x2+5} ${yy}H${x2+w2-5}`;
      }
      body+=grp("larg",`<path d="${lD}" class="tm-int" stroke-width="3.5"/>`,lD,[x1+w1/2,y+h*0.28]);
      body+=grp("cab",`<path d="${cD}" class="tm-extra" stroke-width="3.5"/>`,cD,[x2+w2/2,y+h*0.42]);
    }
    body+=dimH(x1,x1+w1,y-12,`${A}`);
    body+=dimH(x2,x2+w2,y-12,`${P}`);
    body+=dimV(x1-12,y,y+h,`${B}`);
  } else {
    /* Vista frontal 2D: Reja, Portón, Marco con cortes anotados sobre cada zona */
    const padL=62, padR=46, padT=34, padB=m.type==="porton"&&m.corredizo?44:34;
    const sc=Math.min((W-padL-padR)/A,(H-padT-padB)/B);
    const w=A*sc, h=B*sc, x=padL+(W-padL-padR-w)/2, y=padT+(H-padT-padB-h)/2;

    body+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--card)" opacity="${print?"0":"0.7"}"/>`;

    if(m.type==="marco"||m.type==="pano"){
      const cols=tClamp(m.hojas||(m.type==="pano"?1:2),1,5), rows=tClamp(m.travesanos||(m.type==="pano"?1:2),1,5);
      if(cols>1){
        let d=""; for(let k=1;k<cols;k++){ const xx=x+w*k/cols; d+=`M${xx} ${y+3}V${y+h-3}`; }
        body+=grp("par",`<path d="${d}" class="tm-int" stroke-width="3.2"/>`,d,[x+w*0.36,y+h*0.30]);
      }
      if(rows>1){
        let d=""; for(let k=1;k<rows;k++){ const yy=y+h*k/rows; d+=`M${x+3} ${yy}H${x+w-3}`; }
        body+=grp("trav",`<path d="${d}" class="tm-int" stroke-width="3.2"/>`,d,[x+w*0.62,y+h*0.66]);
      }
      body+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" class="tm-sub-t">${cols}×${rows} paños · cortes en mm${(m.cant||1)>1?` · ×${m.cant} u.`:""}</text>`;
    } else {
      const sep=tClamp(m.sep||120,50,400), nBar=Math.max(0,Math.ceil(A/sep)-1);
      const tv=tClamp(m.travesanos??2,0,8);
      if(nBar>0){
        let d=""; for(let k=1;k<=nBar;k++){ const xx=x+w*k/(nBar+1); d+=`M${xx} ${y+3}V${y+h-3}`; }
        body+=grp("barrote",`<path d="${d}" class="tm-int" stroke-width="2.2"/>`,d,[x+w*0.34,y+h*0.30]);
      }
      if(tv>0){
        let d=""; for(let k=1;k<=tv;k++){ const yy=y+h*k/(tv+1); d+=`M${x+3} ${yy}H${x+w-3}`; }
        const ty=y+h*tv/(tv+1);
        body+=grp("trav",`<path d="${d}" class="tm-extra" stroke-width="2.8"/>`,d,[x+w*0.66,ty]);
      }
      if(m.type==="porton"&&m.corredizo){
        const rD=`M${x-14} ${y+h+10}H${x+w+14}`;
        body+=grp("riel",`<path d="${rD}" class="tm-extra" stroke-width="3.5"/><circle cx="${x+16}" cy="${y+h+6}" r="3.5" fill="var(--accent)"/><circle cx="${x+w-16}" cy="${y+h+6}" r="3.5" fill="var(--accent)"/>`,rD,[x+w/2,y+h+24]);
      }
      const luz=nBar>0?Math.round(A/(nBar+1)):A;
      body+=`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" class="tm-sub-t">${nBar} barrotes c/ ${luz} mm${m.type==="porton"&&m.hojas===2?" · 2 hojas":""}${(m.cant||1)>1?` · ×${m.cant} u.`:""}</text>`;
    }

    const mhD=`M${x} ${y}H${x+w}M${x} ${y+h}H${x+w}`;
    const mvD=`M${x} ${y}V${y+h}M${x+w} ${y}V${y+h}${m.type==="porton"&&m.hojas===2?`M${x+w/2} ${y}V${y+h}`:""}`;
    body+=grp("marco_h",`<path d="${mhD}" class="tm-marco" stroke-width="5.2"/>`,mhD,[x+w/2,y+h]);
    body+=grp("marco_v",`<path d="${mvD}" class="tm-marco" stroke-width="5.2"/>`,mvD,[x+w,m.type==="porton"?y+h*0.28:y+h/2]);

    if(m.ang==="45"){
      body+=`<path d="M${x-3} ${y-3}L${x+3} ${y+3}M${x+w+3} ${y-3}L${x+w-3} ${y+3}M${x-3} ${y+h+3}L${x+3} ${y+h-3}M${x+w+3} ${y+h+3}L${x+w-3} ${y+h-3}" class="tm-miter"/>`;
    }
    if(m.type==="porton"){
      const cx=m.hojas===2?(x+w/2-9):(x+w-9);
      body+=`<circle cx="${cx}" cy="${y+h/2}" r="4.2" fill="var(--accent)"/>`;
    }
    body+=dimH(x,x+w,y-12,`${A} mm`);
    body+=dimV(x-12,y,y+h,`${B} mm`);
  }

  return `<svg class="tmod-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plano técnico ${esc(m.type)} de ${A} por ${B} mm con cortes anotados">${body}</svg>`;
}

/* Gráfico visual de despiece para pedidos cargados manualmente (sin plantilla 2D fija) */
function tOrderCutsSVG(cuts,pmap,sel){
  if(!cuts||!cuts.length) return "";
  const W=380, rowH=24, padX=10, barX=74, maxBarW=W-barX-78;
  const maxLen=Math.max(...cuts.map(c=>c.len),1000);
  const H=cuts.length*rowH+14;
  const hasSel=!!sel;
  let rows="";
  cuts.forEach((c,i)=>{
    const y=8+i*rowH, bw=Math.max(18,(c.len/maxLen)*maxBarW);
    const hl=hasSel&&tMatchSel(c,c.perfil,sel);
    const cls=`to-seg${hl?" hl":(hasSel?" dim":"")}`;
    const payload=esc(JSON.stringify({perfil:c.perfil,len:c.len,parte:c.parte||"",qty:c.qty,ang:c.ang}));
    const lbl=(c.parte||(pmap[c.perfil]?.n||c.perfil)).slice(0,10);
    const shape=c.ang==="45"&&bw>16
      ?`<polygon points="${(barX+4).toFixed(1)},${y+2} ${(barX+bw-4).toFixed(1)},${y+2} ${(barX+bw).toFixed(1)},${y+16} ${barX},${y+16}" class="to-bar${i%2?" alt":""}"/>`
      :`<rect x="${barX}" y="${y+2}" width="${bw.toFixed(1)}" height="14" rx="3" class="to-bar${i%2?" alt":""}"/>`;
    const inTxt=bw>42?`<text x="${(barX+bw/2).toFixed(1)}" y="${y+12.5}" text-anchor="middle" class="to-in">${c.len}</text>`:"";
    rows+=`<g class="${cls}" data-tsel="${payload}" role="button" tabindex="0" aria-label="${esc(lbl)} ${c.qty} cortes de ${c.len} mm">
      <text x="${padX}" y="${y+13}" class="to-lbl">${esc(lbl)}</text>
      ${shape}${inTxt}
      <text x="${(barX+bw+6).toFixed(1)}" y="${y+13}" class="to-meta">×${c.qty}${c.ang==="45"?" 45°":""}${bw<=42?" "+c.len:""}</text>
    </g>`;
  });
  return `<svg class="tord-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de cortes del pedido">${rows}</svg>`;
}

function tModelCardHTML(m,perf,pmap,plan,compact){
  const pieces=tModelPieces(m);
  const sel=S.tSel;
  const barHits=sel?tFindBarsForSel(plan,sel):[];
  const selLabel=sel?`${sel.parte||sel.label||"Corte"} · ${sel.len} mm${sel.qty?` (×${sel.qty})`:""} · ${pmap[sel.perfil]?.n||sel.perfil}`:"";
  const hasInt=pieces.some(p=>p.role==="int"), hasExtra=pieces.some(p=>p.role==="extra");
  const pname=k=>pmap[k]?.n||k;
  const isProf=m.type==="mesa"||m.type==="rack";
  const isReja=m.type==="reja"||m.type==="porton"||tIsPuerta(m.type);
  const isGrid=m.type==="marco"||m.type==="pano";
  const tipoLbl=T_MODELS.find(x=>x.id===m.type)?.label||"modelo";

  const multiTabs=T.models.length>1?`<div class="presets" role="group" aria-label="Aberturas del pedido">
    ${T.models.map((mo,idx)=>`<button type="button" class="preset" data-tmidx="${idx}" aria-pressed="${idx===T.modelIdx}">${esc(mo.label||`Pieza ${idx+1}`)}</button>`).join("")}
  </div>`:"";

  const selBar=sel?`<div class="tmod-sel">
    <div><b>${esc(selLabel)}</b>${barHits.length?`<div class="small" style="margin-top:2px">Sale en: <b>${esc(barHits.join(" · "))}</b></div>`:(T.cuts.length?`<div class="small muted" style="margin-top:2px">No coincide con cortes cargados todavía</div>`:"")}</div>
    <button type="button" class="tmod-clr" data-tselclr aria-label="Quitar selección">✕</button>
  </div>`:`<div class="small muted" style="padding:0 2px">Cada etiqueta sobre el plano muestra <b>cant. × largo (mm)</b>. Tocá una pieza${compact?" o una barra":""} para cruzarlas.</div>`;

  const chips=`<div class="tmod-chips">${pieces.map(p=>{
    const hl=sel&&tMatchSel(p,p.perfil,sel);
    const payload=esc(JSON.stringify({key:p.key,label:p.label,parte:p.parte,perfil:p.perfil,len:p.len,qty:p.qty,ang:p.ang}));
    return `<button type="button" class="tmod-chip ${hl?"hl":""}" data-tsel="${payload}">${esc(p.parte)} <span>${p.len}</span><span class="q">×${p.qty}</span></button>`;
  }).join("")}</div>`;

  const legend=`<div class="tmod-leg">
    <span><i class="l-m"></i>${esc(pname(m.pMarco))}</span>
    ${hasInt?`<span><i class="l-i"></i>${esc(pname(m.pInt))}</span>`:""}
    ${hasExtra?`<span><i class="l-e"></i>${esc(pname(m.type==="porton"&&m.corredizo&&!pieces.some(p=>p.key==="trav")?"riel_porton":m.pExtra))}</span>`:""}
  </div>`;

  if(compact){
    return `<details class="card" data-sec="tmodel2" ${S.open.tmodel2!==false?"open":""}>
      <summary><h2>Plano y cortes del pedido</h2><span class="sumv mono">${m.ancho}×${m.alto}${isProf?`×${m.prof}`:""} mm</span>${svg("chev",'class="chev"')}</summary>
      <div class="inner">
        ${multiTabs}
        <div class="tmod-stage">${tModelSVG(m,pmap,sel,{plan})}${legend}</div>
        ${chips}
        ${selBar}
      </div>
    </details>`;
  }

  return `<section class="card" aria-labelledby="t_modh">
    <div class="tgh">
      <h2 id="t_modh">Modelo visual 2D</h2>
      <span class="small muted mono">${m.ancho}×${m.alto}${isProf?`×${m.prof}`:""} mm</span>
    </div>
    ${multiTabs}
    <div class="presets" role="group" aria-label="Elegir plantilla de modelo">
      ${T_MODELS.map(x=>`<button type="button" class="preset" data-tmtype="${x.id}" aria-pressed="${m.type===x.id}">${x.label}</button>`).join("")}
    </div>
    <div class="tmod-stage">${tModelSVG(m,pmap,sel,{plan})}${legend}</div>
    ${chips}
    ${selBar}
    <div class="tmod-fields ${isProf||isReja?"g3":""}">
      <div class="field"><label for="tm_a">Ancho (mm)</label><input id="tm_a" class="txt mono" inputmode="numeric" data-tmf="ancho" value="${m.ancho}"></div>
      <div class="field"><label for="tm_b">Alto (mm)</label><input id="tm_b" class="txt mono" inputmode="numeric" data-tmf="alto" value="${m.alto}"></div>
      ${isProf?`<div class="field"><label for="tm_p">Prof. (mm)</label><input id="tm_p" class="txt mono" inputmode="numeric" data-tmf="prof" value="${m.prof}"></div>`:""}
      ${isReja?`<div class="field"><label for="tm_sep">Barrotes c/ (mm)</label><input id="tm_sep" class="txt mono" inputmode="numeric" data-tmf="sep" value="${m.sep}"></div>`:""}
      ${isGrid?`<div class="field"><label for="tm_h">Paños ancho</label><input id="tm_h" class="txt mono" inputmode="numeric" data-tmf="hojas" value="${m.hojas}"></div>`:""}
      <div class="field"><label for="tm_tv">${m.type==="rack"?"Estantes":isGrid?"Paños alto":m.type==="mesa"?"Refuerzos":"Travesaños"}</label><input id="tm_tv" class="txt mono" inputmode="numeric" data-tmf="travesanos" value="${m.travesanos}"></div>
      ${m.type==="porton"?`<div class="field"><span class="flabel">Hojas</span><div class="opts g2"><button type="button" class="opt sm" data-tmhojas="1" aria-pressed="${m.hojas!==2}">1</button><button type="button" class="opt sm" data-tmhojas="2" aria-pressed="${m.hojas===2}">2</button></div></div>`:""}
      ${!isProf?`<div class="field"><span class="flabel">Esquinas</span><div class="opts g2"><button type="button" class="opt sm" data-tmang="90" aria-pressed="${m.ang==="90"}">90°</button><button type="button" class="opt sm" data-tmang="45" aria-pressed="${m.ang==="45"}">45°</button></div></div>`:""}
    </div>
    ${m.type==="porton"?`<button type="button" class="swrow inline" data-tact="tmcorr" aria-pressed="${!!m.corredizo}"><span class="swlbl">Portón corredizo<span class="swsub">Suma riel inferior en el plano y cortes</span></span><span class="sw" aria-hidden="true"></span></button>`:""}
    <details class="tnew" ${S.open.tmperfs?"open":""} data-sec="tmperfs"><summary>Perfiles del modelo (${esc(pname(m.pMarco))}${hasInt?" / "+esc(pname(m.pInt)):""})</summary>
      <div class="tmod-fields" style="margin-top:8px">
        <div class="field"><label for="tm_pm">${isProf?"Patas / parantes":"Marco"}</label><select id="tm_pm" class="txt" data-tmf="pMarco">${perf.map(p=>`<option value="${esc(p.key)}" ${p.key===m.pMarco?"selected":""}>${esc(p.n)}</option>`).join("")}</select></div>
        <div class="field"><label for="tm_pi">${isProf?"Largueros":"Interior / barrotes"}</label><select id="tm_pi" class="txt" data-tmf="pInt">${perf.map(p=>`<option value="${esc(p.key)}" ${p.key===m.pInt?"selected":""}>${esc(p.n)}</option>`).join("")}</select></div>
        ${hasExtra?`<div class="field"><label for="tm_pe">${m.type==="rack"?"Lateral est.":"Travesaños / ref."}</label><select id="tm_pe" class="txt" data-tmf="pExtra">${perf.map(p=>`<option value="${esc(p.key)}" ${p.key===m.pExtra?"selected":""}>${esc(p.n)}</option>`).join("")}</select></div>`:""}
      </div>
      ${tRecetaDiffiere(m)?`<button type="button" class="btn ghost sm" style="margin-top:8px;width:100%" data-tact="saverec">Guardar como mi receta para ${esc(tipoLbl)}</button>`:(T.recetas&&T.recetas[m.type]?`<p class="small muted" style="margin:8px 0 0">Estos son los perfiles de tu receta de ${esc(tipoLbl)}.</p>`:"")}
    </details>
    <div class="two">
      <button type="button" class="btn primary sm" data-tact="tmgen">Cargar cortes (${pieces.reduce((s,p)=>s+p.qty,0)} pzas)</button>
      <button type="button" class="btn ghost sm" data-tact="tmadd">+ Sumar a la lista</button>
    </div>
  </section>`;
}

function tBarSVG(b,barra,disco,minSob,perfil,sel){
  const W=600,H=32, refLen=b.len||barra; let x=0, s="";
  const hasSel=!!sel;
  b.pieces.forEach((p,i)=>{
    const w=p.len/refLen*W, alt=i%2?" alt":"", ww=Math.max(1,w-1);
    const hl=hasSel&&tMatchSel(p,perfil,sel);
    const segCls=`bseg${hl?" hl":(hasSel?" dim":"")}`;
    const payload=perfil?esc(JSON.stringify({perfil,len:p.len,parte:p.parte||"",ang:p.ang||"90"})):"";
    const gAttr=perfil?` class="${segCls}" data-tbarcut="${payload}" role="button" tabindex="0" aria-label="Corte ${p.len} mm ${esc(p.parte||"")}"`:"";
    let seg="";
    if(p.ang==="45"&&ww>16) seg+=`<polygon points="${(x+5).toFixed(1)},2 ${(x+ww-5).toFixed(1)},2 ${(x+ww).toFixed(1)},${H-2} ${x.toFixed(1)},${H-2}" class="bp${alt}"/>`;
    else seg+=`<rect x="${x.toFixed(1)}" y="2" width="${ww.toFixed(1)}" height="${H-4}" rx="3" class="bp${alt}"/>`;
    if(w>26) seg+=`<text x="${(x+ww/2).toFixed(1)}" y="${H/2+4}" text-anchor="middle" class="bt${alt}${w<=40?" sm":""}">${p.len}</text>`;
    s+=perfil?`<g${gAttr}>${seg}</g>`:seg;
    x+=w+disco/refLen*W;
  });
  const w=W-x;
  if(b.sobra>0&&w>0.5){
    const util=b.sobra>=minSob;
    s+=`<rect x="${x.toFixed(1)}" y="3" width="${Math.max(1,w-1).toFixed(1)}" height="${H-6}" rx="3" class="${util?"bs":"bw"}"/>`;
    if(w>34) s+=`<text x="${(x+w/2).toFixed(1)}" y="${H/2+4}" text-anchor="middle" class="${util?"bst":"bwt"}">${util&&w>78?"sobra ":""}${fmtQ(b.sobra)}</text>`;
  }
  const desc=b.pieces.map(p=>p.len).join(", ");
  return `<svg class="barsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.retazo?"Retazo de "+refLen+" mm":"Barra"}: cortes de ${desc} mm, sobran ${fmtQ(b.sobra)} mm">${s}</svg>`;
}

const tCutTxt=p=>`${p.len}${p.ang==="45"?" (45°)":""}${p.parte?" "+p.parte:""}`;
const tRango=g=>g.bar.retazo?`Retazo ${g.bar.len} mm${g.n>1?` (×${g.n})`:""}`:(g.n>1?`Barras ${g.from} a ${g.from+g.n-1}`:`Barra ${g.from}`);

function tPlanillaText(plan,pmap){
  const L=[`PLANILLA DE CORTE${T.obra?" — "+T.obra:""}`,`Barras de ${fmtQ(T.barra/1000)} m · disco ${fmtQ(T.disco)} mm · medidas en mm`,""];
  plan.forEach(g=>{
    const name=(pmap[g.perfil]?.n||g.perfil).toUpperCase();
    const extra=g.retUsed.length?` (+ ${g.retUsed.length} retazo${g.retUsed.length>1?"s":""})`:"";
    L.push(`▸ ${name} — ${g.newBars.length} barra${g.newBars.length!==1?"s":""} nueva${g.newBars.length!==1?"s":""}${extra}`);
    tGroupBars(g.bars).forEach(x=>{
      L.push(`${tRango(x)}${!x.bar.retazo&&x.n>1?` (x${x.n})`:""}: ${x.bar.pieces.map(tCutTxt).join(" | ")} → sobra ${fmtQ(x.bar.sobra)}${x.bar.sobra>=T.minSob?" (guardar)":""}`);
    });
    g.largas.forEach(p=>L.push(`⚠ ${tCutTxt(p)}: más larga que la barra, hay que empalmar`));
    L.push("");
  });
  L.push("Cortar primero los largos y después los cortos.");
  return L.join("\n");
}

function tCorralonText(plan,pmap){
  const L=[`Pedido de hierros${T.obra?" — "+T.obra:""} (barras de ${fmtQ(T.barra/1000)} m):`];
  plan.forEach(g=>{
    if(g.buyBars<=0) return;
    L.push(`• ${g.buyBars} barra${g.buyBars>1?"s":""} — ${pmap[g.perfil]?.n||g.perfil}${g.empBars?` (incluye ${g.empBars} para empalmes)`:""}`);
  });
  return L.join("\n");
}

          const hasHl=S.tSel&&x.bar.pieces.some(p=>tMatchSel(p,g.perfil,S.tSel));
          return `<div class="bargrp ${isDone?"done":""} ${hasHl?"has-hl":""}">
            <div class="bh">
              <span>${tRango(x)}${x.bar.retazo?'<span class="tretbadge">del taller</span>':""} ${!x.bar.retazo&&x.n>1?`<span class="x">×${x.n}</span>`:""}</span>
              <button type="button" class="barck" data-tdone="${esc(dk)}" aria-pressed="${isDone}">${svg("check")} ${isDone?"Cortado":"Tildar"}</button>
            </div>
            ${tBarSVG(x.bar,T.barra,T.disco,T.minSob,g.perfil,S.tSel)}
            <div class="bc"><span>${x.bar.pieces.map(p=>esc(tCutTxt(p))).join(" · ")} → sobra ${fmtQ(x.bar.sobra)} mm</span>${x.bar.sobra>=T.minSob?`<button type="button" class="tsavbtn" data-tsaveret="${esc(g.perfil)}" data-rlen="${Math.round(x.bar.sobra)}">+ Retazo</button>`:""}</div>
          </div>`;
        }).join("")}
      </div>`; }).join("")}
    </section>

    ${tFinishCardHTML(plan,pmap)}

    <section class="card" aria-labelledby="t_planillah">
      <h2 id="t_planillah">Planilla para el que corta</h2>
      <div class="msg">${esc(planilla)}</div>
      <div class="actions">
        <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(planilla)}">${svg("wa")} Mandar por WhatsApp</a>
        <div class="two">
          <button type="button" class="btn ghost" data-tact="copiar">${svg("copy")} Copiar</button>
          <button type="button" class="btn ghost" data-tact="print">${svg("layers")} Imprimir / PDF</button>
        </div>
      </div>
    </section>
    <button type="button" class="btn ghost sm" data-tstep="1">← Volver a 1. Cargar o editar cortes</button>
    ` : `<section class="card">
      <h2>Todavía no cargaste cortes</h2>
      <p class="small muted" style="margin:0">Primero cargá las medidas en el paso 1 (o probá con el ejemplo del cuaderno) para ver cuántas barras comprar y el plan de corte.</p>
      <div class="two">
        <button type="button" class="btn primary sm" data-tstep="1">← Ir a 1. Cargar cortes</button>
        <button type="button" class="btn ghost sm" data-tact="ejemplo">Cargar ejemplo</button>
      </div>
    </section>`;
  } else {
    tBody=`
    <section class="card" aria-label="Retazos en el taller">
      <div class="tgh"><h2>Retazos disponibles en el taller</h2><span class="small muted">${T.retazos.length?T.retazos.length+" guardado"+(T.retazos.length>1?"s":""):"ninguno"}</span></div>
      <button type="button" class="swrow inline" data-tact="toggleret" aria-pressed="${!!T.usarRetazos}">
        <span class="swlbl">Usar retazos disponibles primero<span class="swsub">Antes de comprar barras nuevas</span></span>
        <span class="sw" aria-hidden="true"></span>
      </button>
      <div class="two">
        <select id="t_ret_p" class="txt" aria-label="Perfil del retazo">${perf.map(p=>`<option value="${esc(p.key)}" ${p.key===T.form.perfil?"selected":""}>${esc(p.n)}</option>`).join("")}</select>
        <input id="t_ret_l" class="txt num" inputmode="numeric" placeholder="Largo (mm)" aria-label="Largo del retazo en mm">
      </div>
      <button type="button" class="btn ghost sm" data-tact="addret">${svg("plus")} Agregar retazo al stock</button>
      ${T.retazos.length?`<ul class="rows">${T.retazos.map(r=>`<li class="row">
        <span class="name">${esc(pname(r.perfil))} · <b class="num">${r.len} mm</b>${r.fromWork===T.workId?` <span class="small muted">(próximas obras)</span>`:""}</span>
        <button type="button" class="tdel" data-tdelret="${r.id}" aria-label="Borrar retazo de ${r.len} mm">${svg("x")}</button>
      </li>`).join("")}</ul>`:`<p class="small muted" style="margin:0">Todavía no tenés retazos guardados. Podés cargarlos acá o tocar <b>"+ Retazo"</b> en los sobrantes del Plan de corte.</p>`}
    </section>

    <section class="card" aria-label="Ajustes de corte">
      <h2>Medidas de barra y disco</h2>
      <div>
        <div class="setrow"><label for="tc_barra">Largo de la barra<span class="hint">En mm. Normalmente 6000</span></label><input id="tc_barra" data-tcfg="barra" inputmode="numeric" value="${T.barra}"></div>
        <div class="setrow"><label for="tc_disco">Ancho del disco<span class="hint">Lo que se come cada corte (ej: 1,6 o 3 mm)</span></label><input id="tc_disco" data-tcfg="disco" inputmode="decimal" value="${String(T.disco).replace(".",",")}"></div>
        <div class="setrow"><label for="tc_min">Sobrante que se guarda<span class="hint">Desde cuántos mm vale la pena guardarlo</span></label><input id="tc_min" data-tcfg="minSob" inputmode="numeric" value="${T.minSob}"></div>
      </div>
    </section>`;
  }

  app.innerHTML=`
  <div class="top">
    <div>
      <h1>Taller: cortes de barras</h1>
      <p class="top-sub" style="margin:2px 0 0">1. Modelo y cortes → 2. Plan y compra → 3. Retazos</p>
    </div>
  </div>

  <div class="steps" role="tablist" aria-label="Pasos del Taller">
    <button type="button" class="stepbtn" role="tab" data-tstep="1" aria-selected="${tst===1}"><span class="snum">1.</span>Cortes${nPzas?` (${nPzas})`:""}</button>
    <button type="button" class="stepbtn" role="tab" data-tstep="2" aria-selected="${tst===2}"><span class="snum">2.</span>Plan y compra${totBuy?` (${totBuy})`:""}</button>
    <button type="button" class="stepbtn" role="tab" data-tstep="3" aria-selected="${tst===3}"><span class="snum">3.</span>Retazos${T.retazos.length?` (${T.retazos.length})`:""}</button>
  </div>

  ${tBody}`;
}

function rerenderTaller(focusId){
  const id=focusId||(document.activeElement&&document.activeElement.id);
  const pos=window.scrollY;
  renderTaller();
  window.scrollTo(0,pos);
  if(id){ const el=document.getElementById(id); if(el&&(el.tagName==="INPUT"||focusId)) el.focus(); }
}

function tMergeCuts(){
  const merged=[];
  T.cuts.forEach(c=>{
    const ex=merged.find(x=>x.perfil===c.perfil&&x.parte===c.parte&&x.ang===c.ang&&x.len===c.len);
    if(ex) ex.qty=Math.min(500,ex.qty+c.qty); else merged.push(c);
  });
  T.cuts=merged;
}

function tToggleSel(raw){
  try{
    const obj=typeof raw==="string"?JSON.parse(raw):raw;
    if(S.tSel&&S.tSel.perfil===obj.perfil&&S.tSel.len===obj.len&&(S.tSel.key||"")===(obj.key||"")){
      S.tSel=null;
    } else {
      S.tSel=obj;
    }
  }catch(err){ S.tSel=null; }
  rerenderTaller();
}

function tAddCuts(){
  const u=T.form.u||"mm";
  const list=tParse(T.form.txt,u);
  if(!list.length){ S.errs.t=`Escribí al menos una medida, por ejemplo ${u==="cm"?"120x4":"2640x2"}.`; return rerenderTaller("t_txt"); }
  const parte=(T.form.parte||"").trim().slice(0,20);
  let n=0;
  list.forEach(({len,qty})=>{
    const ex=T.cuts.find(c=>c.perfil===T.form.perfil&&c.parte===parte&&c.ang===T.form.ang&&c.len===len);
    if(ex) ex.qty+=qty; else T.cuts.push({id:tId(),perfil:T.form.perfil,parte,ang:T.form.ang,len,qty});
    n+=qty;
  });
  T.form.txt=""; S.errs.t=""; saveT();
  toast(`Agregué ${n} corte${n>1?"s":""}`);
  rerenderTaller("t_txt");
}

app.addEventListener("click",e=>{
  if(S.screen!=="taller") return;
  const b=e.target.closest("[data-tstep],[data-tact],[data-tang],[data-tu],[data-tq],[data-tdel],[data-tpc],[data-tflip],[data-tapply],[data-tdone],[data-tsaveret],[data-tdelret],[data-tload],[data-tdelobra],[data-tmtype],[data-tmang],[data-tmhojas],[data-tmidx],[data-tsel],[data-tbarcut],[data-tselclr]"); if(!b) return;
  const d=b.dataset;
  if(d.tsel){ return tToggleSel(d.tsel); }
  if(d.tbarcut){ return tToggleSel(d.tbarcut); }
  if(d.tselclr!==undefined){ S.tSel=null; return rerenderTaller(); }
  if(d.tmidx!==undefined){
    const idx=+d.tmidx;
    if(T.models[idx]){ T.modelIdx=idx; T.model={...T_MODEL_DEF,...T.models[idx]}; S.tSel=null; saveT(); }
    return rerenderTaller();
  }
  if(d.tmtype){
    const tpl=T_MODELS.find(x=>x.id===d.tmtype);
    if(tpl){ T.model=tTypeDef(tpl.id); T.models=[]; T.modelIdx=0; S.tSel=null; saveT(); }
    return rerenderTaller();
  }
  if(d.tmang){ T.model.ang=d.tmang; saveT(); return rerenderTaller(); }
  if(d.tmhojas){ T.model.hojas=+d.tmhojas; saveT(); return rerenderTaller(); }
  if(d.tstep){ T.step=+d.tstep; saveT(); renderTaller(); window.scrollTo(0,0); return; }
  if(d.tang){ T.form.ang=d.tang; saveT(); return rerenderTaller(); }
  if(d.tu){ T.form.u=d.tu; saveT(); return rerenderTaller(); }
  if(d.tpc!==undefined){ T.form.parte=d.tpc; saveT(); return rerenderTaller(); }
  if(d.tflip){ const c=T.cuts.find(x=>x.id===d.tflip); if(c){ c.ang=c.ang==="45"?"90":"45"; tMergeCuts(); saveT(); } return rerenderTaller(); }
  if(d.tapply){
    const from=+d.from, to=+d.to;
    T.cuts.forEach(c=>{ if(c.perfil===d.tapply&&c.len===from) c.len=to; });
    tMergeCuts();
    saveT(); toast(`Cortes cambiados a ${to} mm`); return rerenderTaller();
  }
  if(d.tdone!==undefined){
    if(T.done[d.tdone]) delete T.done[d.tdone]; else T.done[d.tdone]=true;
    saveT(); return rerenderTaller();
  }
  if(d.tsaveret){
    const len=+d.rlen;
    if(len>0){ T.retazos.push({id:tId(),perfil:d.tsaveret,len,fromWork:T.workId}); saveT(); toast(`Retazo de ${len} mm guardado en 3. Retazos`); }
    return rerenderTaller();
  }
  if(d.tdelret){ T.retazos=T.retazos.filter(r=>r.id!==d.tdelret); saveT(); toast("Retazo quitado"); return rerenderTaller(); }
  if(d.tload!==undefined){
    const o=T.obras[+d.tload];
    if(o){
      T.workId=tId(); T.obra=o.obra; T.cuts=JSON.parse(JSON.stringify(o.cuts));
      T.barra=o.barra||6000; T.disco=o.disco??3; T.minSob=o.minSob??300; T.done={};
      T.model={...T_MODEL_DEF,...(o.model||{})}; T.modelActive=!!o.modelActive; S.tSel=null;
      saveT(); toast("Obra cargada"); rerenderTaller();
    }
    return;
  }
  if(d.tdelobra!==undefined){
    const idx=+d.tdelobra, name=T.obras[idx]?.obra||"esta obra";
    return askConfirm("¿Borrar obra guardada?",`Se va a eliminar "${name}" de tus obras guardadas.`,"Borrar",b,()=>{
      T.obras.splice(idx,1); saveT(); toast("Obra eliminada"); rerenderTaller();
    });
  }
  if(d.tq){ const c=T.cuts.find(x=>x.id===d.tq); if(c){ c.qty=Math.max(1,Math.min(500,c.qty+(+d.d))); saveT(); } return rerenderTaller(); }
  if(d.tdel){ T.cuts=T.cuts.filter(x=>x.id!==d.tdel); saveT(); toast("Corte borrado"); return rerenderTaller(); }
  const a=d.tact;
  if(a==="finish"){ S.tFin={off:{}}; return rerenderTaller(); }
  if(a==="finishno"){ S.tFin=null; return rerenderTaller(); }
  if(a==="finishok"){
    const plan=S.tPlan||[], off=(S.tFin&&S.tFin.off)||{};
    const keep=tLeftovers(plan,T.minSob).filter(k=>!off[k.perfil+"|"+k.len]);
    const r=tFinishCutting(plan,keep); S.tFin=null;
    toast(r.usados||r.guardados?`Listo: ${r.usados?`quité ${r.usados} retazo${r.usados>1?"s":""} usado${r.usados>1?"s":""}`:"stock al día"}${r.guardados?` y guardé ${r.guardados} sobrante${r.guardados>1?"s":""}`:""}`:"Obra terminada");
    return rerenderTaller();
  }
  if(a==="saverec"){
    const ty=T.model.type, lbl=T_MODELS.find(x=>x.id===ty)?.label||ty;
    T.recetas[ty]={pMarco:T.model.pMarco,pInt:T.model.pInt,pExtra:T.model.pExtra};
    saveT(); toast(`Receta guardada: los próximos ${lbl} arrancan así`); return rerenderTaller();
  }
  if(a==="tmcorr"){ T.model.corredizo=!T.model.corredizo; saveT(); return rerenderTaller(); }
  if(a==="tmgen"||a==="tmadd"){
    const pcs=tModelPieces(T.model);
    const lbl=(T_MODELS.find(x=>x.id===T.model.type)?.label||"Modelo")+` ${T.model.ancho}×${T.model.alto}`;
    const apply=(replace)=>{
      if(replace){ T.workId=tId(); T.cuts=[]; T.done={}; if(!T.obra) T.obra=lbl; }
      pcs.forEach(p=>T.cuts.push({id:tId(),perfil:p.perfil,parte:p.parte,ang:p.ang,len:p.len,qty:p.qty}));
      tMergeCuts();
      T.modelActive=true; S.tSel=null; saveT();
      toast(replace?`Cargué ${pcs.reduce((s,p)=>s+p.qty,0)} piezas del modelo`:`Sumé ${pcs.reduce((s,p)=>s+p.qty,0)} piezas del modelo`);
      rerenderTaller();
    };
    if(a==="tmgen"&&T.cuts.length) return askConfirm("¿Reemplazar cortes con este modelo?","Se van a reemplazar los cortes actuales por el despiece de este modelo 2D.","Reemplazar",b,()=>apply(true));
    return apply(a==="tmgen");
  }
  if(a==="add") return tAddCuts();
  if(a==="toggleret"){ T.usarRetazos=!T.usarRetazos; saveT(); return rerenderTaller(); }
  if(a==="addret"){
    const perfil=document.getElementById("t_ret_p").value;
    const len=tLen(document.getElementById("t_ret_l").value);
    if(!len||len>T.barra){ toast(`Escribí un largo válido (hasta ${T.barra} mm)`); return; }
    T.retazos.push({id:tId(),perfil,len});
    saveT(); toast(`Retazo de ${len} mm agregado`); return rerenderTaller();
  }
  if(a==="saveobra"){
    const name=(T.obra||"").trim()||("Obra "+new Date().toLocaleDateString("es-AR",{day:"numeric",month:"short"}));
    const entry=tObraEntry(name);
    const idx=T.obras.findIndex(x=>x.obra.toLowerCase()===name.toLowerCase());
    if(idx>=0) T.obras[idx]=entry; else T.obras.unshift(entry);
    T.obras=T.obras.slice(0,15);
    T.obra=name; saveT(); toast(`Obra "${name}" guardada`); return rerenderTaller();
  }
  if(a==="ejemplo"){
    const load=()=>{ T.workId=tId(); T.cuts=T_EJEMPLO.map(c=>({...c,id:tId()})); T.done={}; T.modelActive=false; S.tSel=null; if(!T.obra) T.obra="Ejemplo del cuaderno"; saveT(); toast("Ejemplo cargado"); rerenderTaller(); };
    return T.cuts.length?askConfirm("¿Reemplazar los cortes?","Se van a borrar los cortes cargados y se carga el ejemplo del cuaderno.","Reemplazar",b,load):load();
  }
  if(a==="limpiar") return askConfirm("¿Empezar de cero?","Se borran todos los cortes cargados de esta obra.","Borrar todo",b,()=>{ T.workId=tId(); T.cuts=[]; T.obra=""; T.done={}; T.modelActive=false; S.tSel=null; T.step=1; saveT(); toast("Listo, obra nueva"); rerenderTaller(); });
  if(a==="newperfil"){
    const n=(document.getElementById("t_np_n").value||"").trim();
    const p=num(document.getElementById("t_np_p").value)||0;
    if(!n){ S.errs.tnp="Escribí el nombre del perfil."; rerenderTaller(); const det=document.querySelector(".tnew"); if(det) det.open=true; const el=document.getElementById("t_np_n"); if(el) el.focus(); return; }
    const k="u_"+Date.now().toString(36);
    customMats[k]={n,u:"barra 6 m",p,cat:"herreria",q:n+" 6 metros"}; prices[k]=p;
    LS.set("presu_custom_mats",customMats); LS.set("presu_prices",prices);
    T.form.perfil=k; S.errs.tnp=""; saveT(); toast("Perfil guardado"); return rerenderTaller();
  }
  if(a==="corralon") return copy(tCorralonText(S.tPlan,S.tPmap),"Pedido para el corralón copiado",b);
  if(a==="copiar") return copy(tPlanillaText(S.tPlan,S.tPmap),"Planilla copiada",b);
  if(a==="print"){ document.getElementById("printsheet").innerHTML=tPrintHTML(S.tPlan,S.tPmap); window.print(); return; }
  if(a==="presu"){
    const list=S.tPlan.filter(g=>S.tPmap[g.perfil]&&g.buyBars>0).map(g=>({key:g.perfil,qty:g.buyBars}));
    const totBuy=list.reduce((s,x)=>s+x.qty,0);
    const nPzas=T.cuts.reduce((s,c)=>s+c.qty,0);
    if(!list.length&&!nPzas) return;
    list.push({key:"kit_soldar",qty:totBuy>6?2:1});
    list.push({key:"disco_corte",qty:Math.max(1,Math.ceil(nPzas/25))});
    const estH=Math.max(2,Math.round((Math.max(1,totBuy)*1.1+nPzas*0.15)*2)/2);
    S.note=`Cargué ${totBuy} barra${totBuy!==1?"s":""} y consumibles básicos del Taller. Ajustá horas, pintura y herrajes.`;
    openJob("otro",{texto:T.obra||"Trabajo de herrería",horas:estH,mat:0},list,2);
    S.cliente=T.obra||"";
    renderJob();
    return;
  }
});

app.addEventListener("input",e=>{
  if(S.screen!=="taller") return;
  const el=e.target;
  if(el.id==="t_txt"){ T.form.txt=el.value; saveT(); }
  if(el.id==="t_parte"){ T.form.parte=el.value; saveT(); }
});

app.addEventListener("keydown",e=>{
  if(S.screen!=="taller") return;
  if(e.key==="Enter"&&e.target.id==="t_txt"){ e.preventDefault(); T.form.txt=e.target.value; tAddCuts(); return; }
  if(e.key==="Enter"||e.key===" "){
    const hit=e.target.closest("[data-tsel],[data-tbarcut]");
    if(hit){ e.preventDefault(); tToggleSel(hit.dataset.tsel||hit.dataset.tbarcut); }
  }
});

app.addEventListener("change",e=>{
  if(S.screen!=="taller") return;
  const el=e.target, d=el.dataset;
  if(el.id==="t_perfil"){ T.form.perfil=el.value; saveT(); return; }
  if(d.tfinck!==undefined){ S.tFin=S.tFin||{off:{}}; S.tFin.off[d.tfinck]=!el.checked; return; }
  if(d.tmf){
    const k=d.tmf;
    if(k==="pMarco"||k==="pInt"||k==="pExtra"){ T.model[k]=el.value; S.tSel=null; saveT(); return rerenderTaller(); }
    const v=num(el.value);
    const lim={ancho:[200,6000],alto:[200,4500],prof:[150,2500],sep:[50,400],travesanos:[0,8],hojas:[1,5]}[k];
    if(v!==null&&lim){ T.model[k]=tClamp(v,lim[0],lim[1]); S.tSel=null; saveT(); }
    return rerenderTaller();
  }
  if(d.tobra!==undefined){ T.obra=el.value.trim().slice(0,60); saveT(); return rerenderTaller(); }
  if(d.tlen){
    const c=T.cuts.find(x=>x.id===d.tlen), v=tLen(el.value);
    if(c&&v){ c.len=v; tMergeCuts(); saveT(); } else toast("Escribí la medida en mm");
    return rerenderTaller();
  }
  if(d.tcfg){
    const v=numDec(el.value), lim={barra:[1000,12000],disco:[0,10],minSob:[0,3000]}[d.tcfg];
    if(v!==null){ T[d.tcfg]=Math.min(lim[1],Math.max(lim[0],d.tcfg==="disco"?Math.round(v*10)/10:Math.round(v))); saveT(); toast("Guardado"); }
    else toast("Escribí solo números");
    return rerenderTaller();
  }
  if(d.price!==undefined) return rerenderTaller();
});

render();
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  S.installPrompt=e;
  if(S.screen==="home") renderHome();
});
window.addEventListener("appinstalled",()=>{
  S.installPrompt=null;
  toast("App Padilla instalada en tu celular");
  if(S.screen==="home") renderHome();
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
