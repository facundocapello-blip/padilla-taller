<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111E2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuestador">
<meta name="description" content="Presupuestador rápido desde el celular para herrería, pintura y arreglos del hogar, con catálogo de repuestos y cálculo automático con y sin comisión de Clickie.">
<title>Presupuestador de Changas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111E2A'/%3E%3Cpath d='M41 11a11 11 0 0 0-10 15L13 44a4.5 4.5 0 0 0 6.5 6.5L38 32a11 11 0 0 0 15-10l-6.5 6.5-6.5-1.5-1.5-6.5z' fill='none' stroke='%23FF7A2E' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Diseño Taller Móvil: alto contraste, botones grandes para una mano, z-index fijo, transiciones solo de compositor y diálogo nativo. */
:root{
  --bg:#E8EDF2; --surface:#F4F7FA; --card:#FFFFFF; --ink:#111E2A; --muted:#526476; --line:#CBD5DF;
  --accent:#C2410C; --accent-soft:#FFF0E8; --accent-ink:#FFFFFF;
  --wa:#15803D; --slab:#111E2A; --slab-soft:#1D2E3F; --on-slab:#F1F5F9;
  --good:#157347; --good-bg:#DCFCE7; --warn:#8A5300; --warn-bg:#FEF3C7;
  --err:#B91C1C; --err-bg:#FEE2E2;
  --ml-dot:#EAB308;
  --shadow:0 1px 3px rgba(17,30,42,.08), 0 1px 2px rgba(17,30,42,.04);
  --z-bar:20; --z-toast:30; --z-dialog:40;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D151D; --surface:#15202B; --card:#192633; --ink:#F0F4F8; --muted:#9BB0C4; --line:#2B3C4D;
  --accent:#FF7A2E; --accent-soft:#2E1D13; --accent-ink:#140E0A;
  --slab:#1E2E3E; --slab-soft:#273A4D; --on-slab:#F1F5F9;
  --good:#5EE2A0; --good-bg:#123626; --warn:#FFD66B; --warn-bg:#382B0C;
  --err:#FCA5A5; --err-bg:#3B1219;
  --ml-dot:#FACC15;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
} }
:root[data-theme="dark"]{
  --bg:#0D151D; --surface:#15202B; --card:#192633; --ink:#F0F4F8; --muted:#9BB0C4; --line:#2B3C4D;
  --accent:#FF7A2E; --accent-soft:#2E1D13; --accent-ink:#140E0A;
  --slab:#1E2E3E; --slab-soft:#273A4D; --on-slab:#F1F5F9;
  --good:#5EE2A0; --good-bg:#123626; --warn:#FFD66B; --warn-bg:#382B0C;
  --err:#FCA5A5; --err-bg:#3B1219;
  --ml-dot:#FACC15;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
p,.banner,.top-sub{text-wrap:pretty}
::selection{background:var(--accent);color:var(--accent-ink)}
input,textarea,select{caret-color:var(--accent);accent-color:var(--accent)}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.wrap{max-width:640px;margin:0 auto;padding:16px 14px calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:26px;font-weight:900}
h2{font-size:20px;font-weight:800}
h3{font-size:17px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.field-err{color:var(--err);font-size:14px;font-weight:700;margin:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-sub{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600}
.chipbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:15px;box-shadow:var(--shadow);transition:transform .12s ease-out}
.chipbtn:active{transform:scale(.97)}
.chipbtn svg{width:20px;height:20px;color:var(--accent)}
.back{border:none;background:none;font-weight:800;font-size:17px;padding:6px 0;min-height:44px;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;color:var(--accent)}

/* Grilla de trabajos */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;list-style:none;margin:0;padding:0}
.grid > li{display:flex}
.job{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:17px;text-align:center;min-height:126px;justify-content:center;box-shadow:var(--shadow);transition:transform .12s ease-out}
.job svg{width:50px;height:50px;color:var(--accent)}
.job:active{transform:scale(.97)}
.job small{font-weight:600;font-size:13px;color:var(--muted);line-height:1.25}

/* Tarjetas y avisos */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow)}
.banner{border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.good{background:var(--good-bg);color:var(--good)}
.banner svg{flex:none;width:22px;height:22px;margin-top:1px}

/* Campos y steppers */
.field{display:flex;flex-direction:column;gap:7px}
.field > label, .flabel{font-weight:800;font-size:16px}
.stepper{display:grid;grid-template-columns:58px 1fr 58px;gap:8px;align-items:stretch}
.stepper button{border:none;border-radius:14px;background:var(--ink);color:var(--card);font-size:30px;font-weight:800;line-height:1;min-height:56px;transition:transform .1s ease-out}
.stepper button:active{transform:scale(.95)}
.stepper .val{display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.stepper input{width:100%;max-width:130px;border:none;background:none;text-align:right;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 0}
.stepper .unit{font-weight:700;color:var(--muted);font-size:16px;min-width:28px}
.stepper.sm{grid-template-columns:46px 1fr 46px}
.stepper.sm button{min-height:44px;font-size:24px;border-radius:12px}
.stepper.sm input{font-size:20px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.g3 .opt{padding:11px 6px;text-align:center}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 14px;font-weight:700;font-size:16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s ease-out}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.sm{min-height:38px;padding:7px 11px;font-size:14px;border-radius:999px}

.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--ink);min-height:38px;transition:transform .1s ease-out}
.preset:active{transform:scale(.97)}

textarea,input.txt,select.txt{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}

/* Dibujo técnico */
.drawing{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px;display:flex;justify-content:center}
.drawing svg{width:100%;max-width:420px;height:auto}

/* Tarjeta Total + Comparativa Con/Sin Comisión */
.total-card{background:var(--slab);color:var(--on-slab);border:none;gap:12px}
.total-card .big{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.total-card .muted{color:inherit;opacity:.78}
.com-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.com-box{border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--on-slab);border-radius:14px;padding:11px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .1s ease-out}
.com-box:active{transform:scale(.98)}
.com-box[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,122,46,.16)}
.com-box .tag{font-size:12px;font-weight:800;text-transform:uppercase;opacity:.9;display:flex;align-items:center;justify-content:space-between;gap:4px}
.com-box .val{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.com-box .sub{font-size:12.5px;opacity:.82;font-weight:600}
.com-box .dot{width:8px;height:8px;border-radius:999px;background:var(--accent);display:none;flex:none}
.com-box[aria-pressed="true"] .dot{display:inline-block}

.pocket{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--good-bg);color:var(--good);border-radius:14px;padding:12px 14px;font-weight:800}
.pocket .v{white-space:nowrap;font-size:24px;font-variant-numeric:tabular-nums}
.pocket small{display:block;font-size:13px;font-weight:700;opacity:.9}

.desglose{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:14px}
.desglose .dl{opacity:.84;font-weight:600}
.desglose .dv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.kg{font-size:14px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-weight:700}

/* Filas de materiales y horas */
.rows{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:none;padding-top:2px}
.row .name{font-weight:700;line-height:1.25}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .sub{font-size:14px;color:var(--muted);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.zero{opacity:.55}

.pricein{width:112px;min-height:42px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 8px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;text-align:right}
.pricein.example{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.mini{display:inline-flex;align-items:center;gap:6px}
.mini button{width:38px;height:38px;border-radius:10px;border:none;background:var(--ink);color:var(--card);font-weight:800;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:transform .1s ease-out}
.mini button:active{transform:scale(.94)}
.mini button.del{background:var(--surface);color:var(--muted);border:1.5px solid var(--line)}
.mini .qval{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

.mlbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800;text-decoration:none;min-height:36px;white-space:nowrap}
.mlbtn .mldot{width:8px;height:8px;border-radius:999px;background:var(--ml-dot);flex:none}
.mlbtn svg{width:14px;height:14px;color:var(--muted)}
.sum{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums;padding-top:10px;border-top:2px solid var(--ink);font-size:17px}

/* Botones principales */
.actions{display:grid;gap:9px}
.btn{border:none;border-radius:15px;padding:14px 16px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:54px;transition:transform .1s ease-out}
.btn:active{transform:scale(.98)}
.btn svg{width:23px;height:23px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--err);color:#fff}
.btn.copied{background:var(--good);color:#fff}
.btn.sm{min-height:44px;padding:9px 12px;font-size:15px;border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{font-size:15px;padding:11px 8px;min-height:48px}

/* Barra guiada de 3 pasos en el cotizador */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:4px}
.stepbtn{border:none;background:transparent;color:var(--muted);border-radius:11px;padding:10px 4px;font-size:14px;font-weight:800;min-height:46px;display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .1s ease-out}
.stepbtn:active{transform:scale(.97)}
.stepbtn[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stepbtn .snum{width:22px;height:22px;border-radius:999px;background:var(--line);color:var(--ink);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.stepbtn[aria-selected="true"] .snum{background:var(--accent);color:var(--accent-ink)}
.stepbtn .sdot{width:7px;height:7px;border-radius:999px;background:var(--warn);flex:none}

.msg{white-space:pre-wrap;background:var(--surface);border-radius:14px;padding:13px;font-size:15px;border:2px dashed var(--line);line-height:1.45}

/* Franja compacta pedir medidas */
.askbar{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.askbar b{font-size:15px}
.askbar .askacts{display:flex;gap:6px}
.askbar a,.askbar button{border:none;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:5px;text-decoration:none;min-height:38px}
.askbar a{background:var(--wa);color:#fff}
.askbar button{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.askbar svg{width:17px;height:17px}

/* Barra inferior fija (Acciones de presupuesto O Navegación principal) */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:var(--z-bar);box-shadow:0 -2px 10px rgba(17,30,42,.08)}
.bar .in{max-width:640px;width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .t{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.bar .modepill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;margin-bottom:3px;min-height:26px}
.bar .modepill.clk{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bar .modepill.dir{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.bar .btn{min-height:50px;padding:10px 15px;font-size:16px}
.bar .acts{display:flex;gap:8px}
.bar .iconbtn{width:48px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center}
.bar .iconbtn svg{width:22px;height:22px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:var(--z-bar);box-shadow:0 -2px 10px rgba(17,30,42,.08)}
.nav .in{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.navbtn{border:none;background:none;border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:800;color:var(--muted);min-height:54px;justify-content:center}
.navbtn svg{width:24px;height:24px}
.navbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Carrito flotante en Repuestos */
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:612px;margin:0 auto;background:var(--slab);color:var(--on-slab);border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:var(--z-bar);box-shadow:0 6px 20px rgba(17,30,42,.25)}
.cartbar .ct{font-size:14px;font-weight:700;line-height:1.25}
.cartbar .ct b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.cartbar .cacts{display:flex;gap:6px;align-items:center}
.cartbar .clrbtn{border:1.5px solid rgba(255,255,255,.25);background:transparent;color:var(--on-slab);border-radius:11px;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.cartbar .clrbtn svg{width:18px;height:18px}

/* Catálogo de repuestos */
.searchbox{position:relative;display:flex;align-items:center}
.searchbox input{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 42px 12px 42px;font-size:16px;font-weight:600;box-shadow:var(--shadow)}
.searchbox .sico{position:absolute;left:13px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.searchbox .clr{position:absolute;right:6px;width:36px;height:36px;border:none;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:800;min-height:40px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

.rep-card{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:12px 13px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.rep-card.in-cart{border-color:var(--accent);background:var(--accent-soft)}
.rep-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rep-name{font-weight:800;font-size:16px;line-height:1.2}
.rep-meta{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag-own{background:var(--good-bg);color:var(--good);padding:2px 7px;border-radius:999px;font-size:11.5px;font-weight:800}
.tag-ex{background:var(--warn-bg);color:var(--warn);padding:2px 7px;border-radius:999px;font-size:11.5px;font-weight:800}
.rep-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rep-bot .left{display:flex;align-items:center;gap:7px}
.rep-bot .right{display:flex;align-items:center;gap:6px}
.addqbtn{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.addqbtn svg{width:15px;height:15px}

/* Panel agregar repuesto en trabajo */
.picker{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.picklist{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.pickitem{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;text-align:left;width:100%}
.pickitem b{font-size:15px;display:block}
.pickitem small{font-size:13px;color:var(--muted)}

.draft{display:grid;grid-template-columns:1fr auto;gap:7px}

details.card{gap:0}

details.card[open] > summary{margin-bottom:12px}
details.card > .inner{display:flex;flex-direction:column;gap:12px}

#printsheet{display:none}
@media print{
  @page{margin:12mm}

  #printsheet{display:block;font-family:Arial,sans-serif;color:#000}
  #printsheet h1{font-size:20pt;margin:0 0 2mm} #printsheet h2{font-size:14pt;margin:6mm 0 2mm;border-bottom:2px solid #000;padding-bottom:1mm}

  #printsheet table{width:100%;border-collapse:collapse;font-size:11pt}

  #printsheet tr{page-break-inside:avoid}
  #printsheet .ck{display:inline-block;width:4mm;height:4mm;border:1.5px solid #000;margin-right:1.5mm;vertical-align:-0.5mm}
  #printsheet .cut{display:inline-block;margin:0 4mm 1mm 0;white-space:nowrap;font-weight:700}
  #printsheet svg{width:100%;height:auto;margin-top:1mm}
  #printsheet .bp{fill:#555} #printsheet .bp.alt{fill:#999} #printsheet .bt{fill:#fff;font:700 14px Arial}
  #printsheet .bs{fill:#fff;stroke:#000;stroke-dasharray:5 3} #printsheet .bw{fill:#ddd}
  #printsheet .bst,#printsheet .bwt{fill:#000;font:700 12px Arial}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (min-width:540px){ .grid{grid-template-columns:repeat(3,1fr)} }

function mlUrl(query){
  const slug = String(query||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return "https://listado.mercadolibre.com.ar/" + encodeURIComponent(slug || "ferreteria");
}

function getAllCatalog(customMats){
  const all = {...CATALOG};
  if(customMats){
    for(const [k,v] of Object.entries(customMats)){
      all[k] = {cat: v.cat || "propios", n: v.n, u: v.u || "u", p: v.p || 0, q: v.q || v.n, customDef: true};
    }
  }
  return all;
}

  ["cano_2020","Caño 20×20"],
  ["hierro_12","Redondo 12 mm"],
  ["redondo_916","Redondo 9/16\""],
  ["chapa_18","Chapa ciega"],
  ["metal_desp","Metal desplegado"]

function rejaCuts(i){
  const n=i.cant||1, A=Math.round(i.ancho*10), B=Math.round(i.alto*10);
  const ventana=i.uso==="ventana", porton=i.uso==="porton", doble=porton&&i.apertura==="doble", corredizo=porton&&i.apertura==="corredizo";
  const mat=i.material||"cano_2020", esHoja=mat==="chapa_18"||mat==="metal_desp";
  const marcoKey=ventana?(esHoja?"cano_3030":"cano_2020"):"cano_4040";
  const ang=ventana&&!esHoja?"90":"45";
  const cuts=[];
  const parte={ventana:"REJA",puerta:"PTA",porton:"PORTON"}[i.uso]||"REJA";
  if(doble){
    const hA=Math.round(A/2);
    cuts.push({perfil:marcoKey,parte:parte+" marco",ang,len:hA,qty:4*n});
    cuts.push({perfil:marcoKey,parte:parte+" marco",ang,len:B,qty:4*n});
  } else {
    cuts.push({perfil:marcoKey,parte:parte+" marco",ang,len:A,qty:2*n});
    cuts.push({perfil:marcoKey,parte:parte+" marco",ang,len:B,qty:2*n});
  }
  if(esHoja){
    const tv=ventana?1:2;
    cuts.push({perfil:"cano_2020",parte:parte+" refuerzo",ang:"90",len:Math.max(100,A-80),qty:tv*n});
    cuts.push({perfil:"cano_2020",parte:parte+" refuerzo",ang:"90",len:Math.max(100,B-80),qty:(doble?2:1)*n});
  } else {
    const barrotes=Math.max(0,C(i.ancho/(i.sep||12))-1);
    const lBar=Math.max(100,B-(ventana?40:80));
    if(barrotes>0) cuts.push({perfil:mat,parte:parte+" barrote",ang:"90",len:lBar,qty:barrotes*n});
    const tv=ventana?2:3;
    cuts.push({perfil:"planchuela",parte:parte+" travesaño",ang:"90",len:A,qty:tv*n});
  }
  if(corredizo) cuts.push({perfil:"riel_porton",parte:parte+" riel",ang:"90",len:Math.min(6000,A*2),qty:n});
  return cuts;
}

const MERCADO_REJA={lo:114000,hi:223000,src:"Servidos",f:"nov 2026",url:"https://servidos.ar/servicios/herreria/buenos-aires"};
function refMercado(job,inputs,total){
  if(!job||job.id!=="reja"||inputs.uso!=="ventana") return null;
  const m2=inputs.ancho*inputs.alto/10000*inputs.cant;
  if(!(m2>0)) return null;
  const lo=Math.round(MERCADO_REJA.lo*m2/1000)*1000, hi=Math.round(MERCADO_REJA.hi*m2/1000)*1000;
  return {lo,hi,m2,estado:total<lo?"bajo":total>hi?"alto":"ok"};
}
const NIVEL={bajo:["Barato",0],medio:["Medio",0.5],alto:["Caro",1]};
function refPrice(it,lvl){ return Math.round(it.lo+(it.hi-it.lo)*NIVEL[lvl][1]); }

function computeObra(lines,cfg,prices,opts,customMats){
  const cat = getAllCatalog(customMats);
  const rows=[], need={};
  for(const it of REF){
    const L=lines[it.id]; if(!L||!L.qty) continue;
    const pu=refPrice(it,L.lvl), mo=pu*L.qty;
    rows.push({it,qty:L.qty,lvl:L.lvl,pu,mo});
    it.mat.forEach(([m,c])=>need[m]=(need[m]||0)+c*L.qty);
  }
  const mats=Object.entries(need).map(([k,q])=>{
    const c=cat[k]||CATALOG[k], qty=Math.ceil(q-1e-9), price=prices[k]??c.p;
    return {key:k,name:c.n,unit:c.u,q:c.q||c.n,qty,price,cost:qty*price,example:!(k in prices)&&!c.customDef};
  });
  const mo=rows.reduce((a,r)=>a+r.mo,0), matCost=mats.reduce((a,m)=>a+m.cost,0);
  const viaje=rows.length?(opts.viaje??cfg.viaje):0;
  const paso=cfg.redondeo||1, ivaF=cfg.iva?1.21:1;
  const comPct = Math.min(60, Math.max(0, Number(cfg.comision)||0));
  const minT=Math.ceil(cfg.minimo/paso)*paso;

  function calcObraMode(usarCom, absorber){
    const effCom = usarCom ? comPct : 0;
    const comF = (usarCom && !absorber) ? 1/(1 - effCom/100) : 1;
    const up = x => Math.ceil(x * comF * ivaF / paso) * paso;
    const minAplicado = rows.length > 0 && up(mo + viaje) < minT;
    const sinMat = rows.length ? Math.max(minT, up(mo + viaje)) : 0;
    const conMat = rows.length ? Math.max(minT, up(mo + viaje + matCost*(1 + cfg.recargo/100))) : 0;
    const pocket = t => { const s = t/ivaF; return s - s*effCom/100; };
    const comSin = (sinMat/ivaF)*effCom/100;
    const comCon = (conMat/ivaF)*effCom/100;
    return {sinMat, conMat, minAplicado, comSin, comCon,
      bolsilloSin: pocket(sinMat), bolsilloCon: pocket(conMat) - matCost};
  }

  const usarCom = opts.usarComision !== false;
  const absorber = !!opts.absorberCom;
  const conCom = calcObraMode(true, absorber);
  const sinCom = calcObraMode(false, false);
  const act = usarCom ? conCom : sinCom;
  return {rows,mats,mo,matCost,viaje,usarCom,absorber,conCom,sinCom,...act};
}

function obraMessage(res,cfg,conMat){
  const L=[`¡Hola! Te paso el presupuesto${cfg.nombre?" de "+cfg.nombre:""}:`,""];
  const PL={boca:"bocas",visita:"visitas","día":"días",ambiente:"ambientes",trabajo:"trabajos"};

  L.push("");
  if(conMat){
    L.push(`💰 Total con materiales: ${ars(res.conMat)}${cfg.iva?" (IVA incluido)":""}`);
    L.push(`(Solo mano de obra serían ${ars(res.sinMat)} y los materiales los comprás vos.)`);
  } else {
    L.push(`💰 Mano de obra: ${ars(res.sinMat)}${cfg.iva?" (IVA incluido)":""}`);
    L.push("Los materiales van aparte: te paso la lista.");
  }
  const notas=res.rows.map(r=>r.it.nota).filter(Boolean);
  if(notas.length) L.push("Ojo: "+[...new Set(notas)].join("; ")+".");
  if(!res.usarCom && cfg.alias) L.push(`Alias para la seña: ${cfg.alias}`);
  L.push(`Precio válido por ${cfg.validez} días.`);
  if(cfg.garantia) L.push(`Garantía: ${cfg.garantia}.`);
  return L.join("\n");
}

/* Cálculo principal de un trabajo: devuelve SIEMPRE ambos modos (conCom y sinCom) y el activo en el nivel raíz. */
function compute(job, inputs, cfg, prices, hoursOv, opts, extraMats, qtyOv, customMats){
  const cat = getAllCatalog(customMats);
  const r = job.calc(inputs);
  const qOv = qtyOv || {};

  const mats = r.items.filter(x=>x.qty>0).map((x, idx)=>{
    if(x.custom) return {id:"custom_"+idx,key:null,name:x.name,unit:x.unit,q:x.name,qty:x.qty,autoQty:x.qty,price:x.price,cost:x.qty*x.price,example:false};
    const c = cat[x.mat] || CATALOG[x.mat];
    const price = prices[x.mat] ?? c.p;
    const qty = qOv[x.mat] !== undefined ? qOv[x.mat] : x.qty;
    return {id:"mat_"+x.mat,key:x.mat,name:c.n,unit:c.u,q:c.q||c.n,qty,autoQty:x.qty,nota:x.nota,price,cost:qty*price,example:!(x.mat in prices)&&!c.customDef};
  });

  /* Sumar repuestos agregados a mano por el usuario */
  (extraMats || []).forEach((em, idx)=>{
    if(em.key && cat[em.key]){
      const c = cat[em.key];
      const price = prices[em.key] ?? c.p;
      mats.push({id:"ex_"+idx,extraIdx:idx,key:em.key,name:c.n,unit:c.u,q:c.q||c.n,qty:em.qty,autoQty:em.qty,nota:"agregado",price,cost:em.qty*price,example:!(em.key in prices)&&!c.customDef});
    } else {
      mats.push({id:"ex_"+idx,extraIdx:idx,key:null,name:em.name||"Repuesto",unit:em.unit||"u",q:em.name||"repuesto",qty:em.qty,autoQty:em.qty,nota:"agregado",price:em.price||0,cost:(em.qty||0)*(em.price||0),example:false});
    }
  });

  const tasks = r.tasks.map(t=>({...t,auto:t.hours,manual:hoursOv[t.name]!==undefined,hours:hoursOv[t.name]??t.hours}));
  const horas = tasks.reduce((a,t)=>a+t.hours,0);
  const matCost = mats.reduce((a,m)=>a+m.cost,0);
  const matCobrado = opts.clienteCompra ? 0 : matCost*(1+cfg.recargo/100);
  const mo = horas*cfg.valor_hora*(opts.urgente ? 1+cfg.urgencia/100 : 1);
  const viaje = opts.viaje ?? cfg.viaje;
  const neto = (matCobrado + mo + viaje)*(1 + cfg.imprevistos/100);
  const ivaF = cfg.iva ? 1.21 : 1;
  const paso = cfg.redondeo || 1;
  const comPct = Math.min(60, Math.max(0, Number(cfg.comision)||0));

  function calcMode(useCom){
    const cPct = useCom ? comPct : 0;
    let base = neto / (1 - cPct/100);
    const bajoMinimo = base < cfg.minimo;
    let usoMinimo = false;
    if(bajoMinimo && !opts.sinMinimo){ base = cfg.minimo; usoMinimo = true; }
    const total = Math.ceil(base * ivaF / paso) * paso;
    const sinIva = total / ivaF;
    const iva = total - sinIva;
    const comision = sinIva * cPct / 100;
    const bolsillo = total - iva - comision - (opts.clienteCompra ? 0 : matCost);
    const porHora = horas ? (bolsillo - viaje) / horas : 0;
    return {total, iva, comision, comPct:cPct, bolsillo, porHora, usoMinimo, bajoMinimo};
  }

  const usarComision = opts.usarComision !== false;
  const conCom = calcMode(true);
  const sinCom = calcMode(false);
  const act = usarComision ? conCom : sinCom;

  const warns = [...r.warns];
  if(act.usoMinimo) warns.push(`Se aplicó tu mínimo de ${ars(cfg.minimo)}. Si es un trabajo chico y querés bajarlo, en Opciones podés sacar el mínimo.`);
  const dias = Math.max(1, Math.ceil(horas/7)) + (r.secado ? 1 : 0);
  if(horas && act.porHora < cfg.valor_hora * 0.98) warns.push("Por hora te queda menos de lo que querés ganar. Revisá horas o precios de repuestos.");

  let kg = r.kg || 0;
  if(!kg){
    mats.forEach(m=>{
      const c = m.key && (cat[m.key] || CATALOG[m.key]);
      if(c && m.qty > 0){
        if(c.kgm) kg += m.qty * 6 * c.kgm;
        else if(c.kgu) kg += m.qty * c.kgu;
      }
    });
  } else {
    mats.forEach(m=>{
      if(m.extraIdx === undefined || !m.key || !(m.qty > 0)) return;
      const c = cat[m.key] || CATALOG[m.key];
      if(c && c.kgm) kg += m.qty * 6 * c.kgm;
      else if(c && c.kgu) kg += m.qty * c.kgu;
    });
  }

  return {
    ...r, kg, mats, tasks, horas, matCost, matCobrado, mo, viaje, neto, dias,
    usarComision, conCom, sinCom, ...act, warns,
    matCliente: opts.clienteCompra ? 0 : Math.round(matCobrado * ivaF)
  };
}

function pedirMessage(job,cfg){
  const items=[...(PEDIR[job.id]||PEDIR.otro),"Barrio o zona","¿Para cuándo lo necesitás?"];
  return [`¡Hola!${cfg.nombre?" Soy "+cfg.nombre+".":""} Para pasarte un precio justo (${job.name.toLowerCase()}) necesito que me mandes:`,
    ...items.map((x,k)=>`${k+1}. ${x}`),"","Con eso te paso el presupuesto enseguida. ¡Gracias!"].join("\n");
}
function rango(total,cfg){ const p=cfg.redondeo||1; return [Math.floor(total*0.9/p)*p, Math.ceil(total*1.25/p)*p]; }

function clientMessage(res, cfg, opts){
  const L=[], o1=opts.opcion1, iva=cfg.iva?" (IVA incluido)":"";
  const esDirecto = opts.usarComision === false;
  L.push(`¡Hola! Te paso el presupuesto${cfg.nombre?" de "+cfg.nombre:""}:`);
  if(o1){
    L.push("",`1️⃣ ${o1.desc}: ${ars(o1.total)}${iva}`,`2️⃣ ${res.desc}: ${ars(res.total)}${iva}`);
    const same=JSON.stringify(o1.incluye)===JSON.stringify(res.incluye);
    if(same){ L.push("","✅ Incluye:"); res.incluye.forEach(x=>L.push("• "+x)); }
    else { L.push("","✅ La opción 1 incluye:"); o1.incluye.forEach(x=>L.push("• "+x)); L.push("","✅ La opción 2 incluye:"); res.incluye.forEach(x=>L.push("• "+x)); }
  } else {
    L.push(`🔧 ${res.desc}`);
    if(res.incluye.length){ L.push("","✅ Incluye:"); res.incluye.forEach(x=>L.push("• "+x)); }
  }
  if(opts.clienteCompra) L.push("• Los materiales los comprás vos (te paso la lista)");
  if(res.excluye.length){ L.push("","❌ No incluye:"); res.excluye.forEach(x=>L.push("• "+x)); }
  if(res.dias) L.push("",res.dias===1?"⏱ Tiempo: lo hago en el día.":`⏱ Tiempo: unos ${res.dias} días${res.secado?" (contando el secado)":""}.`);
  if(o1){ L.push("","Decime cuál te sirve y lo agendamos."); }
  else if(opts.rango){ const [lo,hi]=rango(res.total,cfg);
    L.push("",`💰 Precio estimado: entre ${ars(lo)} y ${ars(hi)}${iva}`,`El precio final te lo confirmo cuando vea el trabajo.${cfg.visita?` La visita sale ${ars(cfg.visita)} y se descuenta si lo hacemos.`:""}`); }
  else {
    L.push("",`💰 Total: ${ars(res.total)}${iva}`);
    if(esDirecto){
      if(cfg.sena_modo==="50"){
        const p=cfg.redondeo||1000, sena=Math.round((res.total*0.5)/p)*p;
        L.push(`Seña para arrancar (50%): ${ars(sena)}, y el resto al terminar.`);
      } else if(res.matCliente>0){
        L.push(`Para arrancar te pido ${ars(res.matCliente)} para comprar los materiales, y el resto al terminar.`);
      }
    }
  }
  if(esDirecto && cfg.alias) L.push(`Alias para la seña: ${cfg.alias}`);
  L.push(`Precio válido por ${cfg.validez} días.`);
  if(cfg.garantia) L.push(`Garantía: ${cfg.garantia}.`);
  return L.join("\n");
}

function shoppingList(res){

    <div class="stepper"><button type="button" data-step="${f.id}" data-d="-1" aria-label="Disminuir ${esc(f.label)}">−</button>

    <button type="button" data-step="${f.id}" data-d="1" aria-label="Aumentar ${esc(f.label)}">+</button></div></div>`;
  if(f.type==="choice") return `<div class="field"><span class="flabel">${esc(f.label)}</span><div class="opts ${f.options.length===3?"g3":""}" role="group" aria-label="${esc(f.label)}">
    ${f.options.map(([k,l])=>`<button type="button" class="opt" data-choice="${f.id}" data-v="${k}" aria-pressed="${v===k}">${esc(l)}</button>`).join("")}</div></div>`;
  if(f.type==="multi") return `<div class="field"><span class="flabel">${esc(f.label)} <span class="muted small">(podés marcar varias)</span></span><div class="opts" role="group" aria-label="${esc(f.label)}">
    ${f.options.map(([k,l])=>{const on=v.includes(k);return `<button type="button" class="opt" data-multi="${f.id}" data-v="${k}" aria-pressed="${on}">${svg(on?"check":"plus",'class="ico"')}${esc(l)}</button>`;}).join("")}</div></div>`;

    <button type="button" class="opt" data-yes="${f.id}" data-v="1" aria-pressed="${v===true}" style="min-width:96px">Sí</button>

function drawing(){
  const j=S.job,i=S.inputs; if(!j.drawing) return "";
  const W=360,H=210,pad=34, A=i.ancho, B=i.alto, s=Math.min((W-2*pad)/A,(H-2*pad)/B);
  const w=A*s,h=B*s,x=(W-w)/2,y=(H-h)/2+4;
  let inner="";
  if(j.drawing==="mosq"){ const g=Math.max(6,Math.min(w,h)/10); let p="";
    for(let k=x+g;k<x+w;k+=g)p+=`M${k} ${y}V${y+h}`; for(let k=y+g;k<y+h;k+=g)p+=`M${x} ${k}H${x+w}`;
    inner=`<path d="${p}" stroke="var(--muted)" stroke-width=".8" opacity=".6"/>`;
    if(i.tipo==="corredizo") inner+=`<path d="M${x} ${y+h+6}H${x+w}" stroke="var(--ink)" stroke-width="3"/>`;
    if(i.tipo==="enrollable") inner+=`<rect x="${x-4}" y="${y-12}" width="${w+8}" height="12" rx="3" fill="var(--ink)"/>`;
  } else {
    const mat=i.material||"cano_2020", esHoja=mat==="chapa_18"||mat==="metal_desp";
    const doble=i.uso==="porton"&&i.apertura==="doble", corredizo=i.uso==="porton"&&i.apertura==="corredizo";
    let foot="";
    if(mat==="chapa_18"){
      inner=`<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${h-4}" fill="var(--line)" opacity=".45"/>`;
      foot="Chapa ciega BWG 18";
    } else if(mat==="metal_desp"){
      const g=Math.max(8,Math.min(w,h)/9); let p="";
      for(let k=0;k<w+h;k+=g){
        const x1=x+Math.max(0,k-h), y1=y+Math.min(h,k), x2=x+Math.min(w,k), y2=y+Math.max(0,k-w);
        p+=`M${x1} ${y1}L${x2} ${y2}`;
        const rx1=x+w-Math.max(0,k-h), rx2=x+w-Math.min(w,k);
        p+=`M${rx1} ${y1}L${rx2} ${y2}`;
      }
      inner=`<path d="${p}" stroke="var(--muted)" stroke-width="1" opacity=".65"/>`;
      foot="Metal desplegado";
    } else {
      const n=Math.max(0,Math.ceil(A/i.sep)-1); let p="";
      for(let k=1;k<=n;k++){const xx=x+w*k/(n+1);p+=`M${xx} ${y}V${y+h}`;}
      const tv=i.uso==="ventana"?2:3; for(let k=1;k<=tv;k++){const yy=y+h*k/(tv+1);p+=`M${x} ${yy}H${x+w}`;}
      inner=`<path d="${p}" stroke="var(--ink)" stroke-width="${mat==="hierro_12"||mat==="redondo_916"?"1.9":"2.4"}"/>`;
      foot=`${n} barrotes cada ${i.sep} cm`;
    }
    if(doble){
      inner+=`<path d="M${x+w/2} ${y}V${y+h}" stroke="var(--ink)" stroke-width="4"/>`;
      foot+=" · 2 hojas";
    }
    if(corredizo){
      inner+=`<path d="M${x-10} ${y+h+7}H${x+w+10}" stroke="var(--ink)" stroke-width="3"/>`;
      inner+=`<circle cx="${x+14}" cy="${y+h+4}" r="3.5" fill="var(--accent)"/><circle cx="${x+w-14}" cy="${y+h+4}" r="3.5" fill="var(--accent)"/>`;
      foot+=" · corredizo";
    }
    if(i.uso!=="ventana"||i.cerradura){
      const cx=doble?(x+w/2-9):(x+w-8);
      inner+=`<circle cx="${cx}" cy="${y+h/2}" r="4.5" fill="var(--accent)"/>`;
    }
    inner+=`<text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="12" fill="var(--muted)" font-weight="700">${foot}</text>`;
  }
  return `<div class="drawing"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dibujo ${A} por ${B} centímetros">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--card)" stroke="var(--ink)" stroke-width="4" rx="2"/>${inner}
    <g fill="var(--accent)" font-weight="800" font-size="15" font-family="Archivo, sans-serif">
    <text x="${W/2}" y="${y-(j.drawing==="mosq"&&i.tipo==="enrollable"?18:8)}" text-anchor="middle">${A} cm</text>
    <text x="${x-8}" y="${y+h/2}" text-anchor="end" dominant-baseline="middle">${B} cm</text></g></svg></div>`;
}

function obraLine(id){ return O.lines[id]||(O.lines[id]={qty:0,lvl:"medio"}); }

function histStats(){
  const m=hist.filter(x=>x.estado); if(m.length<3) return "";
  const si=m.filter(x=>x.estado==="si").length;
  return `<p class="small muted" style="margin:0">Te aceptaron ${si} de ${m.length} (${Math.round(si/m.length*100)}%).${si/m.length<0.3?" Si te rechazan mucho, probá revisar tus precios.":""}</p>`;
}

function saveHist(){
  const r=S.res;
  const e={
    id:S.histId||Date.now(), date:Date.now(), jobId:S.job.id,
    inputs:JSON.parse(JSON.stringify(S.inputs)),
    hoursOv:{...S.hoursOv}, qtyOv:{...S.qtyOv},
    extraMats:JSON.parse(JSON.stringify(S.extraMats)),
    cliente:S.cliente,
    opts:{...S.opts,opcion1:null},
    usarComision:r.usarComision,
    total:r.total, desc:r.desc, estado:null
  };
  const k=hist.findIndex(x=>x.id===e.id);
  if(k>=0){e.estado=hist[k].estado; hist.splice(k,1);}
  hist.unshift(e); hist=hist.slice(0,30); S.histId=e.id;
  LS.set("presu_hist",hist);
  try{localStorage.removeItem("presu_draft");}catch(x){}
}

function reopen(x){
  openJob(x.jobId,x.inputs,x.extraMats||[],3);
  S.hoursOv={...(x.hoursOv||{})};
  S.qtyOv={...(x.qtyOv||{})};
  S.cliente=x.cliente||"";
  S.opts={clienteCompra:false,urgente:false,viaje:null,rango:false,opcion1:null,sinMinimo:false,usarComision:true,...(x.opts||{})};
  render();
}

function render(){
  if(S.screen==="home") renderHome();
  else if(S.screen==="repuestos") renderRepuestos();
  else if(S.screen==="job") renderJob();
  else if(S.screen==="obra") renderObra();
  else if(S.screen==="taller") renderTaller();
  else renderPrecios();
}

function rerenderJobKeepFocus(){
  const id=document.activeElement&&document.activeElement.id;
  const pos=window.scrollY;
  renderJob();
  window.scrollTo(0,pos);
  if(id){
    const el=document.getElementById(id);
    if(el&&el.tagName==="INPUT"){
      el.focus();
      try{const L=el.value.length;el.setSelectionRange(L,L);}catch(e){}
    }
  }
}

const num=s=>{const v=parseFloat(String(s).replace(/\./g,"").replace(",","."));return isNaN(v)?null:v;};
const numDec=s=>{const v=parseFloat(String(s).replace(",","."));return isNaN(v)?null:v;};

function markCopied(btn){
  if(!btn || btn.classList.contains("iconbtn")) return;
  const prev=btn.innerHTML;
  btn.classList.add("copied");
  btn.innerHTML=`${svg("check")} ¡Copiado!`;
  clearTimeout(btn._ct);
  btn._ct=setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML=prev; },2200);
}

async function copy(text,ok,btn){
  try{ await navigator.clipboard.writeText(text); toast(ok); markCopied(btn); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(ok); markCopied(btn); }catch(e2){ toast("Mantené apretado el texto para copiarlo"); }
    document.body.removeChild(ta);
  }
}

  cartbar.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const a=b.dataset.act;
    if(a==="cartclear"){ S.repCart={}; toast("Selección borrada"); return renderRepuestos(); }
    if(a==="cartquote"){
      const list=Object.entries(S.repCart).filter(([,q])=>q>0).map(([key,qty])=>({key,qty}));
      if(!list.length) return;
      const all=getAllCatalog(customMats);
      const title=list.length===1 ? all[list[0].key]?.n : `Trabajo con ${list.length} repuestos`;
      S.repCart={};
      S.note=`Cargaste ${list.length} repuesto${list.length>1?"s":""}. Ajustá las horas y pasá al paso 3 para enviar.`;
      return openJob("otro",{texto:title||"Trabajo a medida",horas:2,mat:0},list,1);
    }
  });
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act],[data-go]"); if(!b) return;
  const d=b.dataset;

  if(d.go) return go(d.go);
  if(d.job){ S.note=null; return openJob(d.job); }
  if(d.fav!==undefined){ S.note=null; const f=favs[+d.fav]; reopen(f); S.histId=null; return; }
  if(d.delfav!==undefined){
    const idx=+d.delfav, fname=favs[idx]?.name||"este frecuente";
    return askConfirm("¿Borrar frecuente?",`Se va a quitar "${fname}" de tus trabajos frecuentes.`,"Borrar",b,()=>{
      favs.splice(idx,1); LS.set("presu_favs",favs); toast("Eliminado de frecuentes"); renderHome();
    });
  }
  if(d.hist!==undefined){ S.note="Precios recalculados con tus valores de hoy."; const x=hist[+d.hist]; reopen(x); S.histId=null; return; }
  if(d.mk!==undefined){ const x=hist[+d.mk]; x.estado=x.estado===d.v?null:d.v; LS.set("presu_hist",hist); return renderHome(); }

  /* Repuestos */
  if(d.repcat){ S.repCat=d.repcat; return renderRepuestos(); }
  if(d.act==="clrrep"){ S.repQuery=""; renderRepuestos(); const s=document.getElementById("repsearch"); if(s) s.focus(); return; }
  if(d.act==="togglenewrep"){
    S.newRepOpen=!S.newRepOpen; S.errs.nr=""; if(!S.newRepOpen) S.newRepDraft="";
    renderRepuestos();
    if(S.newRepOpen){ const el=document.getElementById("nr_n"); if(el) el.focus(); }
    return;
  }
  if(d.act==="newfromsearch"){
    S.newRepOpen=true; S.newRepDraft=S.repQuery.trim(); S.errs.nr="";
    renderRepuestos();
    const el=document.getElementById("nr_p"); if(el) el.focus();
    return;
  }
  if(d.act==="savenewrep"){
    const n=(document.getElementById("nr_n").value||"").trim();
    const u=(document.getElementById("nr_u").value||"u").trim()||"u";
    const p=num(document.getElementById("nr_p").value)||0;
    const cat=document.getElementById("nr_c").value||"propios";
    if(!n){ S.errs.nr="Escribí el nombre del repuesto antes de guardar."; S.newRepDraft=""; renderRepuestos(); const el=document.getElementById("nr_n"); if(el) el.focus(); return; }
    const k="u_"+Date.now().toString(36);
    customMats[k]={n,u,p,cat,q:n};
    prices[k]=p;
    LS.set("presu_custom_mats",customMats); LS.set("presu_prices",prices);
    S.newRepOpen=false; S.newRepDraft=""; S.errs.nr=""; toast("Repuesto guardado"); return renderRepuestos();
  }
  if(d.delcustom){
    const k=d.delcustom, name=customMats[k]?.n||"este repuesto";
    return askConfirm("¿Eliminar repuesto?",`Se va a borrar "${name}" de tu lista de repuestos propios.`,"Eliminar",b,()=>{
      delete customMats[k]; delete prices[k];
      LS.set("presu_custom_mats",customMats); LS.set("presu_prices",prices);
      toast("Repuesto eliminado"); renderRepuestos();
    });
  }
  if(d.cartq){
    const k=d.cartq, nv=Math.max(0,(S.repCart[k]||0)+(+d.d));
    if(nv===0) delete S.repCart[k]; else S.repCart[k]=nv;
    return renderRepuestos();
  }
  if(d.stepgo){ S.step=+d.stepgo; renderJob(); window.scrollTo(0,0); return; }

  /* Job actions */
  if(d.preset!==undefined){
    const pr=S.job.presets[+d.preset];
    Object.assign(S.inputs,pr.vals);
    toast("Medidas cargadas: "+pr.label);
    return rerenderJobKeepFocus();
  }
  if(d.com!==undefined){ S.opts.usarComision=d.com==="1"; return rerenderJobKeepFocus(); }
  if(d.ocom!==undefined){ O.usarComision=d.ocom==="1"; return rerenderObra(); }

  if(d.act==="openpicker"){
    S.pickerOpen=true; S.open.materiales=true; S.errs.ex="";
    rerenderJobKeepFocus();
    const el=document.getElementById("pickq"); if(el) el.focus();
    return;
  }
  if(d.act==="closepicker"){ S.pickerOpen=false; S.pickerQuery=""; S.errs.ex=""; return rerenderJobKeepFocus(); }
  if(d.pickmat){
    const ex=S.extraMats.find(x=>x.key===d.pickmat);
    if(ex) ex.qty+=1; else S.extraMats.push({key:d.pickmat,qty:1});
    toast("Repuesto sumado");
    return rerenderJobKeepFocus();
  }
  if(d.act==="addcustomex"){
    const n=(document.getElementById("ex_n").value||"").trim();
    const p=num(document.getElementById("ex_p").value)||0;
    if(!n){ S.errs.ex="Escribí el nombre del repuesto."; rerenderJobKeepFocus(); const el=document.getElementById("ex_n"); if(el) el.focus(); return; }
    S.extraMats.push({name:n,unit:"u",qty:1,price:p});
    S.pickerOpen=false; S.errs.ex=""; toast("Repuesto sumado");
    return rerenderJobKeepFocus();
  }
  if(d.mq){
    const m=S.res.mats.find(x=>x.key===d.mq&&x.extraIdx===undefined);
    if(m){
      const nv=Math.max(0, Math.round((m.qty+(+d.d))*10)/10);
      if(nv===m.autoQty) delete S.qtyOv[d.mq]; else S.qtyOv[d.mq]=nv;
    }
    return rerenderJobKeepFocus();
  }
  if(d.exq!==undefined){
    const em=S.extraMats[+d.exq];
    if(em){ em.qty=Math.max(0, Math.round((em.qty+(+d.d))*10)/10); if(em.qty===0) S.extraMats.splice(+d.exq,1); }
    return rerenderJobKeepFocus();
  }
  if(d.exdel!==undefined){ S.extraMats.splice(+d.exdel,1); return rerenderJobKeepFocus(); }

  if(d.act==="pedircopiar") return copy(pedirMessage(S.job,cfg),"Mensaje copiado para pedir medidas",b);
  if(d.act==="wa"){ saveHist(); toast("Guardado en Últimos presupuestos"); return; }
  if(d.act==="draft"){ const x=LS.get("presu_draft",null); if(x){ S.note=null; reopen(x); } return; }
  if(d.act==="nodraft"){ try{localStorage.removeItem("presu_draft");}catch(x){} return renderHome(); }
  if(d.hreset!==undefined){ delete S.hoursOv[d.hreset]; return rerenderJobKeepFocus(); }
  if(d.act==="opcion1"){ S.opts.opcion1={desc:S.res.desc,total:S.res.total,incluye:[...S.res.incluye]}; S.opts.rango=false; toast("Opción 1 guardada. Cambiá lo que quieras para la 2"); return rerenderJobKeepFocus(); }
  if(d.act==="quitaro1"){ S.opts.opcion1=null; return rerenderJobKeepFocus(); }
  if(d.act==="fav"){
    const inp=document.getElementById("favname");
    if(inp.classList.contains("hidden")){ inp.classList.remove("hidden"); inp.value=S.res.desc; inp.focus(); b.lastChild.textContent=" Listo, guardar"; return; }
    favs.unshift({name:inp.value.trim()||S.res.desc,jobId:S.job.id,inputs:JSON.parse(JSON.stringify(S.inputs)),hoursOv:{...S.hoursOv},qtyOv:{...S.qtyOv},extraMats:JSON.parse(JSON.stringify(S.extraMats)),opts:{...S.opts,opcion1:null,rango:false}});
    favs=favs.slice(0,12); LS.set("presu_favs",favs); toast("Guardado en frecuentes"); return rerenderJobKeepFocus();
  }

  /* Inflación (con diálogo de confirmación) */
  if(d.subir){
    const pct=+d.subir, ks=Object.keys(prices);
    if(!ks.length){ toast("Primero guardá tus precios propios"); return; }
    return askConfirm(`¿Subir tus precios un ${pct}%?`,`Se van a actualizar ${ks.length} precio${ks.length>1?"s":""} guardado${ks.length>1?"s":""} en este celular.`,"Subir "+pct+"%",b,()=>{
      const f=1+pct/100;
      ks.forEach(k=>prices[k]=Math.round(prices[k]*f/100)*100);
      Object.keys(customMats).forEach(k=>{ customMats[k].p=prices[k]??Math.round(customMats[k].p*f/100)*100; });
      LS.set("presu_prices",prices); LS.set("presu_custom_mats",customMats);
      toast(`Subí ${ks.length} precios un ${pct}%`);
      renderRepuestos();
    });
  }

  /* Backup (con diálogo y error inline) */
  if(d.act==="backup"){ const s=btoa(unescape(encodeURIComponent(JSON.stringify({cfg,prices,customMats,favs,hist,taller:T})))); return copy("PRESU:"+s,"Copia de seguridad copiada",b); }
  if(d.act==="restore"){
    const raw=(document.getElementById("restoretxt").value||"").trim();
    if(!raw){ S.errs.restore="Pegá primero el texto de tu copia de seguridad."; renderPrecios(); const el=document.getElementById("restoretxt"); if(el) el.focus(); return; }
    let parsed=null;
    try{
      parsed=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/^PRESU:/,"")))));
    }catch(err){
      S.errs.restore="Ese texto no es una copia válida. Copiala entera desde PRESU: y probá de nuevo.";
      renderPrecios();
      const el=document.getElementById("restoretxt"); if(el){ el.value=raw; el.focus(); }
      return;
    }
    return askConfirm("¿Reemplazar los datos de este celular?","Esta acción reemplaza tus tarifas, repuestos e historial actuales por los de la copia.","Recuperar",b,()=>{
      cfg={...DEFAULT_CONFIG,...parsed.cfg}; prices=parsed.prices||{}; customMats=parsed.customMats||{}; favs=parsed.favs||[]; hist=parsed.hist||[];
      if(parsed.taller){
        T={...T_DEF,...parsed.taller,form:{...T_DEF.form,...(parsed.taller.form||{})}};
        if(!Array.isArray(T.cuts)) T.cuts=[];
        if(!Array.isArray(T.retazos)) T.retazos=[];
        if(!Array.isArray(T.obras)) T.obras=[];
        if(!T.done||typeof T.done!=="object") T.done={};
        saveT();
      }
      LS.set("presu_cfg",cfg); LS.set("presu_prices",prices); LS.set("presu_custom_mats",customMats); LS.set("presu_favs",favs); LS.set("presu_hist",hist);
      S.errs.restore=""; applyTheme(); toast("¡Datos recuperados!"); go("home");
    });
  }

  if(d.act==="home") return go("home");
  if(d.rubro){ O.rubro=d.rubro; return rerenderObra(); }
  if(d.oq){ const L=obraLine(d.oq); L.qty=Math.max(0,Math.round((L.qty+(+d.d))*100)/100); return rerenderObra(); }
  if(d.lvl){ obraLine(d.lvl).lvl=d.v; return rerenderObra(); }
  if(d.oopt){ O[d.oopt]=!O[d.oopt]; return rerenderObra(); }
  if(d.omat){ O.conMat=d.omat==="1"; return rerenderObra(); }
  if(d.act==="ocopiar") return copy(obraMessage(S.obraRes,cfg,O.conMat),"Mensaje copiado",b);
  if(d.act==="olista") return copy(shoppingList(S.obraRes),"Lista copiada",b);

  if(d.act==="copiar"){ saveHist(); return copy(clientMessage(S.res,cfg,S.opts), S.res.usarComision?"Copiado para Clickie y guardado":"Presupuesto copiado y guardado",b); }
  if(d.act==="copiarnum"){ saveHist(); return copy(String(Math.round(S.res.total)),`Monto copiado: ${ars(S.res.total)}`,b); }
  if(d.act==="lista") return copy(shoppingList(S.res),"Lista de ferretería copiada",b);
  if(d.act==="rejataller"){
    const cuts=rejaCuts(S.inputs);
    const load=()=>{
      T.workId=tId();
      T.cuts=cuts.map(c=>({...c,id:tId()}));
      T.obra=(S.cliente?S.cliente+" — ":"")+S.res.desc;
      T.done={};
      saveT();
      toast("Cortes cargados en Taller");
      go("taller");
    };
    return T.cuts.length ? askConfirm("¿Cargar esta reja en Taller?","Si ya tenés cortes cargados en Taller, se van a reemplazar (podés guardar tu obra actual antes desde Taller).","Cargar en Taller",b,load) : load();
  }

  if(d.step){
    const f=S.job.fields.find(x=>x.id===d.step);
    let v=Math.round((S.inputs[f.id]+f.step*(+d.d))*100)/100;
    if(v>f.max||v<f.min) toast(v>f.max?`Máximo ${fmtQ(f.max)} ${f.unit}`:`Mínimo ${fmtQ(f.min)} ${f.unit}`);
    S.inputs[f.id]=Math.min(f.max,Math.max(f.min,v));
    return rerenderJobKeepFocus();
  }
  if(d.choice){ S.inputs[d.choice]=d.v; return rerenderJobKeepFocus(); }
  if(d.multi){ const a=S.inputs[d.multi]; const k=a.indexOf(d.v); k<0?a.push(d.v):a.splice(k,1); return rerenderJobKeepFocus(); }
  if(d.yes){ S.inputs[d.yes]=d.v==="1"; return rerenderJobKeepFocus(); }
  if(d.h!==undefined){ const t=S.res.tasks[+d.h]; const v=Math.max(0.25,t.hours+(+d.d)); if(v===t.auto) delete S.hoursOv[t.name]; else S.hoursOv[t.name]=v; return rerenderJobKeepFocus(); }
  if(d.opt){ S.opts[d.opt]=!S.opts[d.opt]; return rerenderJobKeepFocus(); }
  if(d.iva){ cfg.iva=d.iva==="1"; LS.set("presu_cfg",cfg); return renderPrecios(); }
  if(d.setcom){ cfg.comision=+d.setcom; LS.set("presu_cfg",cfg); toast(`Comisión Clickie: ${cfg.comision}%`); return renderPrecios(); }
  if(d.sena){ cfg.sena_modo=d.sena; LS.set("presu_cfg",cfg); toast(d.sena==="50"?"Seña: 50% del total":"Seña: costo de materiales"); return renderPrecios(); }
  if(d.soloherr!==undefined){ cfg.solo_herreria=d.soloherr==="1"; LS.set("presu_cfg",cfg); toast(cfg.solo_herreria?"Modo solo herrería activado":"Mostrando todos los rubros"); return S.screen==="home"?renderHome():renderPrecios(); }
  if(d.theme){ cfg.theme=d.theme; LS.set("presu_cfg",cfg); applyTheme(); return renderPrecios(); }
});

app.addEventListener("change",e=>{
  const el=e.target, d=el.dataset;
  if(d.num){
    const f=S.job.fields.find(x=>x.id===d.num);
    const v=f.unit==="$"?num(el.value):numDec(el.value);
    if(v!==null){
      if(v>f.max||v<f.min) toast(v>f.max?`Máximo ${fmtQ(f.max)} ${f.unit}`:`Mínimo ${fmtQ(f.min)} ${f.unit}`);
      S.inputs[f.id]=Math.min(f.max,Math.max(f.min,v));
    }
    return rerenderJobKeepFocus();
  }
  if(d.text){ S.inputs[d.text]=el.value; return rerenderJobKeepFocus(); }
  if(d.cliente!==undefined){ S.cliente=el.value; return rerenderJobKeepFocus(); }
  if(d.oqin){ const v=numDec(el.value); if(v!==null) obraLine(d.oqin).qty=Math.max(0,v); return rerenderObra(); }
  if(d.oviaje!==undefined){ const v=num(el.value); if(v!==null) O.viaje=v; return rerenderObra(); }
  if(d.price){
    const v=num(el.value);
    if(v!==null){
      prices[d.price]=v;
      if(customMats[d.price]){ customMats[d.price].p=v; LS.set("presu_custom_mats",customMats); }
      LS.set("presu_prices",prices);
      toast("Precio guardado");
    }
    if(S.screen==="job") return rerenderJobKeepFocus();
    if(S.screen==="obra") return rerenderObra();
    if(S.screen==="repuestos") return renderRepuestos();
    return;
  }
  if(d.exprice!==undefined){
    const v=num(el.value);
    if(v!==null&&S.extraMats[+d.exprice]){ S.extraMats[+d.exprice].price=v; }
    return rerenderJobKeepFocus();
  }
  if(d.viaje!==undefined){ const v=num(el.value); if(v!==null) S.opts.viaje=v; return rerenderJobKeepFocus(); }
  if(d.cfg){
    const money=MONEY_KEYS.includes(d.cfg), v=money?num(el.value):numDec(el.value);
    if(v!==null){
      cfg[d.cfg]=d.cfg==="comision"?Math.min(60,Math.max(0,v)):v;
      LS.set("presu_cfg",cfg);
      el.value=money?fmtN(cfg[d.cfg]):String(cfg[d.cfg]).replace(".",",");
      toast("Guardado");
      if(d.cfg==="comision") renderPrecios();
    } else {
      toast("Escribí solo números");
      el.value=money?fmtN(cfg[d.cfg]):cfg[d.cfg];
    }
    return;
  }
  if(d.cfgtxt){ cfg[d.cfgtxt]=el.value; LS.set("presu_cfg",cfg); toast("Guardado"); return; }
});

/* ---------- TALLER: cortes de barras (cargar cortes, retazos, optimizar barras de 6 m y planilla para el cortador) ---------- */
const tId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const T_DEF={workId:"",obra:"",barra:6000,disco:3,minSob:300,cuts:[],done:{},retazos:[],obras:[],usarRetazos:true,form:{perfil:"cano_4040",parte:"",ang:"90",u:"mm",txt:""}};
let T={...T_DEF,...LS.get("presu_taller",{})};
T.form={...T_DEF.form,...(T.form||{})};
if(!T.workId) T.workId=tId();
if(!Array.isArray(T.cuts)) T.cuts=[];
if(!Array.isArray(T.retazos)) T.retazos=[];
if(!Array.isArray(T.obras)) T.obras=[];
if(!T.done||typeof T.done!=="object") T.done={};
const saveT=()=>LS.set("presu_taller",T);

/* Convierte un número escrito a mm según unidad ('mm' o 'cm'). En 'mm', <20 se toma como metros (2,64 → 2640). */
function tToMm(v,u){
  if(v===null||isNaN(v)||v<=0) return null;
  if(u==="cm") return Math.round(v*10);
  return Math.round(v<20?v*1000:v);
}
const tLen=s=>tToMm(numDec(String(s).trim()),"mm");

/* Lee "2640x2 1530x3" (también acepta "2x2640", "2,40 x 4", "120x4" en cm). Sin cantidad = 1. */
function tParse(txt,u){
  const unit=u||"mm", out=[], re=/(\d+(?:[.,]\d+)?)\s*(?:(?:x|×|\*|por)\s*(\d+))?/gi;
  let m;
  while((m=re.exec(String(txt||"")))){
    const raw1=m[1], v1=parseFloat(raw1.replace(",","."));
    let len, qty;
    if(m[2]){
      const v2=parseInt(m[2],10);
      const hasDec=/[.,]/.test(raw1);
      /* Si escribió cantidad adelante (ej. "2x2640" o "4x150" en cm): invertir automáticamente */
      if(!hasDec && v1>=1 && v1<=50 && v2>=100 && v2>v1){
        len=tToMm(v2,unit);
        qty=Math.round(v1);
      } else {
        len=tToMm(v1,unit);
        qty=v2;
      }
    } else {
      len=tToMm(v1,unit);
      qty=1;
    }
    if(len&&qty>0) out.push({len,qty:Math.min(qty,500)});
  }
  return out;
}

/* Perfiles = todo lo del catálogo (y propios) que se vende por barra. */
function tPerfiles(){
  const all=getAllCatalog(customMats);
  return Object.entries(all).filter(([,c])=>/barra/i.test(c.u))
    .map(([k,c])=>({key:k,n:c.n,q:c.q,kgm:c.kgm||0,price:prices[k]??c.p??0,example:prices[k]===undefined&&!c.customDef}));
}

/* Llena cada barra (o retazo disponible) con DP en décimas de mm (enteros: soporta disco decimal ej. 1,6 mm sin colgarse). */
function tPackOne(rem,barLen,disco){
  const S=10, B=Math.round(barLen*S), D=Math.round(disco*S), cap=B+D;
  if(cap<=0) return null;
  const reach=new Int32Array(cap+1).fill(-1); reach[0]=-2;
  let best=0;
  for(let i=0;i<rem.length&&best<cap;i++){
    const w=Math.round(rem[i].len*S)+D;
    if(w<=0||w>cap) continue;
    for(let c=cap;c>=w;c--) if(reach[c]===-1&&reach[c-w]!==-1){ reach[c]=i; if(c>best) best=c; }
  }
  if(best===0) return null;
  const take=new Set(); let c=best;
  while(c>0){ const i=reach[c]; if(i<0) break; take.add(i); c-=Math.round(rem[i].len*S)+D; }
  if(!take.size) return null;
  const pieces=rem.filter((_,i)=>take.has(i));
  const nextRem=rem.filter((_,i)=>!take.has(i));
  const used=pieces.reduce((s,p)=>s+p.len,0)+disco*pieces.length;
  const sobra=Math.max(0,Math.round((barLen-used)*10)/10);
  return {pieces,sobra,len:barLen,nextRem};
}

function tPack(pcs,barra,disco,retazos){
  const largas=pcs.filter(p=>p.len>barra);
  let rem=pcs.filter(p=>p.len<=barra).sort((a,b)=>b.len-a.len);
  const bars=[];
  /* Primero intentar ubicar cortes en retazos guardados del taller (de menor a mayor para cuidar los largos) */
  const rets=[...(retazos||[])].filter(r=>r>0&&r<=barra).sort((a,b)=>a-b);
  for(const rLen of rets){
    if(!rem.length) break;
    const fit=tPackOne(rem,rLen,disco);
    if(fit){
      bars.push({pieces:fit.pieces,sobra:fit.sobra,len:rLen,retazo:true});
      rem=fit.nextRem;
    }
  }
  while(rem.length){
    const fit=tPackOne(rem,barra,disco);
    if(!fit) break;
    bars.push({pieces:fit.pieces,sobra:fit.sobra,len:barra,retazo:false});
    rem=fit.nextRem;
  }
  return {bars,largas};
}

function tPlan(cuts,barra,disco,retazosList){
  const by={}, retBy={};
  (retazosList||[]).forEach(r=>{ (retBy[r.perfil]=retBy[r.perfil]||[]).push(r.len); });
  cuts.forEach(c=>{ const a=(by[c.perfil]=by[c.perfil]||[]); for(let i=0;i<c.qty;i++) a.push({len:c.len,parte:c.parte,ang:c.ang}); });
  return Object.entries(by).map(([perfil,pcs])=>{
    const rets=retBy[perfil]||[];
    const r=tPack(pcs,barra,disco,rets);
    const newBars=r.bars.filter(b=>!b.retazo);
    const retUsed=r.bars.filter(b=>b.retazo);
    const empBars=r.largas.length?Math.ceil(r.largas.reduce((s,p)=>s+p.len,0)/barra):0;
    return {perfil,...r,newBars,retUsed,empBars,buyBars:newBars.length+empBars,tips:tTips(pcs,r.bars,barra,disco,rets)};
  });
}

/* Si achicando un corte unos pocos mm entra uno más por barra (ahorra barras o deja un sobrante largo entero), avisa. */
function tTips(pcs,bars,barra,disco,rets){
  const tips=[], cap=barra+disco, cnt={}, nBars=bars.filter(b=>!b.retazo).length;
  const maxSob=bars.filter(b=>!b.retazo).reduce((m,b)=>Math.max(m,b.sobra),0);
  pcs.forEach(p=>{ if(p.len<=barra) cnt[p.len]=(cnt[p.len]||0)+1; });
  Object.entries(cnt).forEach(([L,n])=>{
    L=+L; if(n<2) return;
    const k=Math.floor(cap/(L+disco)); if(k<1) return;
    const L2=Math.floor(cap/(k+1)-disco), d=L-L2;
    if(d<=0||d>10) return;
    const alt=pcs.map(p=>p.len===L?{...p,len:L2}:p);
    const r2=tPack(alt,barra,disco,rets), nb=r2.bars.filter(b=>!b.retazo).length;
    const maxSob2=r2.bars.filter(b=>!b.retazo).reduce((m,b)=>Math.max(m,b.sobra),0);
    if(nb<nBars) tips.push({L,L2,ahorro:nBars-nb});
    else if(nb===nBars&&maxSob2-maxSob>=1000) tips.push({L,L2,ahorro:0,sobra:maxSob2});
  });
  return tips;
}

/* Agrupa barras iguales consecutivas: "Barras 1 a 3 (×3)". Numera las barras nuevas desde 1, aparte de los retazos. */
function tGroupBars(bars){
  const out=[]; let barIdx=0;
  bars.forEach(b=>{
    if(!b.retazo) barIdx++;
    const sig=(b.retazo?"R"+b.len:"B")+":"+b.pieces.map(p=>p.len+"|"+(p.parte||"")+"|"+p.ang).join(",");
    const last=out[out.length-1];
    if(last&&last.sig===sig) last.n++; else out.push({sig,bar:b,n:1,from:b.retazo?0:barIdx});
  });
  return out;
}

function tBarSVG(b,barra,disco,minSob){
  const W=600,H=40, refLen=b.len||barra; let x=0, s="";
  b.pieces.forEach((p,i)=>{
    const w=p.len/refLen*W, alt=i%2?" alt":"", ww=Math.max(1,w-1);
    if(p.ang==="45"&&ww>16) s+=`<polygon points="${(x+6).toFixed(1)},2 ${(x+ww-6).toFixed(1)},2 ${(x+ww).toFixed(1)},${H-2} ${x.toFixed(1)},${H-2}" class="bp${alt}"/>`;
    else s+=`<rect x="${x.toFixed(1)}" y="2" width="${ww.toFixed(1)}" height="${H-4}" rx="3" class="bp${alt}"/>`;
    if(w>38) s+=`<text x="${(x+ww/2).toFixed(1)}" y="${H/2+5}" text-anchor="middle" class="bt${alt}">${p.len}</text>`;
    x+=w+disco/refLen*W;
  });
  const w=W-x;
  if(b.sobra>0&&w>0.5){
    const util=b.sobra>=minSob;
    s+=`<rect x="${x.toFixed(1)}" y="3" width="${Math.max(1,w-1).toFixed(1)}" height="${H-6}" rx="3" class="${util?"bs":"bw"}"/>`;
    if(w>36) s+=`<text x="${(x+w/2).toFixed(1)}" y="${H/2+5}" text-anchor="middle" class="${util?"bst":"bwt"}">${util&&w>78?"sobra ":""}${fmtQ(b.sobra)}</text>`;
  }
  const desc=b.pieces.map(p=>p.len).join(", ");
  return `<svg class="barsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.retazo?"Retazo de "+refLen+" mm":"Barra"}: cortes de ${desc} mm, sobran ${fmtQ(b.sobra)} mm">${s}</svg>`;
}

const tCutTxt=p=>`${p.len}${p.ang==="45"?" (45°)":""}${p.parte?" "+p.parte:""}`;
const tRango=g=>g.bar.retazo?`Retazo ${g.bar.len} mm${g.n>1?` (×${g.n})`:""}`:(g.n>1?`Barras ${g.from} a ${g.from+g.n-1}`:`Barra ${g.from}`);

function tPlanillaText(plan,pmap){
  const L=[`PLANILLA DE CORTE${T.obra?" — "+T.obra:""}`,`Barras de ${fmtQ(T.barra/1000)} m · disco ${fmtQ(T.disco)} mm · medidas en mm`,""];
  plan.forEach(g=>{
    const name=(pmap[g.perfil]?.n||g.perfil).toUpperCase();
    const extra=g.retUsed.length?` (+ ${g.retUsed.length} retazo${g.retUsed.length>1?"s":""})`:"";
    L.push(`▸ ${name} — ${g.newBars.length} barra${g.newBars.length!==1?"s":""} nueva${g.newBars.length!==1?"s":""}${extra}`);
    tGroupBars(g.bars).forEach(x=>{
      L.push(`${tRango(x)}${!x.bar.retazo&&x.n>1?` (x${x.n})`:""}: ${x.bar.pieces.map(tCutTxt).join(" | ")} → sobra ${fmtQ(x.bar.sobra)}${x.bar.sobra>=T.minSob?" (guardar)":""}`);
    });
    g.largas.forEach(p=>L.push(`⚠ ${tCutTxt(p)}: más larga que la barra, hay que empalmar`));
    L.push("");
  });
  L.push("Cortar primero los largos y después los cortos.");
  return L.join("\n");
}

function tCorralonText(plan,pmap){
  const L=[`Pedido de hierros${T.obra?" — "+T.obra:""} (barras de ${fmtQ(T.barra/1000)} m):`];
  plan.forEach(g=>{
    if(g.buyBars<=0) return;
    L.push(`• ${g.buyBars} barra${g.buyBars>1?"s":""} — ${pmap[g.perfil]?.n||g.perfil}${g.empBars?` (incluye ${g.empBars} para empalmes)`:""}`);
  });
  return L.join("\n");
}

      ${totGuardMm>0?`<span>Retazos útiles: ${fmtQ(totGuardMm/1000)} m</span>`:""}
      ${totKg>0?`<span>≈ ${fmtQ(Math.round(totKg*10)/10)} kg de hierro</span>`:""}
    </div>
    ${totBuy>0?`<button type="button" class="btn ghost sm" style="background:rgba(255,255,255,.1);color:var(--on-slab);border-color:rgba(255,255,255,.25)" data-tact="corralon">${svg("cart")} Copiar pedido para el corralón</button>`:""}
    ${perf.some(p=>p.example&&perfUsados.includes(p.key))?`<span class="small" style="opacity:.82">Los precios en amarillo son de referencia: poné lo que te cobra tu corralón.</span>`:""}
  </section>

  <section class="card" aria-labelledby="t_planh">
    <h2 id="t_planh">Plan de corte</h2>
    <p class="small muted" style="margin:0">Cada fila es una barra de ${fmtQ(T.barra/1000)} m. Tocá <b>Cortado</b> para tildar desde el celular. En verde, el sobrante útil (&gt; ${T.minSob} mm).</p>
    ${plan.map(g=>`<div>
      <div class="tgh"><h3>${esc(pname(g.perfil))}</h3><span class="muted small">${g.newBars.length} barra${g.newBars.length!==1?"s":""}${g.retUsed.length?` + ${g.retUsed.length} retazo${g.retUsed.length>1?"s":""}`:""}</span></div>
      ${g.tips.map(t=>`<div class="banner good" style="margin-top:6px">${svg("sparkle")}<div>Si cortás las de <b>${t.L}</b> a <b>${t.L2} mm</b> entra una más por barra y ${t.ahorro?`te ahorrás <b>${t.ahorro} barra${t.ahorro>1?"s":""}</b>`:`te queda un sobrante entero de <b>${fmtQ(t.sobra)} mm</b>`}. <button type="button" class="ov" style="color:inherit;text-decoration:underline;margin-left:4px" data-tapply="${esc(g.perfil)}" data-from="${t.L}" data-to="${t.L2}">Cambiar a ${t.L2} mm</button></div></div>`).join("")}
      ${g.largas.length?`<div class="banner warn" style="margin-top:6px">${svg("alert")}<div>${g.largas.length} corte${g.largas.length>1?"s":""} más largo${g.largas.length>1?"s":""} que la barra (${[...new Set(g.largas.map(p=>p.len))].join(", ")} mm): hay que empalmar.</div></div>`:""}
      ${tGroupBars(g.bars).map((x,gi)=>{
        const dk=g.perfil+"|"+gi+"|"+x.sig, isDone=!!T.done[dk];
        return `<div class="bargrp ${isDone?"done":""}">
          <div class="bh">
            <span>${tRango(x)}${x.bar.retazo?'<span class="tretbadge">del taller</span>':""} ${!x.bar.retazo&&x.n>1?`<span class="x">×${x.n} iguales</span>`:""}</span>
            <button type="button" class="barck" data-tdone="${esc(dk)}" aria-pressed="${isDone}">${svg("check")} ${isDone?"Cortado":"Tildar"}</button>
          </div>
          ${tBarSVG(x.bar,T.barra,T.disco,T.minSob)}
          <div class="bc">${x.bar.pieces.map(p=>esc(tCutTxt(p))).join(" · ")} → sobra ${fmtQ(x.bar.sobra)} mm${x.bar.sobra>=T.minSob?`<button type="button" class="tsavbtn" data-tsaveret="${esc(g.perfil)}" data-rlen="${Math.round(x.bar.sobra)}">+ Guardar retazo</button>`:""}</div>
        </div>`;
      }).join("")}
    </div>`).join("")}
  </section>

  <section class="card" aria-labelledby="t_planillah">
    <h2 id="t_planillah">Planilla para el que corta</h2>
    <div class="msg">${esc(planilla)}</div>
    <div class="actions">
      <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(planilla)}">${svg("wa")} Mandar por WhatsApp</a>
      <div class="two">
        <button type="button" class="btn ghost" data-tact="copiar">${svg("copy")} Copiar</button>
        <button type="button" class="btn ghost" data-tact="print">${svg("layers")} Imprimir / PDF</button>
      </div>
      <button type="button" class="btn primary" data-tact="presu">Armar presupuesto con estas barras →</button>
    </div>
  </section>`:`<div class="banner good">${svg("sparkle")}<div>Elegí el perfil, escribí las medidas como en el cuaderno (<b>2640x2 1530x3</b>) y tocá <b>Agregar</b>. Abajo te aparece cuántas barras comprar y el dibujo de cada corte.</div></div>`}

  <details class="card" data-sec="tret" ${S.open.tret?"open":""}>
    <summary><h2>Retazos en el taller</h2><span class="sumv">${T.retazos.length?T.retazos.length+" guardado"+(T.retazos.length>1?"s":""):"ninguno"}</span>${svg("chev",'class="chev"')}</summary>
    <div class="inner">
      <p class="small muted" style="margin:0">Cargá sobrantes que ya tenés en el taller: el optimizador los usa primero antes de mandar a comprar barras nuevas.</p>
      <div class="opts"><button type="button" class="opt sm" data-tact="toggleret" aria-pressed="${!!T.usarRetazos}">${svg(T.usarRetazos?"check":"plus",'class="ico"')}Usar retazos disponibles primero</button></div>
      <div class="two">
        <select id="t_ret_p" class="txt" aria-label="Perfil del retazo">${perf.map(p=>`<option value="${esc(p.key)}" ${p.key===T.form.perfil?"selected":""}>${esc(p.n)}</option>`).join("")}</select>
        <input id="t_ret_l" class="txt num" inputmode="numeric" placeholder="Largo (mm)" aria-label="Largo del retazo en mm">
      </div>
      <button type="button" class="btn ghost sm" data-tact="addret">${svg("plus")} Agregar retazo al stock</button>
      ${T.retazos.length?`<ul class="rows">${T.retazos.map(r=>`<li class="row">
        <span class="name">${esc(pname(r.perfil))} · <b class="num">${r.len} mm</b>${r.fromWork===T.workId?` <span class="small muted">(para próximas obras)</span>`:""}</span>
        <button type="button" class="tdel" data-tdelret="${r.id}" aria-label="Borrar retazo de ${r.len} mm">${svg("x")}</button>
      </li>`).join("")}</ul>`:""}
    </div>
  </details>

  <details class="card" data-sec="tcfg" ${S.open.tcfg?"open":""}>
    <summary><h2>Ajustes de corte</h2><span class="sumv">${fmtQ(T.barra/1000)} m · disco ${fmtQ(T.disco)} mm</span>${svg("chev",'class="chev"')}</summary>
    <div class="inner">
      <div class="setrow"><label for="tc_barra">Largo de la barra<span class="hint">En mm. Normalmente 6000</span></label><input id="tc_barra" data-tcfg="barra" inputmode="numeric" value="${T.barra}"></div>
      <div class="setrow"><label for="tc_disco">Ancho del disco<span class="hint">Lo que se come cada corte (ej: 1,6 o 3 mm)</span></label><input id="tc_disco" data-tcfg="disco" inputmode="decimal" value="${String(T.disco).replace(".",",")}"></div>
      <div class="setrow"><label for="tc_min">Sobrante que se guarda<span class="hint">Desde cuántos mm vale la pena guardarlo</span></label><input id="tc_min" data-tcfg="minSob" inputmode="numeric" value="${T.minSob}"></div>
    </div>
  </details>`;
}

function rerenderTaller(focusId){
  const id=focusId||(document.activeElement&&document.activeElement.id);
  const pos=window.scrollY;
  renderTaller();
  window.scrollTo(0,pos);
  if(id){ const el=document.getElementById(id); if(el&&(el.tagName==="INPUT"||focusId)) el.focus(); }
}

function tMergeCuts(){
  const merged=[];
  T.cuts.forEach(c=>{
    const ex=merged.find(x=>x.perfil===c.perfil&&x.parte===c.parte&&x.ang===c.ang&&x.len===c.len);
    if(ex) ex.qty=Math.min(500,ex.qty+c.qty); else merged.push(c);
  });
  T.cuts=merged;
}

function tAddCuts(){
  const u=T.form.u||"mm";
  const list=tParse(T.form.txt,u);
  if(!list.length){ S.errs.t=`Escribí al menos una medida, por ejemplo ${u==="cm"?"120x4":"2640x2"}.`; return rerenderTaller("t_txt"); }
  const parte=(T.form.parte||"").trim().slice(0,20);
  let n=0;
  list.forEach(({len,qty})=>{
    const ex=T.cuts.find(c=>c.perfil===T.form.perfil&&c.parte===parte&&c.ang===T.form.ang&&c.len===len);
    if(ex) ex.qty+=qty; else T.cuts.push({id:tId(),perfil:T.form.perfil,parte,ang:T.form.ang,len,qty});
    n+=qty;
  });
  T.form.txt=""; S.errs.t=""; saveT();
  toast(`Agregué ${n} corte${n>1?"s":""}`);
  rerenderTaller("t_txt");
}

app.addEventListener("click",e=>{
  if(S.screen!=="taller") return;
  const b=e.target.closest("[data-tact],[data-tang],[data-tu],[data-tq],[data-tdel],[data-tpc],[data-tflip],[data-tapply],[data-tdone],[data-tsaveret],[data-tdelret],[data-tload],[data-tdelobra]"); if(!b) return;
  const d=b.dataset;
  if(d.tang){ T.form.ang=d.tang; saveT(); return rerenderTaller(); }
  if(d.tu){ T.form.u=d.tu; saveT(); return rerenderTaller(); }
  if(d.tpc!==undefined){ T.form.parte=d.tpc; saveT(); return rerenderTaller(); }
  if(d.tflip){ const c=T.cuts.find(x=>x.id===d.tflip); if(c){ c.ang=c.ang==="45"?"90":"45"; tMergeCuts(); saveT(); } return rerenderTaller(); }
  if(d.tapply){
    const from=+d.from, to=+d.to;
    T.cuts.forEach(c=>{ if(c.perfil===d.tapply&&c.len===from) c.len=to; });
    tMergeCuts();
    saveT(); toast(`Cortes cambiados a ${to} mm`); return rerenderTaller();
  }
  if(d.tdone!==undefined){
    if(T.done[d.tdone]) delete T.done[d.tdone]; else T.done[d.tdone]=true;
    saveT(); return rerenderTaller();
  }
  if(d.tsaveret){
    const len=+d.rlen;
    if(len>0){ T.retazos.push({id:tId(),perfil:d.tsaveret,len,fromWork:T.workId}); saveT(); toast(`Retazo de ${len} mm guardado para próximas obras`); }
    return rerenderTaller();
  }
  if(d.tdelret){ T.retazos=T.retazos.filter(r=>r.id!==d.tdelret); saveT(); toast("Retazo quitado"); return rerenderTaller(); }
  if(d.tload!==undefined){
    const o=T.obras[+d.tload];
    if(o){
      T.workId=tId(); T.obra=o.obra; T.cuts=JSON.parse(JSON.stringify(o.cuts));
      T.barra=o.barra||6000; T.disco=o.disco??3; T.minSob=o.minSob??300; T.done={};
      saveT(); toast("Obra cargada"); rerenderTaller();
    }
    return;
  }
  if(d.tdelobra!==undefined){
    const idx=+d.tdelobra, name=T.obras[idx]?.obra||"esta obra";
    return askConfirm("¿Borrar obra guardada?",`Se va a eliminar "${name}" de tus obras guardadas.`,"Borrar",b,()=>{
      T.obras.splice(idx,1); saveT(); toast("Obra eliminada"); rerenderTaller();
    });
  }
  if(d.tq){ const c=T.cuts.find(x=>x.id===d.tq); if(c){ c.qty=Math.max(1,Math.min(500,c.qty+(+d.d))); saveT(); } return rerenderTaller(); }
  if(d.tdel){ T.cuts=T.cuts.filter(x=>x.id!==d.tdel); saveT(); toast("Corte borrado"); return rerenderTaller(); }
  const a=d.tact;
  if(a==="add") return tAddCuts();
  if(a==="toggleret"){ T.usarRetazos=!T.usarRetazos; saveT(); return rerenderTaller(); }
  if(a==="addret"){
    const perfil=document.getElementById("t_ret_p").value;
    const len=tLen(document.getElementById("t_ret_l").value);
    if(!len||len>T.barra){ toast(`Escribí un largo válido (hasta ${T.barra} mm)`); return; }
    T.retazos.push({id:tId(),perfil,len});
    saveT(); toast(`Retazo de ${len} mm agregado`); return rerenderTaller();
  }
  if(a==="saveobra"){
    const name=(T.obra||"").trim()||("Obra "+new Date().toLocaleDateString("es-AR",{day:"numeric",month:"short"}));
    const entry={id:tId(),obra:name,date:Date.now(),barra:T.barra,disco:T.disco,minSob:T.minSob,cuts:JSON.parse(JSON.stringify(T.cuts))};
    const idx=T.obras.findIndex(x=>x.obra.toLowerCase()===name.toLowerCase());
    if(idx>=0) T.obras[idx]=entry; else T.obras.unshift(entry);
    T.obras=T.obras.slice(0,15);
    T.obra=name; saveT(); toast(`Obra "${name}" guardada`); return rerenderTaller();
  }
  if(a==="ejemplo"){
    const load=()=>{ T.workId=tId(); T.cuts=T_EJEMPLO.map(c=>({...c,id:tId()})); T.done={}; if(!T.obra) T.obra="Ejemplo del cuaderno"; saveT(); toast("Ejemplo cargado"); rerenderTaller(); };
    return T.cuts.length?askConfirm("¿Reemplazar los cortes?","Se van a borrar los cortes cargados y se carga el ejemplo del cuaderno.","Reemplazar",b,load):load();
  }
  if(a==="limpiar") return askConfirm("¿Empezar de cero?","Se borran todos los cortes cargados de esta obra.","Borrar todo",b,()=>{ T.workId=tId(); T.cuts=[]; T.obra=""; T.done={}; saveT(); toast("Listo, obra nueva"); rerenderTaller(); });
  if(a==="newperfil"){
    const n=(document.getElementById("t_np_n").value||"").trim();
    const p=num(document.getElementById("t_np_p").value)||0;
    if(!n){ S.errs.tnp="Escribí el nombre del perfil."; rerenderTaller(); const det=document.querySelector(".tnew"); if(det) det.open=true; const el=document.getElementById("t_np_n"); if(el) el.focus(); return; }
    const k="u_"+Date.now().toString(36);
    customMats[k]={n,u:"barra 6 m",p,cat:"herreria",q:n+" 6 metros"}; prices[k]=p;
    LS.set("presu_custom_mats",customMats); LS.set("presu_prices",prices);
    T.form.perfil=k; S.errs.tnp=""; saveT(); toast("Perfil guardado"); return rerenderTaller();
  }
  if(a==="corralon") return copy(tCorralonText(S.tPlan,S.tPmap),"Pedido para el corralón copiado",b);
  if(a==="copiar") return copy(tPlanillaText(S.tPlan,S.tPmap),"Planilla copiada",b);
  if(a==="print"){ document.getElementById("printsheet").innerHTML=tPrintHTML(S.tPlan,S.tPmap); window.print(); return; }
  if(a==="presu"){
    const list=S.tPlan.filter(g=>S.tPmap[g.perfil]&&g.buyBars>0).map(g=>({key:g.perfil,qty:g.buyBars}));
    const totBuy=list.reduce((s,x)=>s+x.qty,0);
    const nPzas=T.cuts.reduce((s,c)=>s+c.qty,0);
    if(!list.length&&!nPzas) return;
    list.push({key:"kit_soldar",qty:totBuy>6?2:1});
    list.push({key:"disco_corte",qty:Math.max(1,Math.ceil(nPzas/25))});
    const estH=Math.max(2,Math.round((Math.max(1,totBuy)*1.1+nPzas*0.15)*2)/2);
    S.note=`Cargué ${totBuy} barra${totBuy!==1?"s":""} y consumibles básicos del Taller. Ajustá horas, pintura y herrajes.`;
    openJob("otro",{texto:T.obra||"Trabajo de herrería",horas:estH,mat:0},list,2);
    S.cliente=T.obra||"";
    renderJob();
    return;
  }
});

app.addEventListener("input",e=>{
  if(S.screen!=="taller") return;
  const el=e.target;
  if(el.id==="t_txt"){ T.form.txt=el.value; saveT(); }
  if(el.id==="t_parte"){ T.form.parte=el.value; saveT(); }
});

app.addEventListener("keydown",e=>{
  if(S.screen==="taller"&&e.key==="Enter"&&e.target.id==="t_txt"){ e.preventDefault(); T.form.txt=e.target.value; tAddCuts(); }
});

app.addEventListener("change",e=>{
  if(S.screen!=="taller") return;
  const el=e.target, d=el.dataset;
  if(el.id==="t_perfil"){ T.form.perfil=el.value; saveT(); return; }
  if(d.tobra!==undefined){ T.obra=el.value.trim().slice(0,60); saveT(); return rerenderTaller(); }
  if(d.tlen){
    const c=T.cuts.find(x=>x.id===d.tlen), v=tLen(el.value);
    if(c&&v){ c.len=v; tMergeCuts(); saveT(); } else toast("Escribí la medida en mm");
    return rerenderTaller();
  }
  if(d.tcfg){
    const v=numDec(el.value), lim={barra:[1000,12000],disco:[0,10],minSob:[0,3000]}[d.tcfg];
    if(v!==null){ T[d.tcfg]=Math.min(lim[1],Math.max(lim[0],d.tcfg==="disco"?Math.round(v*10)/10:Math.round(v))); saveT(); toast("Guardado"); }
    else toast("Escribí solo números");
    return rerenderTaller();
  }
  if(d.price!==undefined) return rerenderTaller();
});

render();
</script>
