<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8A2E21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padilla">
<meta name="description" content="Padilla · Taller y Presupuestos: app de herrería, pintura y trabajos del hogar con planos 2D, planilla de cortes y presupuestos con y sin comisión de Clickie.">
<title>Padilla · Taller y Presupuestos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111E2A'/%3E%3Crect x='7' y='7' width='50' height='50' fill='none' stroke='%23223547' stroke-width='3'/%3E%3Cpath d='M19 15h17a11.5 11.5 0 0 1 0 23H28v11h-9V15zm9 8v7h8a3.5 3.5 0 0 0 0-7h-8z' fill='%23F8FAFC'/%3E%3Crect x='31' y='43' width='16' height='6' fill='%23FF7A2E'/%3E%3C/svg%3E">
<style>
/* Mundo Antióxido: cada pantalla es la etiqueta técnica de una lata de convertidor. Rojo óxido a sangre arriba, gris convertidor de fondo, paneles blancos con regla negra, Archivo ancha para títulos y angosta para datos. */
:root{
  --bg:#E2E5E6; --surface:#EEF0F1; --card:#FFFFFF; --ink:#17191A; --muted:#545B60; --line:#CBD0D2; --line-strong:#9AA1A5;
  --accent:#8A2E21; --accent-dark:#5E1D14; --accent-soft:#F6E4E0; --accent-ink:#FFFFFF;
  --band:#8A2E21; --on-band:#FFF4F0; --on-band-mute:#F2CFC7; --conv:#4D5458;
  --wa:#15803D; --slab:#17191A; --slab-soft:#2A2F32; --on-slab:#F4F5F6;
  --good:#166534; --good-bg:#DCEFE2; --warn:#7A4E00; --warn-bg:#FBEFC9;
  --err:#B42318; --err-bg:#FDE3E0;
  --ml-dot:#EAB308;
  --shadow:0 1px 2px rgba(23,25,26,.1);
  --lift:0 1px 2px rgba(23,25,26,.08),0 4px 10px -6px rgba(23,25,26,.18);
  --tactile-ink:var(--lift);
  --tactile-accent:var(--lift);
  --z-bar:20; --z-toast:30; --z-dialog:40;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D1F; --card:#202426; --ink:#EDEFF0; --muted:#A2AAAF; --line:#33393C; --line-strong:#4A5256;
  --accent:#E0664C; --accent-dark:#A8412E; --accent-soft:rgba(224,102,76,.16); --accent-ink:#1A0906;
  --band:#7A281C; --on-band:#FFF1EC; --on-band-mute:#E9C2B9; --conv:#8C9498;
  --slab:#0B0C0D; --slab-soft:#24282A; --on-slab:#F3F4F5;
  --good:#6EE7A0; --good-bg:rgba(34,197,94,.15); --warn:#FBBF24; --warn-bg:rgba(245,158,11,.15);
  --err:#FCA5A5; --err-bg:rgba(239,68,68,.16);
  --ml-dot:#FACC15;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --lift:0 1px 2px rgba(0,0,0,.4),0 6px 14px -8px rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D1F; --card:#202426; --ink:#EDEFF0; --muted:#A2AAAF; --line:#33393C; --line-strong:#4A5256;
  --accent:#E0664C; --accent-dark:#A8412E; --accent-soft:rgba(224,102,76,.16); --accent-ink:#1A0906;
  --band:#7A281C; --on-band:#FFF1EC; --on-band-mute:#E9C2B9; --conv:#8C9498;
  --slab:#0B0C0D; --slab-soft:#24282A; --on-slab:#F3F4F5;
  --good:#6EE7A0; --good-bg:rgba(34,197,94,.15); --warn:#FBBF24; --warn-bg:rgba(245,158,11,.15);
  --err:#FCA5A5; --err-bg:rgba(239,68,68,.16);
  --ml-dot:#FACC15;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --lift:0 1px 2px rgba(0,0,0,.4),0 6px 14px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.38;font-weight:500;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
p,.banner,.top-sub{text-wrap:pretty}
::selection{background:var(--accent);color:var(--accent-ink)}
input,textarea,select{caret-color:var(--accent);accent-color:var(--accent)}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.wrap{max-width:600px;margin:0 auto;padding:12px 12px calc(102px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;letter-spacing:-0.015em}
h1{font-size:20px;font-weight:850}
h2{font-size:15.5px;font-weight:800}
h3{font-size:14px;font-weight:750}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.sec-lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.field-err{color:var(--err);font-size:12.5px;font-weight:600;margin:0}

/* Encabezado compacto */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.top-left{display:flex;align-items:center;gap:4px;min-width:0}
.top-sub{font-size:12.5px;color:var(--muted);margin-top:1px;font-weight:500}
.chipbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 11px;font-weight:750;font-size:13px;box-shadow:var(--shadow);transition:transform .1s ease-out}
.chipbtn:active{transform:translateY(1px)}
.chipbtn svg{width:15px;height:15px;color:var(--accent)}
.back{border:none;background:none;font-weight:750;font-size:15px;padding:4px 4px 4px 0;min-height:34px;display:inline-flex;gap:3px;align-items:center;color:var(--accent)}
.back svg{width:18px;height:18px}
.askpill{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:4px;border:none;background:var(--good-bg);color:var(--good);border-radius:999px;padding:5px 10px;font-weight:750;font-size:12px;text-decoration:none}
.askpill svg{width:13px;height:13px}

/* Grilla de trabajos con relieve Taller Táctil */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;list-style:none;margin:0;padding:0}
.grid > li{display:flex}
.job{width:100%;background:var(--card);border:1.5px solid var(--line-strong);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:800;font-size:14.5px;text-align:center;min-height:94px;justify-content:center;box-shadow:0 2.5px 0 var(--line-strong);transition:transform .08s ease-out,border-color .12s,box-shadow .08s}
.job svg{width:30px;height:30px;color:var(--accent)}
.job:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent);border-color:var(--accent)}
.job small{font-weight:600;font-size:11.5px;color:var(--muted);line-height:1.25}

/* Tarjetas y avisos con borde definido de taller */
.card{background:var(--card);border:1.5px solid var(--line-strong);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2.5px 0 rgba(19,33,46,.16)}
.card.tactile{border:2px solid var(--ink);box-shadow:var(--tactile-ink)}
.card.flush{padding:0;gap:0;overflow:hidden}
.card-hd{padding:10px 12px;border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-ft{padding:10px 12px;border-top:1.5px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.banner{border-radius:11px;padding:9px 11px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(138,90,0,.22)}
.banner.good{background:var(--good-bg);color:var(--good);border:1px solid rgba(21,128,61,.22)}
.banner svg{flex:none;width:17px;height:17px;margin-top:1px}

/* Caja para pegar pedido de Clickie (compacta por defecto para priorizar la grilla) */
.clickie-box{background:var(--card);border:1.5px solid var(--line-strong);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2.5px 0 var(--line-strong)}
.clickie-box.open{border:2px solid var(--ink);box-shadow:var(--tactile-ink)}
.clickie-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.clickie-toggle{flex:1;min-width:0;border:none;background:none;padding:0;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--ink);text-align:left}
.clickie-toggle .cbadge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:999px;background:var(--ink);color:var(--on-slab);flex:none}
.clickie-toggle .chev{width:15px;height:15px;color:var(--muted);flex:none;transition:transform .16s}
.clickie-box.open .clickie-toggle .chev{transform:rotate(180deg)}
.clickie-paste{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--ink);transition:transform .08s;flex:none}
.clickie-paste:active{transform:translateY(1.5px);box-shadow:0 0.5px 0 var(--ink)}
.clickie-paste svg{width:14px;height:14px;color:var(--accent)}
.clickie-box textarea{min-height:62px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:8px 10px;font-size:13.5px;font-weight:500;line-height:1.35}
.clickie-acts{display:flex;gap:6px;align-items:center}

/* Switch nativo compacto */
.swrow{width:100%;border:1.5px solid var(--line-strong);background:var(--card);border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;box-shadow:var(--shadow)}
.swrow.inline{border:none;border-radius:0;padding:8px 0;box-shadow:none;background:transparent;border-top:1px solid var(--line)}
.swrow.inline:first-child{border-top:none;padding-top:2px}
.swrow .swlbl{font-size:13.5px;font-weight:700;color:var(--ink)}
.swrow .swsub{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.sw{width:38px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .15s}
.swrow[aria-pressed="true"] .sw{background:var(--accent)}
.swrow[aria-pressed="true"] .sw::after{transform:translateX(16px)}

/* Campos y steppers Opción 1 (Pulgar derecho: visor a la izquierda, − y + agrupados a la derecha con relieve táctil) */
.field{display:flex;flex-direction:column;gap:5px}
.field > label, .flabel{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr;gap:9px}
@media (min-width:460px){ .fgrid{grid-template-columns:1fr 1fr;gap:10px;align-items:end} }
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stepper .val{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-width:0;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:6px 10px;height:40px}
.stepper input{width:100%;border:none;background:none;text-align:left;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stepper .unit{font-weight:750;color:var(--muted);font-size:12.5px;flex:none}
.stepper-btns{display:flex;gap:5px;flex:none}
.stepper button{width:40px;height:38px;border-radius:9px;font-size:20px;font-weight:900;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:transform .08s ease-out,box-shadow .08s}
.stepper button.st-minus{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);box-shadow:0 2.5px 0 var(--ink)}
.stepper button.st-plus{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent-dark);box-shadow:0 2.5px 0 var(--accent-dark)}
.stepper button:active{transform:translateY(2px);box-shadow:0 0.5px 0 var(--ink)}
.stepper.sm .val{height:34px;padding:4px 8px}
.stepper.sm input{font-size:15px}
.stepper.sm button{width:34px;height:32px;font-size:17px}

.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface);padding:3px;border-radius:10px;border:1.5px solid var(--line-strong)}
.opts.g3 .opt{border:none;background:transparent;min-height:32px;padding:6px 4px;font-size:12.5px;border-radius:7px;color:var(--muted);font-weight:750}
.opts.g3 .opt[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.opts.g2{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surface);padding:3px;border-radius:10px;border:1.5px solid var(--line-strong)}
.opts.g2 .opt{border:none;background:transparent;min-height:32px;padding:6px 6px;font-size:12.5px;border-radius:7px;color:var(--muted);font-weight:750}
.opts.g2 .opt[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.opt{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:750;font-size:13px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:transform .08s ease-out}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-dark);color:var(--accent-ink)}
.opt.sm{min-height:30px;padding:5px 9px;font-size:12.5px;border-radius:8px}

/* Chips de medidas rápidas estilo Taller Táctil */
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:800;color:var(--ink);min-height:32px;box-shadow:0 2px 0 var(--line-strong);transition:transform .08s ease-out}
.preset:active{transform:translateY(1.5px);box-shadow:0 0.5px 0 var(--line-strong)}
.preset[aria-pressed="true"]{border-color:var(--accent-dark);background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 var(--accent-dark)}

textarea,input.txt,select.txt{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:8px 10px;font-size:14px;font-weight:600}
textarea{min-height:76px;resize:vertical}

/* Dibujo técnico desplegable */
.draw-det{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.draw-det > summary{list-style:none;cursor:pointer;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.draw-det > summary::-webkit-details-marker{display:none}
.draw-det > summary b{color:var(--ink)}
.draw-det > summary .chev{width:16px;height:16px;transition:transform .18s}
.draw-det[open] > summary .chev{transform:rotate(180deg)}
.drawing{background:var(--card);border-top:1px solid var(--line);padding:8px;display:flex;justify-content:center}
.drawing svg{width:100%;max-width:340px;height:auto}

/* Multi-abertura (lista compacta en Paso 1) */
.alist{list-style:none;margin:0;padding:0}
.aitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.aitem:first-child{border-top:none}
.aitem-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.aitem-t{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem-s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem-acts{display:flex;align-items:center;gap:4px;flex:none}
.aedit-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 8px;font-size:11.5px;font-weight:700}
.aedit-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.aedit-hd .albl{font-size:12px;font-weight:700;color:var(--accent)}
.aedit-hd .adrop{border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:2px 4px}

/* Tarjeta Total + Comparativa Con/Sin Comisión */
.total-card{background:var(--slab);color:var(--on-slab);border:none;gap:10px;padding:13px}
.total-card .big{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.total-card .muted{color:inherit;opacity:.75}
.com-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.com-box{border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--on-slab);border-radius:11px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .1s ease-out}
.com-box:active{transform:scale(.98)}
.com-box[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,122,46,.16)}
.com-box .tag{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.88;display:flex;align-items:center;justify-content:space-between;gap:4px}
.com-box .val{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.com-box .sub{font-size:11.5px;opacity:.78;font-weight:500}
.com-box .dot{width:7px;height:7px;border-radius:999px;background:var(--accent);display:none;flex:none}
.com-box[aria-pressed="true"] .dot{display:inline-block}

.pocket{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--good-bg);color:var(--good);border-radius:10px;padding:9px 11px;font-weight:700;font-size:13.5px}
.pocket .v{white-space:nowrap;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.pocket small{display:block;font-size:11.5px;font-weight:600;opacity:.9}

.desglose{display:grid;grid-template-columns:1fr auto;gap:3px 10px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;font-size:12.5px}
.desglose .dl{opacity:.82;font-weight:500}
.desglose .dv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kg{font-size:12.5px;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-weight:600;line-height:1.35}

/* Filas compactas de materiales (Opción 1) y horas */
.rows{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:none;padding-top:2px}
.row .name{font-weight:600;font-size:13.5px;line-height:1.25}
.row .amt{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .sub{font-size:12px;color:var(--muted);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row.zero{opacity:.48}

/* Fila compacta desplegable de material en Cotizador */
.mrow{border-top:1px solid var(--line);transition:background .12s}
.mrow:first-child{border-top:none}
.mrow.open{background:var(--accent-soft)}
.mrow.zero{opacity:.48}
.mrow-main{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px}
.mrow-info{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.mrow-name{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow-meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refdot{display:inline-block;width:6px;height:6px;border-radius:999px;background:var(--warn);flex:none}
.mrow-right{display:flex;align-items:center;gap:8px;flex:none}
.mrow-amt{border:none;background:none;padding:2px 0;min-width:64px;text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.mdrawer{padding:0 12px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mdrawer-in{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}

/* Stepper pill táctil unificado */
.mini{display:inline-flex;align-items:center;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:9px;padding:2px;gap:2px}
.mini button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:800;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1.5px 0 var(--line-strong);transition:transform .08s ease-out,box-shadow .08s}
.mini button:active{transform:translateY(1px);box-shadow:none}
.mini button.del{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none;width:24px}
.mini .qval{min-width:26px;padding:0 3px;text-align:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;font-family:var(--mono)}

.pricein{width:88px;height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);padding:3px 7px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right}
.pricein.example{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}

.mlbtn{display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;text-decoration:none;height:30px;white-space:nowrap}
.mlbtn .mldot{width:7px;height:7px;border-radius:999px;background:var(--ml-dot);flex:none}
.mlbtn svg{width:12px;height:12px;color:var(--muted)}
.sum{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums;padding-top:8px;border-top:1px solid var(--line-strong);font-size:14.5px}

/* Botones principales con relieve Taller Táctil */
.actions{display:grid;gap:8px}
.btn{border:1.5px solid transparent;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px;transition:transform .08s ease-out,box-shadow .08s}
.btn:active{transform:translateY(2px)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark);box-shadow:0 2.5px 0 var(--accent-dark)}
.btn.primary:active{box-shadow:0 0.5px 0 var(--accent-dark)}
.btn.wa{background:var(--wa);color:#fff;border-color:#0F5829;box-shadow:0 2.5px 0 #0F5829}
.btn.wa:active{box-shadow:0 0.5px 0 #0F5829}
.btn.ghost{background:var(--card);border:1.5px solid var(--line-strong);color:var(--ink);box-shadow:0 2px 0 var(--line-strong)}
.btn.ghost:active{box-shadow:0 0.5px 0 var(--line-strong)}
.btn.danger{background:var(--err);color:#fff}
.btn.copied{background:var(--good);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.two .btn{font-size:13px;padding:8px 8px;min-height:38px}

/* Barra segmentada delgada de pasos / sub-solapas */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:11px;padding:3px}
.steps.g2{grid-template-columns:repeat(2,1fr)}
.stepbtn{border:none;background:transparent;color:var(--muted);border-radius:8px;padding:6px 4px;font-size:12.5px;font-weight:800;min-height:32px;display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .08s ease-out}
.stepbtn:active{transform:scale(.97)}
.stepbtn[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepbtn .snum{font-weight:900;opacity:.75}
.stepbtn[aria-selected="true"] .snum{color:var(--accent);opacity:1}
.stepbtn .sdot{width:6px;height:6px;border-radius:999px;background:var(--warn);flex:none}

.msg{white-space:pre-wrap;background:var(--surface);border-radius:11px;padding:11px;font-size:13.5px;border:1.5px dashed var(--line-strong);line-height:1.42}

/* Barra inferior fija estilo Botonera Taller (Opción 1) */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--slab);color:var(--on-slab);border-top:2px solid var(--ink);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:var(--z-bar);box-shadow:0 -4px 12px rgba(15,23,42,.18)}
.bar .in{max-width:600px;width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .t{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--on-slab)}
.bar .bol{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;color:#5BD69A;margin-top:2px}
.bar .modepill{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--on-slab);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;margin-bottom:2px}
.bar .modepill.clk{background:rgba(255,122,46,.22);border-color:rgba(255,122,46,.45);color:#FFB085}
.bar .modepill.dir{background:rgba(91,214,154,.2);border-color:rgba(91,214,154,.4);color:#5BD69A}
.bar .btn{min-height:42px;padding:8px 15px;font-size:13.5px}
.bar .acts{display:flex;gap:6px}
.bar .iconbtn{width:42px;min-height:42px;border-radius:10px;border:1.5px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:var(--on-slab);display:flex;align-items:center;justify-content:center}
.bar .iconbtn svg{width:18px;height:18px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line-strong);padding:4px 8px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:var(--z-bar);box-shadow:0 -2px 8px rgba(15,23,42,.08)}
.nav .in{max-width:600px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.navbtn{border:none;background:none;border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);min-height:46px;justify-content:center}
.navbtn svg{width:20px;height:20px}
.navbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Carrito flotante en Repuestos */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(62px + env(safe-area-inset-bottom));max-width:576px;margin:0 auto;background:var(--slab);color:var(--on-slab);border-radius:13px;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:var(--z-bar);box-shadow:0 6px 18px rgba(15,23,42,.22)}
.cartbar .ct{font-size:12.5px;font-weight:600;line-height:1.2}
.cartbar .ct b{display:block;font-size:15.5px;font-variant-numeric:tabular-nums}
.cartbar .cacts{display:flex;gap:6px;align-items:center}
.cartbar .clrbtn{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-slab);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.cartbar .clrbtn svg{width:15px;height:15px}

/* Catálogo de repuestos compacto */
.searchbox{position:relative;display:flex;align-items:center}
.searchbox input{width:100%;border:1px solid var(--line-strong);border-radius:11px;background:var(--card);padding:9px 36px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.searchbox .sico{position:absolute;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.searchbox .clr{position:absolute;right:4px;width:30px;height:30px;border:none;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;min-height:30px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

.rep-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.rep-card.in-cart{border-color:var(--accent);background:var(--accent-soft)}
.rep-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rep-name{font-weight:700;font-size:13.5px;line-height:1.25}
.rep-meta{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag-own{color:var(--good);font-size:11px;font-weight:700}
.tag-ex{color:var(--warn);font-size:11px;font-weight:700}
.rep-bot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rep-bot .left{display:flex;align-items:center;gap:4px}
.rep-bot .right{display:flex;align-items:center;gap:5px}
.addqbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;height:30px;display:inline-flex;align-items:center;gap:3px}
.addqbtn svg{width:13px;height:13px}

/* Panel agregar repuesto en trabajo */
.picker{background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:8px}
.picklist{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.pickitem{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;text-align:left;width:100%}
.pickitem b{font-size:13px;display:block}
.pickitem small{font-size:11.5px;color:var(--muted)}
.pickitem .p{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}

/* Obra */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:78px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 9px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:20px;height:20px;color:var(--accent)}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab .cnt{position:absolute;top:4px;right:5px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 5px;line-height:1.4}
.ref{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-top:1px solid var(--line)}
.ref:first-child{border-top:none;padding-top:0}
.ref.on{background:var(--surface);border-radius:11px;padding:10px;border-top-color:transparent;border:1px solid var(--accent)}
.ref .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ref .range{font-size:12px;color:var(--muted)}
.ref .range a{color:var(--muted)}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lvl .opt{padding:5px 3px;min-height:36px;font-size:12px;text-align:center;flex-direction:column;gap:0;line-height:1.15}
.lvl .opt small{font-weight:600;font-size:11px;opacity:.85}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.duo .box{border-radius:10px;padding:9px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:1px}
.duo .box .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.duo .box .l{font-size:11.5px;opacity:.8;font-weight:600}
.duo .box .p{font-size:11.5px;color:var(--good-bg);font-weight:600}
.srcs{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.srcs a{color:var(--muted);padding:4px 0;display:block}

/* Listas, favoritos, historial, detalles */
.list{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;box-shadow:var(--shadow)}
.item .t1{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:12px;color:var(--muted);font-weight:500}
.item .t3{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2;text-align:right;white-space:nowrap}
.item.cont{border-color:var(--accent)}
.hist{display:grid;grid-template-columns:1fr auto auto;gap:5px;align-items:stretch}
.draft{display:grid;grid-template-columns:1fr auto;gap:5px}
.draft .x{width:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center}
.draft .x svg{width:15px;height:15px}
.mk{align-self:center;height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:36px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mk svg{width:16px;height:16px}
.mk[aria-pressed="true"].ok{background:var(--good);border-color:var(--good);color:#fff}
.mk[aria-pressed="true"].no{background:var(--muted);border-color:var(--muted);color:var(--card)}
.pill-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:1px}
.pill-badge.clk{background:var(--accent-soft);color:var(--accent)}
.pill-badge.dir{background:var(--good-bg);color:var(--good)}

.setrow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:none;padding-top:2px}
.setrow label{font-size:13.5px;font-weight:600}
.setrow input{width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 8px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.setrow .hint{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.setrow.full{grid-template-columns:1fr;gap:5px}
.setrow.full input{text-align:left}

details.card{gap:0}
details.card > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;min-height:30px}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary h2{font-size:14.5px}
details.card > summary .sumv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
details.card > summary .chev{width:16px;height:16px;transition:transform .18s ease-out;color:var(--muted)}
details.card[open] > summary .chev{transform:rotate(180deg)}
details.card[open] > summary{margin-bottom:10px}
details.card > .inner{display:flex;flex-direction:column;gap:9px}

.ov{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:none;background:none;padding:2px 0;text-align:left}
.o1{background:var(--surface);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600;font-size:13px}
.o1 button{border:none;background:none;color:var(--accent);font-weight:700}
.ico{width:15px;height:15px;flex:none;vertical-align:-2px}

/* Diálogo nativo */
dialog.dlg{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:16px;max-width:360px;width:calc(100% - 32px);box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:var(--z-dialog)}
dialog.dlg::backdrop{background:rgba(15,23,42,.5)}
dialog.dlg h2{font-size:17px;margin-bottom:6px}
dialog.dlg p{margin:0 0 14px;font-size:13.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));max-width:calc(100% - 28px);text-align:center;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;z-index:var(--z-toast);opacity:0;transition:opacity .16s ease-out;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.toast.on{opacity:1}

/* Taller: cortes de barras + modelo visual 2D */
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 6px;margin:0 -6px;border-top:1px solid var(--line);border-radius:9px;transition:background .12s}
.trow:first-child{border-top:none;padding-top:4px}
.trow.hl{background:var(--accent-soft);outline:1.5px solid var(--accent);outline-offset:-1.5px}
.trow-l{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 170px;flex-wrap:wrap}
.trow-r{display:flex;align-items:center;gap:5px;flex:none;margin-left:auto}
.tangbtn{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:2px 7px;font-size:11.5px;font-weight:800;font-family:var(--mono);color:var(--muted);height:28px;flex:none;box-shadow:0 1.5px 0 var(--line-strong);transition:transform .08s}
.tangbtn:active{transform:translateY(1px);box-shadow:none}
.tangbtn.on{border-color:var(--accent-dark);background:var(--accent-soft);color:var(--accent);box-shadow:0 1.5px 0 var(--accent-dark)}
.tparte{font-size:11.5px;font-weight:800;font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:128px}
.tlenw{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.tlen{width:70px;height:30px;font-size:13.5px;padding:2px 6px;font-family:var(--mono)}
.tdel{width:30px;height:30px;border-radius:7px;background:transparent;color:var(--muted);border:none;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tdel svg{width:14px;height:14px}
.tgh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding-top:4px}
.tgh h3{font-size:13.5px}
.tnew > summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px;min-height:28px;display:flex;align-items:center;gap:4px}
.tnew .two{margin-top:6px}
.taddrow{display:flex;gap:6px;align-items:stretch}
.taddrow input{flex:1}
.taddrow .btn{min-height:38px;padding:0 14px;flex:none}
.bargrp{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px dashed var(--line)}
.bargrp.has-hl{background:var(--accent-soft);margin:0 -8px;padding:9px 8px;border-radius:10px;border-top-color:transparent}
.bargrp .bh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.bargrp .bh .x{color:var(--accent)}
.bargrp .bc{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--mono);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.barsvg{width:100%;height:auto;display:block}
.barsvg .bseg{cursor:pointer;transition:opacity .12s}
.barsvg .bseg.dim{opacity:.28}
.barsvg .bseg.hl .bp{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.barsvg .bseg.hl .bt{fill:var(--accent-ink)}
.barsvg .bp{fill:var(--accent)} .barsvg .bp.alt{fill:var(--ink)}
.barsvg .bt{fill:var(--accent-ink);font:700 12.5px var(--mono)} .barsvg .bt.alt{fill:var(--card)}
.barsvg .bt.sm{font-size:10.5px}
.barsvg .bs{fill:var(--good-bg);stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3}
.barsvg .bw{fill:var(--line)}

function mlUrl(query){
  const slug = String(query||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return "https://listado.mercadolibre.com.ar/" + encodeURIComponent(slug || "ferreteria");
}

function getAllCatalog(customMats){
  const all = {...CATALOG};
  if(customMats){
    for(const [k,v] of Object.entries(customMats)){
      all[k] = {cat: v.cat || "propios", n: v.n, u: v.u || "u", p: v.p || 0, q: v.q || v.n, customDef: true};
    }
  }
  return all;
}

const REJA_MATS = [
  ["cano_2020","Caño 20×20"],
  ["hierro_12","Redondo 12 mm"],
  ["redondo_916","Redondo 9/16\""],
  ["chapa_18","Chapa ciega"],
  ["metal_desp","Metal desplegado"]
];
function rejaCuts(i, tagPrefix){
  const n=i.cant||1, A=Math.round(i.ancho*10), B=Math.round(i.alto*10);
  const ventana=i.uso==="ventana", porton=i.uso==="porton", doble=porton&&i.apertura==="doble", corredizo=porton&&i.apertura==="corredizo";
  const mat=i.material||"cano_2020", esHoja=mat==="chapa_18"||mat==="metal_desp";
  const marcoKey=ventana?(esHoja?"cano_3030":"cano_2020"):"cano_4040";
  const ang=ventana&&!esHoja?"90":"45";
  const cuts=[];
  const parte=tagPrefix || ({ventana:"REJA",puerta:"PTA",porton:"PORTON"}[i.uso]||"REJA");
  const pMar=tagPrefix?parte+" mar":parte+" marco";
  const pRef=tagPrefix?parte+" ref":parte+" refuerzo";
  const pBar=tagPrefix?parte+" bar":parte+" barrote";
  const pTrv=tagPrefix?parte+" trav":parte+" travesaño";
  const pRie=tagPrefix?parte+" riel":parte+" riel";
  if(doble){
    const hA=Math.round(A/2);
    cuts.push({perfil:marcoKey,parte:pMar,ang,len:hA,qty:4*n});
    cuts.push({perfil:marcoKey,parte:pMar,ang,len:B,qty:4*n});
  } else {
    cuts.push({perfil:marcoKey,parte:pMar,ang,len:A,qty:2*n});
    cuts.push({perfil:marcoKey,parte:pMar,ang,len:B,qty:2*n});
  }
  if(esHoja){
    const tv=ventana?1:2;
    cuts.push({perfil:"cano_2020",parte:pRef,ang:"90",len:Math.max(100,A-80),qty:tv*n});
    cuts.push({perfil:"cano_2020",parte:pRef,ang:"90",len:Math.max(100,B-80),qty:(doble?2:1)*n});
  } else {
    const barrotes=Math.max(0,C(i.ancho/(i.sep||12))-1);
    const lBar=Math.max(100,B-(ventana?40:80));
    if(barrotes>0) cuts.push({perfil:mat,parte:pBar,ang:"90",len:lBar,qty:barrotes*n});
    const tv=ventana?2:3;
    cuts.push({perfil:"planchuela",parte:pTrv,ang:"90",len:A,qty:tv*n});
  }
  if(corredizo) cuts.push({perfil:"riel_porton",parte:pRie,ang:"90",len:Math.min(6000,A*2),qty:n});
  return cuts;
}
function rejaCutsAll(list){
  const arr=Array.isArray(list)&&list.length?list:[];
  if(arr.length<=1) return arr.length?rejaCuts(arr[0]):[];
  const out=[];
  arr.forEach((i,idx)=>{
    const pfx=({ventana:"V",puerta:"PTA",porton:"POR"})[i.uso]||"R";
    const tag=`${pfx}${idx+1} ${i.ancho}×${i.alto}`;
    out.push(...rejaCuts(i, tag));
  });
  return out;
}

    if(i.zona==="rejas"){
      const litros = Math.max(1, C(m2*i.manos/6));
      if(i.estado!=="bueno") items.push(it("antioxido", Math.max(1, C(m2/8))));
      items.push(it("esmalte", litros, `${R1(m2)} m²`), it("aguarras", 1), it("kit_pintura", 1));
      tasks.push(task("Lijado y limpieza de óxido", m2*({bueno:0.15,regular:0.35,malo:0.55}[i.estado])),
                 task("Pintura de rejas/hierro", m2*0.25*i.manos));
      return {items,tasks,warns,secado:true,desc:`Pintura de rejas/hierro (${R1(m2)} m², ${i.manos} mano${i.manos>1?"s":""})`,
        incluye:["Lijado y limpieza",...(i.estado!=="bueno"?["Antióxido"]:[]),`Esmalte sintético (${i.manos} manos)`],
        excluye:["Arreglos de soldadura"]};
    }
    const litros = m2 * i.manos / (i.zona==="exterior"?8:10) * 1.1;
    const baldes20 = Math.floor(litros / 18);
    const restoL = Math.max(0, litros - baldes20*20);
    const latas4 = baldes20===0 ? Math.max(1, C(restoL/4)) : (restoL>0.5 ? C(restoL/4) : 0);
    if(baldes20>0) items.push(it(i.zona==="exterior"?"latex_ext_20":"latex_20", baldes20, `${R1(m2)} m²`));
    if(latas4>0) items.push(it(i.zona==="exterior"?"latex_ext":"latex", latas4, baldes20?"complemento":`${R1(m2)} m²`));
    if(i.estado!=="bueno"){
      items.push(it("fijador", Math.max(1, C(m2/12))), it("enduido", Math.max(1, C(m2/(i.estado==="malo"?8:15)))));
    }
    items.push(it("kit_pintura",1));
    const extK = i.zona==="exterior"?1.2:1;
    tasks.push(task("Preparación de la pared", m2*({bueno:0.03,regular:0.1,malo:0.18}[i.estado])*extK),
               task("Pintura", 0.07*m2*i.manos*extK), task("Cubrir, proteger y limpiar",1));
    if(i.estado==="malo") warns.push("Con humedad: si no se arregla la causa (caño o techo), la pared se vuelve a manchar.");
    if(i.zona==="exterior") warns.push("Exterior: fijate si necesitás escalera alta o andamio.");
    const tipoTxt = i.zona==="exterior"?"exterior":"interior";
    return {items,tasks,warns,secado:true,desc:`Pintura ${tipoTxt} de ${R1(m2)} m² (${i.manos} mano${i.manos>1?"s":""})`,
      incluye:[i.zona==="exterior"?"Látex exterior":"Látex interior",...(i.estado!=="bueno"?["Enduido y fijador"]:[]),`${i.manos} mano(s) de pintura`,"Protección de pisos y limpieza"],
      excluye:["Aberturas, rejas y zócalos","Arreglo de la causa de la humedad"]};
   }},
 { id:"mosquitero", name:"Mosquitero", hint:"ventana o puerta", icon:"mosq", drawing:"mosq",

      short:`${n>1?n+"× ":""}${i.ancho}×${i.alto} cm`,
      sub:tipo[0].toUpperCase()+tipo.slice(1),

    };
   },
   presets:[
     {label:"Ventana 120×100", vals:{ancho:120,alto:100,cant:1}},
     {label:"Ventana 150×110", vals:{ancho:150,alto:110,cant:1}},
     {label:"Puerta balcón 80×200", vals:{ancho:80,alto:200,cant:1,tipo:"corredizo"}}
   ],
   fields:[

    {id:"tipo",label:"Tipo",type:"choice",def:"fijo",options:[["fijo","Fijo"],["corredizo","Corredizo"],["enrollable","Enrollable"]]}
   ],
   calcMulti(list){
    const items=[], tasks=[], warnSet=new Set();
    let perM=0, telaM2=0, esq=0, rued=0, enr=0, hArm=0, hCol=0, totUnits=0;
    list.forEach(i=>{
      const n=i.cant||1; totUnits+=n;
      if(i.tipo==="enrollable"){
        enr+=n; hCol+=0.75*n;
      } else {
        const per=2*(i.ancho+i.alto)/100;
        perM+=per*n;
        telaM2+=i.ancho*i.alto/10000*1.15*n;
        esq+=4*n;
        if(i.tipo==="corredizo") rued+=2*n;
        hArm+=(i.tipo==="corredizo"?1:0.75)*n;
        hCol+=0.5*n;
        if(i.ancho>150||i.alto>200) warnSet.add("Es grande: conviene un travesaño en el medio para que la tela no se afloje.");
      }
    });
    if(perM>0) items.push(it("perfil_mosq",C(perM*1.1/6)));
    if(telaM2>0) items.push(it("tela_mosq",R1(telaM2)));
    if(esq>0) items.push(it("esquinero",esq));
    if(perM>0) items.push(it("burlete",C(perM*1.1)));
    if(rued>0) items.push(it("ruedita",rued));
    if(enr>0) items.push(it("kit_enrollable",enr), it("tarugos",C(enr/2)));
    if(hArm>0) tasks.push(task("Armado a medida",hArm));
    if(hCol>0) tasks.push(task("Colocación",hCol));

      desc:single?this.itemLabel(list[0]).full:`Mosquiteros a medida (${totUnits} unidades)`,
      itemsList:single?null:list.map(x=>this.itemLabel(x).full),
      incluye:["Mosquitero armado a medida","Tela de fibra de vidrio","Colocación"],
      excluye:["Arreglo del marco de la ventana"]};

const MERCADO_REJA={lo:114000,hi:223000,src:"Servidos",f:"nov 2026",url:"https://servidos.ar/servicios/herreria/buenos-aires"};
function refMercado(job,inputs,total,extraItems){
  if(!job||job.id!=="reja") return null;
  const list=extraItems&&extraItems.length?[...extraItems,inputs]:[inputs];
  if(list.some(x=>x.uso!=="ventana")) return null;
  const m2=list.reduce((a,x)=>a+x.ancho*x.alto/10000*(x.cant||1),0);
  if(!(m2>0)) return null;
  const lo=Math.round(MERCADO_REJA.lo*m2/1000)*1000, hi=Math.round(MERCADO_REJA.hi*m2/1000)*1000;
  return {lo,hi,m2,estado:total<lo?"bajo":total>hi?"alto":"ok"};
}
const NIVEL={bajo:["Barato",0],medio:["Medio",0.5],alto:["Caro",1]};
function refPrice(it,lvl){ return Math.round(it.lo+(it.hi-it.lo)*NIVEL[lvl][1]); }

function computeObra(lines,cfg,prices,opts,customMats){
  const cat = getAllCatalog(customMats);
  const rows=[], need={};
  for(const it of REF){
    const L=lines[it.id]; if(!L||!L.qty) continue;
    const pu=refPrice(it,L.lvl), mo=pu*L.qty;
    rows.push({it,qty:L.qty,lvl:L.lvl,pu,mo});
    it.mat.forEach(([m,c])=>need[m]=(need[m]||0)+c*L.qty);
  }
  const mats=Object.entries(need).map(([k,q])=>{
    const c=cat[k]||CATALOG[k], qty=Math.ceil(q-1e-9), price=prices[k]??c.p;
    return {key:k,name:c.n,unit:c.u,q:c.q||c.n,qty,price,cost:qty*price,example:!(k in prices)&&!c.customDef};
  });
  const mo=rows.reduce((a,r)=>a+r.mo,0), matCost=mats.reduce((a,m)=>a+m.cost,0);
  const viaje=rows.length?(opts.viaje??cfg.viaje):0;
  const paso=cfg.redondeo||1, ivaF=cfg.iva?1.21:1;
  const comPct = Math.min(60, Math.max(0, Number(cfg.comision)||0));
  const minT=Math.ceil(cfg.minimo/paso)*paso;

  function calcObraMode(usarCom, absorber){
    const effCom = usarCom ? comPct : 0;
    const comF = (usarCom && !absorber) ? 1/(1 - effCom/100) : 1;
    const up = x => Math.ceil(x * comF * ivaF / paso) * paso;
    const minAplicado = rows.length > 0 && up(mo + viaje) < minT;
    const sinMat = rows.length ? Math.max(minT, up(mo + viaje)) : 0;
    const conMat = rows.length ? Math.max(minT, up(mo + viaje + matCost*(1 + cfg.recargo/100))) : 0;
    const pocket = t => { const s = t/ivaF; return s - s*effCom/100; };
    const comSin = (sinMat/ivaF)*effCom/100;
    const comCon = (conMat/ivaF)*effCom/100;
    return {sinMat, conMat, minAplicado, comSin, comCon,
      bolsilloSin: pocket(sinMat), bolsilloCon: pocket(conMat) - matCost};
  }

  const usarCom = opts.usarComision !== false;
  const absorber = !!opts.absorberCom;
  const conCom = calcObraMode(true, absorber);
  const sinCom = calcObraMode(false, false);
  const act = usarCom ? conCom : sinCom;
  return {rows,mats,mo,matCost,viaje,usarCom,absorber,conCom,sinCom,...act};
}

/* Cálculo principal de un trabajo: devuelve SIEMPRE ambos modos (conCom y sinCom) y el activo en el nivel raíz. */
function compute(job, inputs, cfg, prices, hoursOv, opts, extraMats, qtyOv, customMats, extraItems){
  const cat = getAllCatalog(customMats);
  const r = (job.calcMulti && extraItems && extraItems.length) ? job.calcMulti([...extraItems, inputs]) : job.calc(inputs);
  const qOv = qtyOv || {};

  const mats = r.items.filter(x=>x.qty>0).map((x, idx)=>{
    if(x.custom) return {id:"custom_"+idx,key:null,name:x.name,unit:x.unit,q:x.name,qty:x.qty,autoQty:x.qty,price:x.price,cost:x.qty*x.price,example:false};
    const c = cat[x.mat] || CATALOG[x.mat];
    const price = prices[x.mat] ?? c.p;
    const qty = qOv[x.mat] !== undefined ? qOv[x.mat] : x.qty;
    return {id:"mat_"+x.mat,key:x.mat,name:c.n,unit:c.u,q:c.q||c.n,qty,autoQty:x.qty,nota:x.nota,price,cost:qty*price,example:!(x.mat in prices)&&!c.customDef};
  });

  /* Sumar repuestos agregados a mano por el usuario */
  (extraMats || []).forEach((em, idx)=>{
    if(em.key && cat[em.key]){
      const c = cat[em.key];
      const price = prices[em.key] ?? c.p;
      mats.push({id:"ex_"+idx,extraIdx:idx,key:em.key,name:c.n,unit:c.u,q:c.q||c.n,qty:em.qty,autoQty:em.qty,nota:"agregado",price,cost:em.qty*price,example:!(em.key in prices)&&!c.customDef});
    } else {
      mats.push({id:"ex_"+idx,extraIdx:idx,key:null,name:em.name||"Repuesto",unit:em.unit||"u",q:em.name||"repuesto",qty:em.qty,autoQty:em.qty,nota:"agregado",price:em.price||0,cost:(em.qty||0)*(em.price||0),example:false});
    }
  });

  const tasks = r.tasks.map(t=>({...t,auto:t.hours,manual:hoursOv[t.name]!==undefined,hours:hoursOv[t.name]??t.hours}));
  const horas = tasks.reduce((a,t)=>a+t.hours,0);
  const matCost = mats.reduce((a,m)=>a+m.cost,0);
  const matCobrado = opts.clienteCompra ? 0 : matCost*(1+cfg.recargo/100);
  const mo = horas*cfg.valor_hora*(opts.urgente ? 1+cfg.urgencia/100 : 1);
  const viaje = opts.viaje ?? cfg.viaje;
  const neto = (matCobrado + mo + viaje)*(1 + cfg.imprevistos/100);
  const ivaF = cfg.iva ? 1.21 : 1;
  const paso = cfg.redondeo || 1;
  const comPct = Math.min(60, Math.max(0, Number(cfg.comision)||0));

  function calcMode(useCom){
    const cPct = useCom ? comPct : 0;
    let base = neto / (1 - cPct/100);
    const bajoMinimo = base < cfg.minimo;
    let usoMinimo = false;
    if(bajoMinimo && !opts.sinMinimo){ base = cfg.minimo; usoMinimo = true; }
    const total = Math.ceil(base * ivaF / paso) * paso;
    const sinIva = total / ivaF;
    const iva = total - sinIva;
    const comision = sinIva * cPct / 100;
    const bolsillo = total - iva - comision - (opts.clienteCompra ? 0 : matCost);
    const porHora = horas ? (bolsillo - viaje) / horas : 0;
    return {total, iva, comision, comPct:cPct, bolsillo, porHora, usoMinimo, bajoMinimo};
  }

  const usarComision = opts.usarComision !== false;
  const conCom = calcMode(true);
  const sinCom = calcMode(false);
  const act = usarComision ? conCom : sinCom;

  const warns = [...r.warns];
  if(act.usoMinimo) warns.push(`Se aplicó tu mínimo de ${ars(cfg.minimo)}. Si es un trabajo chico y querés bajarlo, en Opciones podés sacar el mínimo.`);
  const dias = Math.max(1, Math.ceil(horas/7)) + (r.secado ? 1 : 0);
  if(horas && act.porHora < cfg.valor_hora * 0.98) warns.push("Por hora te queda menos de lo que querés ganar. Revisá horas o precios de repuestos.");

  let kg = r.kg || 0;
  if(!kg){
    mats.forEach(m=>{
      const c = m.key && (cat[m.key] || CATALOG[m.key]);
      if(c && m.qty > 0){
        if(c.kgm) kg += m.qty * 6 * c.kgm;
        else if(c.kgu) kg += m.qty * c.kgu;
      }
    });
  } else {
    mats.forEach(m=>{
      if(m.extraIdx === undefined || !m.key || !(m.qty > 0)) return;
      const c = cat[m.key] || CATALOG[m.key];
      if(c && c.kgm) kg += m.qty * 6 * c.kgm;
      else if(c && c.kgu) kg += m.qty * c.kgu;
    });
  }

  return {
    ...r, kg, mats, tasks, horas, matCost, matCobrado, mo, viaje, neto, dias,
    usarComision, conCom, sinCom, ...act, warns,
    matCliente: opts.clienteCompra ? 0 : Math.round(matCobrado * ivaF)
  };
}

/* ===== LECTURA INTELIGENTE DE PEDIDOS DE CLICKIE / WHATSAPP ===== */
const WORD_NUMS = {un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10};
function parseWordOrNum(tok){
  if(tok===undefined||tok===null) return null;
  const s=String(tok).toLowerCase().trim();
  if(WORD_NUMS[s]!==undefined) return WORD_NUMS[s];
  const n=parseFloat(s.replace(",","."));
  return isNaN(n)?null:n;
}
function dimToCm(rawStr, unitStr, forceUnit){
  if(!rawStr) return null;
  const s=String(rawStr).trim();
  const v=parseFloat(s.replace(",","."));
  if(!(v>0)) return null;
  const u=String(unitStr||forceUnit||"").toLowerCase();
  if(u==="mm"||u==="milimetros") return Math.round(v/10);
  if(u==="cm"||u==="centimetros"||u==="centimetro") return Math.round(v);
  if(u==="m"||u==="mt"||u==="mts"||u==="metro"||u==="metros") return Math.round(v*100);
  if(/[.,]/.test(s) && v<=15) return Math.round(v*100);
  if(v<=6) return Math.round(v*100);
  if(v>=500) return Math.round(v/10);
  return Math.round(v);
}
function pairToCm(s1, u1, s2, u2){
  const v1=parseFloat(String(s1).replace(",",".")), v2=parseFloat(String(s2).replace(",","."));
  if(!(v1>0)||!(v2>0)) return null;
  const sharedU = u1 || u2 || "";
  if(!sharedU && v1>=500 && v2>=500 && !/[.,]/.test(s1) && !/[.,]/.test(s2)){
    return [Math.round(v1/10), Math.round(v2/10)];
  }
  const hasDec = /[.,]/.test(s1) || /[.,]/.test(s2);
  const bothSmall = v1<=12 && v2<=12 && (hasDec || (v1<=6 && v2<=6));
  const effU = sharedU || (bothSmall ? "m" : "cm");
  return [dimToCm(s1, u1, effU), dimToCm(s2, u2, effU)];
}

function parseClickieOrder(rawText){
  const raw = String(rawText||"").trim();
  if(!raw) return null;
  const norm = raw.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

  /* 1. Detectar cliente / barrio si viene en formato ficha de Clickie */
  let cliente = "";
  const mCli = raw.match(/(?:cliente|nombre|solicitante|usuario)\s*[:\-]\s*([^\n,|•]{2,35})/i)
    || raw.match(/\b(?:hola[,!\s]+)?(?:soy|mi nombre es)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)/);
  const mZona = raw.match(/(?:barrio|zona|localidad|ubicaci[oó]n|direcci[oó]n)\s*[:\-]\s*([^\n,|•]{2,30})/i);
  if(mCli && mCli[1]) cliente = mCli[1].trim();
  if(mZona && mZona[1]) cliente = cliente ? `${cliente} · ${mZona[1].trim()}` : mZona[1].trim();

  /* 2. Opciones globales */
  const urgente = /\b(urgente|urgencia|hoy mismo|para hoy|lo antes posible|emergencia|fin de semana|finde|sabado|domingo)\b/.test(norm);
  const clienteCompra = /\b(tengo los materiales|materiales los compro yo|ya compre los materiales|ya tengo la pintura|solo mano de obra|sin materiales)\b/.test(norm);
  const usarComision = !/\b(particular|sin comision|fuera de clickie)\b/.test(norm);

  /* 3. Extraer todos los pares de medidas del texto con su contexto */
  const dimMatches = [];
  const dimRe = /(\d+(?:[.,]\d+)?)\s*(mm|cm|mts?|metros?)?\s*(?:de\s*ancho\s*)?(?:x|×|\*|por|y\s+de\s+alto)\s*(\d+(?:[.,]\d+)?)\s*(mm|cm|mts?|metros?)?(?:\s*de\s*alto)?/gi;
  let dm;
  while((dm = dimRe.exec(norm))){
    /* Evitar falsos positivos tipo "caño 20x20" o "30x30" o "40x40" o "1x2 m" de perfil */
    const before25 = norm.slice(Math.max(0, dm.index - 25), dm.index);
    if(/\b(cano|estructural|perfil|angulo|planchuela)\s*$/.test(before25)) continue;
    const pair = pairToCm(dm[1], dm[2], dm[3], dm[4]);
    if(!pair) continue;
    if(pair[0] <= 40 && pair[1] <= 40 && pair[0] === pair[1]) continue; /* 20x20, 30x30, 40x40 */
    const ctxStart = Math.max(0, dm.index - 55);
    const ctxEnd = Math.min(norm.length, dm.index + dm[0].length + 40);
    const rawBefore = norm.slice(ctxStart, dm.index);
    const rawAfter = norm.slice(dm.index + dm[0].length, ctxEnd);
    /* Cortar contexto en separadores de otro ítem (" y ", ",", ";", salto de línea) para no mezclar aberturas */
    const beforeParts = rawBefore.split(/(?:[,;\n]|\s+y\s+)/);
    const before = beforeParts[beforeParts.length - 1] || rawBefore;
    const after = rawAfter.split(/(?:[,;\n]|\s+y\s+|\d+\s*(?:x|×|\*|por))/)[0] || "";
    let qty = 1;
    const qm = before.match(/(?:^|[\s,;:.])(\d+|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s*(?:x\s*)?(?:rejas?|ventanas?|puertas?|porton(?:es)?|mosquiteros?|aberturas?|panos?)?(?:[^0-9,;\n]{0,28}?)$/i);
    if(qm && qm[1]){
      const qv = parseWordOrNum(qm[1]);
      if(qv >= 1 && qv <= 30) qty = Math.round(qv);
    }
    dimMatches.push({ancho:pair[0], alto:pair[1], qty, before, after, fullCtx: before + " " + dm[0] + " " + after});
  }

  /* También detectar "ancho X y alto Y" cuando no usan "x" o "por" */
  if(!dimMatches.length){
    const mAncho = norm.match(/ancho\s*(?:de\s*)?(\d+(?:[.,]\d+)?)\s*(mm|cm|mts?|metros?)?/);
    const mAlto = norm.match(/alto\s*(?:de\s*)?(\d+(?:[.,]\d+)?)\s*(mm|cm|mts?|metros?)?/);
    if(mAncho && mAlto){
      const pair = pairToCm(mAncho[1], mAncho[2], mAlto[1], mAlto[2]);
      if(pair) dimMatches.push({ancho:pair[0], alto:pair[1], qty:1, before:norm, after:"", fullCtx:norm});
    }
  }

  /* 4. Clasificar tipo de trabajo */
  const esMosquitero = /\b(mosquitero|mosquiteros|tela mosquitera|red mosquitera)\b/.test(norm);
  const esSoldadura = !esMosquitero && /\b(soldar|soldadura|desold[oó]|resoldar|punto de soldadura|bisagra rota|bisagra suelta|se solto|reja floja|reja suelta|arreglar bisagra|reparar bisagra|reparar reja|reparar porton|arreglo de reja|arreglo de porton|partio la bisagra)\b/.test(norm)
    && !/\b(hacer reja|fabricar reja|reja nueva|porton nuevo)\b/.test(norm);
  const esPintarReja = /\b(pintar|pintura|esmalte|lijar)\b/.test(norm) && /\b(rejas?|porton|barandas?)\b/.test(norm) && !/\b(fabricar|hacer|colocar|amurar|soldar|cano)\b/.test(norm);
  const esReja = !esMosquitero && !esSoldadura && !esPintarReja && /\b(reja|rejas|porton|portones|puerta reja|puerta de hierro|barrotes|cerramiento de hierro|metal desplegado|herrero|herreria)\b/.test(norm);
  const esInodoro = /\b(inodoro|deposito|mochila|boton del bano|tapa de inodoro|asiento de inodoro|flotante|pierde el inodoro|no corta el agua|no carga el deposito)\b/.test(norm);
  const esBacha = !esInodoro && /\b(canilla|griferia|monocomando|bacha|sifon|cuerito|vastago|flexible|destapar|destape|pierde agua la canilla|gotea la canilla|tapada la cocina|plomero|plomeria)\b/.test(norm);
  const esLuz = /\b(enchufe|enchufes|toma|tomas|tomacorrientes?|llaves? de luz|teclas?|interruptor(?:es)?|lamparas?|apliques?|plafon(?:es)?|luminarias?|bocas? nuevas?|bocas? de luz|termicas?|disyuntor|tablero electrico|electricista|electricidad|cortocircuito)\b/.test(norm);
  const esColgar = /\b(colgar|amurar|estantes?|repisas?|cortineros?|barral(?:es)?|televisor(?:es)?|soporte de tv|colgar tv|colgar tele|cuadros?|espejos?)\b/.test(norm);
  const esPared = /\b(revoque|revocar|agujero en la pared|tapar agujero|arreglo de pared|pared rota|picar pared|parche de cemento|albanil|albanileria)\b/.test(norm) && !/\b(pintar todo|pintar departamento|pintar casa)\b/.test(norm);
  const esPintura = !esReja && !esSoldadura && (esPintarReja || /\b(pintar|pintura|latex|enduido|cielorraso|pintor)\b/.test(norm));

  let jobId = "otro";
  if(esMosquitero) jobId = "mosquitero";
  else if(esSoldadura) jobId = "soldadura";
  else if(esReja) jobId = "reja";
  else if(esInodoro) jobId = "inodoro";
  else if(esBacha) jobId = "bacha";
  else if(esLuz) jobId = "luz";
  else if(esColgar) jobId = "colgar";
  else if(esPared) jobId = "pared";
  else if(esPintura) jobId = "pintura";

  const job = JOBS.find(j=>j.id===jobId) || JOBS[0];
  let inputs = defaults(job);
  let extraItems = [];
  let extraMats = [];
  const details = [];
  const missing = [];
  const clamp = (id, val) => {
    const f = job.fields.find(x=>x.id===id);
    if(!f) return val;
    return Math.min(f.max, Math.max(f.min, val));
  };

  if(jobId === "reja"){
    const matGlobal = /\b(metal desplegado|malla)\b/.test(norm) ? "metal_desp"
      : /\b(chapa ciega|chapa 18|chapa)\b/.test(norm) ? "chapa_18"
      : /\b(9\/16|redondo grueso|14\s*mm)\b/.test(norm) ? "redondo_916"
      : /\b(redondo 12|hierro 12|macizo|redondo|barrote macizo)\b/.test(norm) ? "hierro_12"
      : "cano_2020";
    const pintGlobal = /\b(convertidor|3 en 1|tres en uno)\b/.test(norm) ? "convertidor"
      : /\b(solo antioxido|sin esmalte|sin pintar)\b/.test(norm) ? "antioxido"
      : "pintada";
    const colocarGlobal = !/\b(sin colocar|sin colocacion|solo fabricacion|paso a retirar|no colocar)\b/.test(norm);

    const buildRejaItem = (dmObj) => {
      const bef = dmObj ? dmObj.before : norm;
      const ctx = dmObj ? dmObj.fullCtx : norm;
      const detectUso = s => /\b(porton|portones|cochera|garage)\b/.test(s) ? "porton"
        : /\b(ventana|ventanal)\b/.test(s) ? "ventana"
        : /\b(puerta|balcon)\b/.test(s) ? "puerta" : null;
      const uso = detectUso(bef) || detectUso(ctx) || (!dimMatches.length && detectUso(norm)) || "ventana";
      const apertura = /\b(corrediz[oa]s?)\b/.test(ctx) || (uso==="porton"&&/\b(corrediz[oa]s?)\b/.test(norm)) ? "corredizo"
        : /\b(2 hojas|dos hojas|doble hoja)\b/.test(ctx) || (uso==="porton"&&/\b(2 hojas|dos hojas|doble hoja)\b/.test(norm)) ? "doble"
        : "batiente";
      const defW = uso==="porton" ? 240 : uso==="puerta" ? 90 : 120;
      const defH = uso==="porton" ? 200 : uso==="puerta" ? 200 : 100;
      const ancho = clamp("ancho", dmObj ? dmObj.ancho : defW);
      const alto = clamp("alto", dmObj ? dmObj.alto : defH);
      let cant = dmObj ? dmObj.qty : 1;
      if(!dmObj){
        const qm = norm.match(/\b(\d+|dos|tres|cuatro|cinco|seis)\s*(?:rejas?|ventanas?|puertas?|portones?)\b/);
        if(qm){ const qv=parseWordOrNum(qm[1]); if(qv>=1&&qv<=20) cant=qv; }
      }
      const cerradura = uso!=="ventana" && (/\b(cerradura|llave|doble paleta)\b/.test(ctx) || !/\b(sin cerradura|solo pasador)\b/.test(norm));
      return {...defaults(job), uso, apertura, material:matGlobal, ancho, alto, cant, pintura:pintGlobal, cerradura, colocar:colocarGlobal};
    };

    if(dimMatches.length >= 2){
      const all = dimMatches.map(buildRejaItem);
      inputs = all[all.length - 1];
      extraItems = all.slice(0, all.length - 1);
      details.push(`${all.length} aberturas cargadas (${all.map(x=>`${x.cant>1?x.cant+"× ":""}${x.ancho}×${x.alto} cm`).join(" + ")})`);
    } else if(dimMatches.length === 1){
      inputs = buildRejaItem(dimMatches[0]);
      details.push(`${inputs.cant>1?inputs.cant+"× ":""}${inputs.ancho}×${inputs.alto} cm`);
    } else {
      inputs = buildRejaItem(null);
      missing.push("medidas de ancho y alto (cargué estándar)");
    }
  } else if(jobId === "mosquitero"){
    const buildMosqItem = (dmObj) => {
      const ctx = dmObj ? dmObj.fullCtx : norm;
      const tipo = /\b(enrollables?)\b/.test(ctx) || /\b(enrollables?)\b/.test(norm) ? "enrollable"
        : /\b(corrediz[oa]s?|puerta|balcon)\b/.test(ctx) || /\b(corrediz[oa]s?)\b/.test(norm) ? "corredizo"
        : "fijo";
      const ancho = clamp("ancho", dmObj ? dmObj.ancho : 120);
      const alto = clamp("alto", dmObj ? dmObj.alto : 100);
      let cant = dmObj ? dmObj.qty : 1;
      if(!dmObj){
        const qm = norm.match(/\b(\d+|dos|tres|cuatro|cinco|seis)\s*mosquiteros?\b/);
        if(qm){ const qv=parseWordOrNum(qm[1]); if(qv>=1&&qv<=30) cant=qv; }
      }
      return {...defaults(job), ancho, alto, cant, tipo};
    };
    if(dimMatches.length >= 2){
      const all = dimMatches.map(buildMosqItem);
      inputs = all[all.length - 1];
      extraItems = all.slice(0, all.length - 1);
      details.push(`${all.length} medidas de mosquitero cargadas`);
    } else if(dimMatches.length === 1){
      inputs = buildMosqItem(dimMatches[0]);
      details.push(`${inputs.cant>1?inputs.cant+"× ":""}${inputs.ancho}×${inputs.alto} cm (${inputs.tipo})`);
    } else {
      inputs = buildMosqItem(null);
      missing.push("medidas de la ventana (cargué 120×100 cm)");
    }
  } else if(jobId === "soldadura"){
    const mh = norm.match(/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)\b/);
    if(mh){
      inputs.horas = clamp("horas", parseFloat(mh[1].replace(",",".")));
    } else if(/\b(porton|pesad[oa]|varias)\b/.test(norm)){
      inputs.horas = 3;
    } else if(/\b(bisagra|punto)\b/.test(norm)){
      inputs.horas = 1.5;
    }
    inputs.pintar = !/\b(sin pintar|no pintar|sin pintura)\b/.test(norm);
    inputs.domicilio = !/\b(en taller|llevo al taller|en tu taller)\b/.test(norm);
    details.push(`${fmtQ(inputs.horas)} h estimadas`);
  } else if(jobId === "pintura"){
    inputs.zona = esPintarReja ? "rejas" : /\b(exterior|frente|fachada|medianera|terraza|patio)\b/.test(norm) ? "exterior" : "interior";
    inputs.estado = /\b(humedad|hongos|filtracion|muy mal|descascarad)\b/.test(norm) ? "malo"
      : /\b(grietas?|agujeros?|oxido|oxidada|enduido|regular)\b/.test(norm) ? "regular" : "bueno";
    inputs.manos = /\b(1 mano|una mano)\b/.test(norm) ? 1 : /\b(3 manos|tres manos)\b/.test(norm) ? 3 : 2;
    const mM2 = norm.match(/(\d+(?:[.,]\d+)?)\s*(?:m2|m²|metros?\s*cuadrados?)\b/);
    const mAmb = norm.match(/\b(\d+|un|dos|tres|cuatro)\s*ambientes?\b/);
    if(mM2){
      const area = parseFloat(mM2[1].replace(",","."));
      inputs.alto = 2.5;
      inputs.aberturas = 0;
      inputs.largo = clamp("largo", Math.max(1, Math.round((area / 2.5)*2)/2));
      details.push(`~${fmtQ(area)} m²`);
    } else if(dimMatches.length){
      const d0 = dimMatches[0];
      const wM = d0.ancho / 100, hM = d0.alto / 100;
      if(/\b(dormitorio|habitacion|pieza|cuarto|living|comedor|ambiente|cocina|bano)\b/.test(norm) && wM >= 1.5 && wM <= 12 && hM >= 1.5 && hM <= 12){
        inputs.largo = clamp("largo", Math.round((2*(wM + hM))*2)/2);
        inputs.alto = 2.6;
        if(/\b(techo|cielorraso)\b/.test(norm)) inputs.techo = Math.round(wM * hM);
        details.push(`ambiente ${fmtQ(wM)}×${fmtQ(hM)} m`);
      } else {
        inputs.largo = clamp("largo", Math.round(wM*2)/2);
        inputs.alto = clamp("alto", Math.round(hM*10)/10);
        details.push(`${fmtQ(inputs.largo)}×${fmtQ(inputs.alto)} m`);
      }
    } else if(mAmb){
      const nAmb = parseWordOrNum(mAmb[1]) || 2;
      inputs.largo = clamp("largo", nAmb * 14);
      inputs.alto = 2.6;
      if(/\b(techo|cielorraso)\b/.test(norm)) inputs.techo = nAmb * 14;
      details.push(`${nAmb} ambiente${nAmb>1?"s":""}`);
    } else {
      missing.push("medidas o m² a pintar");
    }
  } else if(jobId === "bacha"){
    const t = [];
    if(/\b(cambiar canilla|cambio de canilla|colocar canilla|poner canilla|griferia|monocomando|canilla nueva)\b/.test(norm)) t.push("canilla");
    if(/\b(pierde|perdida|gotea|gotera|cuerito|vastago|flexible|arreglar canilla)\b/.test(norm)) t.push("perdida");
    if(/\b(sifon|desague)\b/.test(norm)) t.push("sifon");
    if(/\b(destapar|destape|tapad[oa]|no corre)\b/.test(norm)) t.push("destapar");
    if(/\b(cambiar bacha|bacha nueva|bacha entera|colocar bacha)\b/.test(norm)) t.push("completa");
    inputs.tareas = t.length ? t : ["canilla"];
    inputs.cliente = !/\b(proveer|traer canilla|incluir canilla|con repuesto|comprar la canilla)\b/.test(norm);
    details.push(`${inputs.tareas.length} tarea${inputs.tareas.length>1?"s":""} detectada${inputs.tareas.length>1?"s":""}`);
  } else if(jobId === "inodoro"){
    const t = [];
    if(/\b(deposito|mochila|no carga|no corta|pierde adentro|boton|flotante|mecanismo)\b/.test(norm)) t.push("mecanismo");
    if(/\b(pierde por abajo|perdida|conexion|flexible|pierde atras|base)\b/.test(norm)) t.push("perdida");
    if(/\b(tapa|asiento)\b/.test(norm)) t.push("tapa");
    if(/\b(cambiar inodoro|inodoro nuevo|colocar inodoro|instalar inodoro)\b/.test(norm)) t.push("completo");
    inputs.tareas = t.length ? t : ["mecanismo"];
    inputs.cliente = !/\b(proveer|traer inodoro|traer tapa|incluir inodoro)\b/.test(norm);
    details.push(`${inputs.tareas.length} tarea${inputs.tareas.length>1?"s":""} detectada${inputs.tareas.length>1?"s":""}`);
  } else if(jobId === "luz"){
    inputs.tomas = 0; inputs.lamparas = 0; inputs.bocas = 0;
    const mBocas = norm.match(/(\d+|un|una|dos|tres|cuatro|cinco)\s*(?:bocas?\s*nuevas?|enchufes?\s*nuevos?|tomas?\s*nuevos?)/)
      || norm.match(/agregar\s*(\d+|un|una|dos|tres|cuatro|cinco)\s*(?:enchufes?|tomas?|bocas?)/);
    if(mBocas) inputs.bocas = clamp("bocas", parseWordOrNum(mBocas[1]) || 1);
    const mLamp = norm.match(/(\d+|un|una|dos|tres|cuatro|cinco|seis)\s*(?:lamparas?|apliques?|plafon(?:es)?|luminarias?|luces|colgantes?)/);
    if(mLamp) inputs.lamparas = clamp("lamparas", parseWordOrNum(mLamp[1]) || 1);
    else if(/\b(lamparas?|apliques?|plafon(?:es)?|luminarias?)\b/.test(norm)) inputs.lamparas = 1;
    const mTomas = norm.match(/(\d+|un|una|dos|tres|cuatro|cinco|seis|siete|ocho|diez)\s*(?:enchufes?|tomas?|tomacorrientes?|llaves?|teclas?|interruptor(?:es)?)(?!\s*nuev[oa]s?)/);
    if(mTomas) inputs.tomas = clamp("tomas", parseWordOrNum(mTomas[1]) || 1);
    else if(!inputs.bocas && !inputs.lamparas) inputs.tomas = 2;
    if(/\b(termica)\b/.test(norm)) extraMats.push({key:"termica", qty:1});
    if(/\b(disyuntor|diferencial)\b/.test(norm)) extraMats.push({key:"disyuntor", qty:1});
    details.push([inputs.tomas?`${inputs.tomas} toma(s)`:"", inputs.lamparas?`${inputs.lamparas} lámpara(s)`:"", inputs.bocas?`${inputs.bocas} boca(s) nueva(s)`:""].filter(Boolean).join(" + ") || "Electricidad");
  } else if(jobId === "colgar"){
    inputs.estantes = 0; inputs.cortineros = 0; inputs.tv = 0; inputs.cuadros = 0;
    const mEst = norm.match(/(\d+|un|una|dos|tres|cuatro|cinco|seis)\s*(?:estantes?|repisas?)/);
    if(mEst) inputs.estantes = clamp("estantes", parseWordOrNum(mEst[1]) || 1);
    else if(/\b(estantes?|repisas?)\b/.test(norm)) inputs.estantes = 1;
    const mCort = norm.match(/(\d+|un|una|dos|tres|cuatro|cinco|seis)\s*(?:cortineros?|barral(?:es)?|cortinas?)/);
    if(mCort) inputs.cortineros = clamp("cortineros", parseWordOrNum(mCort[1]) || 1);
    else if(/\b(cortineros?|barral(?:es)?|cortinas?)\b/.test(norm)) inputs.cortineros = 1;
    const mTv = norm.match(/(\d+|un|una|dos|tres)\s*(?:tv|tele|televisor(?:es)?|soporte de tv)/);
    if(mTv) inputs.tv = clamp("tv", parseWordOrNum(mTv[1]) || 1);
    else if(/\b(tv|tele|televisor|soporte)\b/.test(norm)) inputs.tv = 1;
    const mCua = norm.match(/(\d+|un|una|dos|tres|cuatro|cinco|seis)\s*(?:cuadros?|espejos?)/);
    if(mCua) inputs.cuadros = clamp("cuadros", parseWordOrNum(mCua[1]) || 1);
    else if(/\b(cuadros?|espejos?)\b/.test(norm)) inputs.cuadros = 1;
    if(!(inputs.estantes + inputs.cortineros + inputs.tv + inputs.cuadros)) inputs.estantes = 2;
    inputs.pared = /\b(durlock|yeso|placa)\b/.test(norm) ? "durlock" : /\b(hormigon|concreto|losa)\b/.test(norm) ? "hormigon" : "ladrillo";
    details.push(`pared de ${inputs.pared}`);
  } else if(jobId === "pared"){
    const mM2 = norm.match(/(\d+(?:[.,]\d+)?)\s*(?:m2|m²|metros?\s*cuadrados?)\b/);
    if(mM2){
      inputs.m2 = clamp("m2", Math.round(parseFloat(mM2[1].replace(",","."))*10)/10);
      details.push(`${fmtQ(inputs.m2)} m²`);
    } else if(dimMatches.length){
      const area = (dimMatches[0].ancho / 100) * (dimMatches[0].alto / 100);
      inputs.m2 = clamp("m2", Math.max(0.2, Math.round(area*10)/10));
      details.push(`${fmtQ(inputs.m2)} m²`);
    }
    inputs.retoque = !/\b(sin pintar|sin pintura|no pintar)\b/.test(norm);
  } else {
    /* Otro trabajo general */
    const firstLine = raw.split(/\r?\n/).map(s=>s.trim()).find(Boolean) || "Trabajo a medida";
    inputs.texto = firstLine.length > 56 ? firstLine.slice(0, 53) + "..." : firstLine;
    const mh = norm.match(/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)\b/);
    if(mh) inputs.horas = clamp("horas", parseFloat(mh[1].replace(",",".")));
  }

  const noteParts = [`Cargado desde Clickie: ${job.name}`];
  if(details.length) noteParts.push(`(${details.join(" · ")})`);
  if(urgente) noteParts.push("· Urgente/finde activado");
  if(missing.length) noteParts.push(`· Faltan ${missing.join(", ")}. Podés tocar "Pedir medidas" arriba.`);
  else noteParts.push("· Revisá las medidas o pasá al Paso 3 para copiar el presupuesto.");

  return {
    jobId,
    inputs,
    extraItems,
    extraMats,
    cliente,
    urgente,
    clienteCompra,
    usarComision,
    missing,
    note: noteParts.join(" ")
  };
}

if(typeof module!=="undefined") module.exports={

};

let dlgAction=null, dlgTrigger=null;

function askConfirm(title, desc, okLabel, triggerEl, onOk){
  if(!dlg || typeof dlg.showModal!=="function"){ onOk(); return; }
  document.getElementById("dlgTitle").textContent=title;
  document.getElementById("dlgDesc").textContent=desc;
  const okBtn=document.getElementById("dlgOk");
  okBtn.textContent=okLabel||"Confirmar";
  dlgAction=onOk;
  dlgTrigger=triggerEl||document.activeElement;
  dlg.showModal();
  document.getElementById("dlgCancel").focus();
}
function closeDlg(){
  if(dlg && dlg.open) dlg.close();
  if(dlgTrigger && typeof dlgTrigger.focus==="function") dlgTrigger.focus();
  dlgAction=null; dlgTrigger=null;
}
if(dlg){
  document.getElementById("dlgCancel").addEventListener("click", closeDlg);
  document.getElementById("dlgOk").addEventListener("click",()=>{ const fn=dlgAction; closeDlg(); if(fn) fn(); });
  dlg.addEventListener("cancel",e=>{ e.preventDefault(); closeDlg(); });
}

function toast(t){
  const el=document.getElementById("toast");
  el.textContent=t; el.classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove("on"),2000);
}

function renderCartBar(){
  if(!cartbar) return;
  const items = Object.entries(S.repCart).filter(([,q])=>q>0);

    cartbar.classList.add("hidden");
    app.style.paddingBottom="";

  const all=getAllCatalog(customMats);
  let totalQty=0, totalCost=0;
  items.forEach(([k,q])=>{ totalQty+=q; totalCost+=q*(prices[k]??all[k]?.p??0); });

  app.style.paddingBottom="calc(190px + env(safe-area-inset-bottom))";
  cartbar.innerHTML=`
